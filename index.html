<meta charset="utf-8">

<title>La Compagnie de l'Aube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #110e15; --panel: #1c1722; --card: #241e2c; --card-done: #1d2a22;
    --line: #362e40; --text: #ece6f2; --muted: #9a90a6;
    --gold: #d4ad3c; --xp: #9b5de5; --xp2: #c08cff; --pv: #e05555; --ok: #4fbf7a;
    --warn: #e0a040; --rest: #5b8fd6; --epic: #b06cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, -apple-system, sans-serif; }
  body { padding: 0 0 48px; min-height: 100vh;
    background: radial-gradient(ellipse at top, #2a1f38 0%, var(--bg) 55%); }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px; }

  /* En-tête personnage */
  header { padding: 22px 0 6px; }
  .hero-row { display: flex; align-items: center; gap: 14px; }
  .profil { cursor: pointer; margin: -6px -8px; padding: 6px 8px; border-radius: 14px; -webkit-tap-highlight-color: transparent; transition: background .15s; }
  .profil:active { background: #221c2a; }
  .profil .hero-txt { flex: 1; min-width: 0; }
  .profil .chev { color: var(--gold); font-size: 26px; line-height: 1; opacity: .7; }
  .lvl { width: 66px; height: 66px; flex: none; border-radius: 50%;
    display: grid; place-items: center; position: relative;
    background: conic-gradient(var(--gold) calc(var(--p) * 1%), #3a3145 0);
    box-shadow: 0 0 24px rgba(212,173,60,.25); }
  .lvl::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--panel); }
  .lvl span { position: relative; font-family: Cinzel, serif; font-weight: 800; font-size: 24px; color: var(--gold); }
  .lvl small { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: .08em; background: var(--gold); color: #1a1408;
    padding: 1px 6px; border-radius: 6px; font-weight: 700; }
  .hero-name { font-family: Cinzel, serif; font-size: 21px; font-weight: 800; letter-spacing: .02em; line-height: 1.15; }
  .hero-title { font-family: Cinzel, serif; color: var(--gold); font-size: 14px; font-style: italic; margin-top: 2px; }
  .hero-sub { color: var(--muted); font-size: 12px; margin-top: 3px; }

  .bars { margin-top: 16px; display: grid; gap: 10px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .bar-label b { color: var(--text); font-weight: 600; }
  .bar { height: 10px; border-radius: 6px; background: #2c2535; overflow: hidden; position: relative; }
  .bar > i { display: block; height: 100%; border-radius: 6px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .bar.xp > i { background: linear-gradient(90deg, var(--xp), var(--xp2)); }
  .bar.pv > i { background: linear-gradient(90deg, #b83a3a, var(--pv)); }

  /* Filtre Perso / Pro */
  .filters { display: flex; gap: 8px; margin: 18px 0 4px; }
  .filters button { flex: 1; padding: 8px 0; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font: 600 13px Inter, sans-serif; cursor: pointer; }
  .filters button.on { background: var(--card); color: var(--text); border-color: var(--gold); }

  .section { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 0 10px; }
  .section h2 { margin: 0; font-family: Cinzel, serif; font-size: 15px; letter-spacing: .06em; color: var(--gold); text-transform: uppercase; }
  .section span { font-size: 12px; color: var(--muted); }
  .empty { padding: 16px; border-radius: 14px; border: 1px dashed var(--line); color: var(--muted); font-size: 13px; text-align: center; }

  /* Cartes */
  .list { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
  .card { display: flex; align-items: center; gap: 12px; padding: 13px 12px 13px 14px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line); cursor: pointer; user-select: none;
    transition: transform .12s, background .25s, border-color .25s; position: relative; }
  .card:active { transform: scale(.98); }
  .card.small { padding: 10px 12px; opacity: .85; }
  .card.small .icon { width: 34px; height: 34px; font-size: 17px; }
  .card.small .name { font-size: 14px; }
  .card.annexe { border-left: 3px solid var(--gold); }
  .card.done { background: var(--card-done); border-color: #2f5a3e; }
  .card.missed { border-color: #6a2e2e; }
  .card.rest { border-color: #2e466a; }
  .card.busy { opacity: .5; pointer-events: none; }
  .icon { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center;
    font-size: 21px; background: #2f2739; }
  .card.done .icon { background: #24402f; }
  .body { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .meta .pro { color: var(--warn); font-weight: 600; }
  .meta .bonus { color: var(--gold); font-weight: 600; }
  .right { text-align: right; flex: none; }
  .week { font-size: 12px; color: var(--muted); }
  .week b { color: var(--text); }
  .week.ok b { color: var(--ok); }
  .chip { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  .chip.f { background: #24402f; color: var(--ok); }
  .chip.r { background: #4a2323; color: #ff8b8b; }
  .chip.p { background: #22344f; color: #8fb6ee; }
  .chip.n { background: #2f2739; color: var(--muted); font-weight: 600; }
  .more { width: 32px; height: 32px; flex: none; border: 0; border-radius: 10px; background: transparent;
    color: var(--muted); font-size: 20px; cursor: pointer; }
  .more:active { background: #2f2739; }

  /* Quêtes épiques */
  .epic { padding: 14px; border-radius: 14px; background: linear-gradient(135deg, #2a1f3a, #221b2b);
    border: 1px solid #4a3866; }
  .epic-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .epic-name { font-weight: 700; font-size: 14px; }
  .epic-reward { font-size: 12px; color: var(--gold); white-space: nowrap; font-weight: 600; }
  .epic .bar { height: 8px; margin: 10px 0 6px; }
  .epic .bar > i { background: linear-gradient(90deg, #7b3fd1, var(--epic)); }
  .epic .bar .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--gold); border-radius: 1px; }
  .epic-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .st-ok { color: var(--ok); font-weight: 600; } .st-late { color: var(--warn); font-weight: 600; }
  .st-done { color: var(--gold); font-weight: 700; } .st-fail { color: var(--pv); font-weight: 600; }

  .streak { color: #ff9b4a; font-weight: 700; }
  .etat { margin-top: 12px; padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 1.45; }
  .etat.epuise { background: #3a2a14; border: 1px solid #7a5a22; color: #f3d39a; }
  .etat.terre { background: #3a1717; border: 1px solid #8a3030; color: #ffc2c2; }
  .etat b { color: #fff; }
  .etat.vac { background: #12303a; border: 1px solid #2c6a7a; color: #bfe8f2; }
  .etat button, .vac-btn { margin-top: 8px; padding: 8px 12px; border-radius: 10px; border: 1px solid #2c6a7a;
    background: #173d49; color: #e6f7fb; font: 600 13px Inter, sans-serif; cursor: pointer; }
  .vac-btn { display: block; width: 100%; margin-top: 22px; background: transparent; border-style: dashed; color: var(--muted); border-color: var(--line); }
  .pips { display: inline-flex; gap: 5px; margin-left: 6px; vertical-align: middle; }
  .pips i { width: 10px; height: 10px; border-radius: 50%; background: #5a2a2a; border: 1px solid #a04545; }
  .pips i.on { background: var(--ok); border-color: var(--ok); }
  .joker { display: inline-block; margin-left: 6px; font-size: 11px; padding: 1px 7px; border-radius: 8px;
    background: #22344f; color: #8fb6ee; font-weight: 600; }
  /* Bilan */
  .bilan { padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  .bilan.dimanche { background: linear-gradient(135deg, #2b2410, #1f1a12); border-color: #6a5320; }
  .bilan h3 { margin: 0 0 4px; font-family: Cinzel, serif; color: var(--gold); font-size: 16px; }
  .bilan .sous { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .kpi { background: rgba(255,255,255,.04); border-radius: 10px; padding: 10px 8px; text-align: center; }
  .kpi b { display: block; font-family: Cinzel, serif; font-size: 20px; }
  .kpi span { font-size: 11px; color: var(--muted); }
  .kpi .up { color: var(--ok); font-size: 11px; font-weight: 600; } .kpi .down { color: var(--pv); font-size: 11px; font-weight: 600; }
  .bilan p { margin: 12px 0 0; font-size: 13px; line-height: 1.5; }
  .bonus-pop { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); z-index: 28; pointer-events: none;
    background: linear-gradient(135deg, #3a2a0e, #241a08); border: 1px solid var(--gold); border-radius: 16px;
    padding: 16px 22px; text-align: center; animation: pop 2.6s forwards; min-width: 240px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .bonus-pop b { display: block; font-family: Cinzel, serif; color: var(--gold); font-size: 22px; }
  .bonus-pop span { font-size: 13px; color: var(--text); }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.9); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1.03); }
    80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -20px); } }
  .compagnie { text-align: center; padding-top: 16px; }
  .compagnie b { display: block; font-family: Cinzel, serif; font-size: 12px; letter-spacing: .22em; color: var(--gold); text-transform: uppercase; }
  .compagnie span { display: block; font-size: 11px; color: var(--muted); font-style: italic; margin-top: 3px; }
  /* Avatar */
  @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .95; transform: scale(1.05); } }
  @keyframes sway { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(1.4deg); } }
  @keyframes floatp { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-70px); opacity: 0; } }
  @keyframes glow { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  svg .aura { transform-origin: 100px 140px; animation: pulse 3.2s ease-in-out infinite; }
  svg .cape { transform-origin: 100px 100px; animation: sway 4s ease-in-out infinite; }
  svg .p { animation: floatp 3.6s linear infinite; }
  svg .eyes { animation: glow 1.8s ease-in-out infinite; }
  svg .spin { animation: spin 14s linear infinite; }
  svg .bob { animation: bob 2.6s ease-in-out infinite; }
  .hero-card { margin-top: 18px; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; align-items: center;
    padding: 12px; border-radius: 16px; border: 1px solid #4a3866; background: radial-gradient(circle at 25% 50%, #2c2142, #1c1722 70%); }
  .hero-card svg { width: 150px; height: auto; display: block; }
  .classe { font-family: Cinzel, serif; color: var(--gold); font-size: 17px; font-weight: 800; }
  .classe-sub { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
  .sous { font-size: 11.5px; color: var(--muted); font-style: italic; margin: 1px 0 2px; font-weight: 400; font-family: inherit; letter-spacing: 0; }
  .next-evo { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px; border-radius: 10px; background: rgba(255,255,255,.04); font-size: 12px; }
  .next-evo svg { width: 38px; filter: brightness(0) invert(.35); opacity: .7; }
  /* d20 du jour */
  .d20-ov { position: fixed; inset: 0; z-index: 40; display: none; place-items: center; padding: 16px;
    background: radial-gradient(circle at 50% 38%, rgba(212,173,60,.28), transparent 62%), rgba(14,11,18,.985); }
  .d20-ov.on { display: grid; }
  .d20-box { width: 100%; max-width: 360px; text-align: center; }
  .d20-box h2 { font-family: Cinzel, serif; color: var(--gold); font-size: 22px; margin: 0 0 6px; letter-spacing: .04em; }
  .d20-sub { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 0 0 6px; }
  .d20 { width: 170px; height: 170px; display: block; margin: 10px auto; filter: drop-shadow(0 8px 18px rgba(0,0,0,.55)); }
  .d20 text { font-family: Cinzel, serif; font-weight: 800; }
  .d20.roule { animation: rouler .35s linear infinite; }
  @keyframes rouler { 0% { transform: rotate(0) scale(.92); } 50% { transform: rotate(180deg) scale(1.05); } 100% { transform: rotate(360deg) scale(.92); } }
  .d20.pose { animation: poser .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes poser { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .d20.crit { filter: drop-shadow(0 0 22px rgba(255,214,102,.95)) drop-shadow(0 0 40px rgba(255,170,40,.6)); animation: poser .45s cubic-bezier(.2,1.6,.4,1), pulse 1.2s ease-in-out .45s infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .d20.fumble { filter: grayscale(.7) drop-shadow(0 8px 18px rgba(0,0,0,.6)); animation: secouer .5s; }
  @keyframes secouer { 20%, 60% { transform: translateX(-7px) rotate(-4deg); } 40%, 80% { transform: translateX(7px) rotate(4deg); } }
  .d20-res { min-height: 92px; }
  .d20-res .calc { color: var(--muted); font-size: 13px; }
  .d20-res .titre { font-family: Cinzel, serif; font-size: 21px; font-weight: 800; color: var(--gold); margin: 4px 0; }
  .d20-res .titre.crit { color: #ffd666; text-shadow: 0 0 14px rgba(255,200,80,.7); }
  .d20-res .titre.fumble { color: #c9b9d6; }
  .d20-res .texte { font-size: 14px; line-height: 1.45; }
  .d20-res .mult { display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 99px; background: #2b2410; border: 1px solid #6a5320; color: var(--gold); font-weight: 700; font-size: 13px; }
  .d20-table { color: var(--muted); font-size: 11.5px; margin-top: 12px; line-height: 1.5; }
  .d20-res .mult.malus, .d20-card.malus b { color: #e07a6f; }
  .d20-res .mult.malus { border-color: #6b2a25; background: #2a1414; }
  .d20-vol { position: fixed; left: 0; top: 0; width: 110px; height: 110px; z-index: 41; pointer-events: none; }
  .d20-vol svg { width: 110px; height: 110px; margin: 0; filter: drop-shadow(0 10px 14px rgba(0,0,0,.6)); }
  .d20-later { background: none; border: 0; color: var(--muted); font-size: 13px; margin-top: 8px; text-decoration: underline; }
  .d20-card { display: flex; align-items: center; gap: 10px; width: 100%; margin: 4px 0 12px; padding: 12px 14px; border-radius: 14px; text-align: left;
    border: 1px solid #6a5320; background: linear-gradient(135deg, #2b2410, #1c1726); color: var(--gold); font: 700 15px Cinzel, serif; }
  .d20-card svg { width: 40px; height: 40px; flex: none; margin: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .d20-card div { line-height: 1.35; }
  .d20-card span { margin-left: auto; }
  .d20-card.fait { font: 600 13px inherit; font-family: inherit; color: var(--text); border-color: var(--line); background: var(--card); }
  .d20-card.fait b { color: var(--gold); }
  .sort { color: #c9a2ff; font-weight: 600; }
  .cst { display: block; margin-top: 4px; font-size: 12px; color: var(--gold); }
  .cact { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .cact select { flex: 1; min-width: 0; padding: 5px 8px; border-radius: 8px; background: var(--card); color: var(--text); border: 1px solid var(--line); font-size: 12px; }
  .capa { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .capa:last-child { border-bottom: 0; }
  .capa .lv { flex: none; width: 46px; text-align: center; font-family: Cinzel, serif; font-weight: 800; color: var(--gold); font-size: 12px; padding-top: 2px; }
  .capa.lock { opacity: .45; }
  .capa b { display: block; margin-bottom: 2px; }
  .capa span.d { color: var(--muted); font-size: 12px; line-height: 1.45; }
  .evolution { position: fixed; inset: 0; z-index: 31; display: grid; place-items: center; pointer-events: none;
    background: radial-gradient(circle, rgba(201,162,255,.35), rgba(17,14,21,.95) 70%); animation: fade 3.2s forwards; }
  .evolution div { text-align: center; font-family: Cinzel, serif; color: var(--gold); }
  .evolution svg { width: 220px; display: block; margin: 0 auto 8px; }
  .evolution b { display: block; font-size: 30px; font-weight: 800; }
  .evolution span { font-size: 16px; color: var(--text); }
  /* Onglets */
  body { padding-bottom: 96px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; justify-content: center; gap: 8px;
    padding: 8px 16px calc(10px + env(safe-area-inset-bottom)); background: rgba(17,14,21,.94);
    border-top: 1px solid var(--line); backdrop-filter: blur(8px); }
  .tabs button { flex: 1; max-width: 244px; position: relative; padding: 8px 0 6px; border: 0; border-radius: 12px; background: transparent;
    color: var(--muted); font: 600 12px Inter, sans-serif; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tabs button span { font-size: 20px; filter: grayscale(.6); }
  .tabs button.on { color: var(--gold); background: #221c2a; }
  .tabs button.on span { filter: none; }
  .comp { display: flex; gap: 12px; align-items: center; background: var(--panel, #1c1722); border: 1px solid #362e40; border-radius: 16px; padding: 10px 12px; }
  .comp.moi { border-color: rgba(212,173,60,.45); }
  .comp-av { width: 74px; flex: none; } .comp-av svg { width: 74px; height: auto; display: block; }
  .comp-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
  .comp-txt b { color: var(--text); font-size: 15px; font-family: Cinzel, serif; } .comp-txt .tt { color: var(--gold); font-style: italic; }
  .comp-bilan { margin-top: 12px; text-align: center; font-size: 13px; color: var(--muted); } .comp-bilan b { color: var(--gold); font-size: 20px; }
  .aide-coop { text-align: center; font-size: 12px; color: var(--muted); margin: 12px 0 90px; }
  .choix { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px 16px; gap: 14px; }
  .choix h1 { font-family: Cinzel, serif; color: var(--gold); text-align: center; font-size: 22px; margin: 0; }
  .choix p { text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 6px; }
  .choix button { display: flex; align-items: center; gap: 14px; text-align: left; background: #1c1722; border: 1px solid #362e40; border-radius: 16px; padding: 10px 14px; color: var(--text); font: inherit; cursor: pointer; }
  .choix button:active { border-color: var(--gold); }
  .choix svg { width: 80px; height: auto; flex: none; } .choix b { font-family: Cinzel, serif; font-size: 17px; display: block; } .choix span { color: var(--muted); font-size: 12.5px; }
  .tabs button i { position: absolute; top: 4px; left: calc(50% + 10px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
    background: var(--pv); color: #fff; font: 700 10px/17px Inter, sans-serif; font-style: normal; }
  .rappel { display: flex; justify-content: space-between; width: 100%; margin-top: 16px; padding: 12px 14px; border-radius: 12px;
    border: 1px solid #6a5320; background: linear-gradient(135deg, #2b2410, #1f1a12); color: var(--gold); font: 600 14px Inter, sans-serif; cursor: pointer; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px 14px; }
  .serie-row { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
  .serie-row:last-child { border-bottom: 0; }
  .muted { color: var(--muted); }
  .stat2 { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .stat2-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; margin-bottom: 6px; }
  .stat2 .sc { font-family: Cinzel, serif; font-weight: 800; font-size: 18px; }
  .stat2 .md { color: var(--muted); font-size: 12px; }
  .stat2 .bar { height: 6px; }
  .stat2 .bar > i { background: linear-gradient(90deg, #3d6fb3, #6aa3ef); }
  .stat2-sub { font-size: 11px; color: var(--muted); margin-top: 5px; }
  .stat-note { font-size: 12px; color: var(--muted); padding: 10px 0 6px; line-height: 1.5; }
  /* Caractéristiques */
  details { margin-top: 26px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
  summary { list-style: none; cursor: pointer; padding: 10px 0; font-family: Cinzel, serif; font-size: 14px;
    letter-spacing: .06em; color: var(--gold); text-transform: uppercase; display: flex; justify-content: space-between; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "▾"; color: var(--muted); }
  details[open] summary::after { content: "▴"; }
  .stat { display: grid; grid-template-columns: 26px 1fr 44px 34px; align-items: center; gap: 8px; padding: 7px 0; font-size: 13px; }
  .stat .bar { height: 6px; }
  .stat .bar > i { background: linear-gradient(90deg, #3d6fb3, #6aa3ef); }
  .stat .sc { font-family: Cinzel, serif; font-weight: 800; text-align: right; }
  .stat .md { color: var(--muted); font-size: 12px; text-align: right; }
  .stat .nm { font-size: 12px; color: var(--muted); margin-bottom: 3px; }

  /* Menu d'actions */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .sheet-bg.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--panel);
    border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 18px 16px 28px;
    transform: translateY(105%); visibility: hidden; transition: transform .25s cubic-bezier(.2,.8,.2,1), visibility 0s .25s;
    max-width: 520px; margin: 0 auto; }
  .sheet.on { transform: none; visibility: visible; transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  .sheet h3 { margin: 0 0 12px; font-size: 15px; }
  .sheet button { width: 100%; padding: 14px; margin-top: 8px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: 600 15px Inter, sans-serif; text-align: left; cursor: pointer; }
  .sheet button.cancel { text-align: center; background: transparent; color: var(--muted); }

  /* Retours visuels */
  .float { position: fixed; left: 50%; top: 40%; transform: translate(-50%, 0); z-index: 20;
    font-family: Cinzel, serif; font-weight: 800; font-size: 28px; pointer-events: none; white-space: nowrap;
    animation: rise 1.1s ease-out forwards; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.8); }
    20% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -70px) scale(1); } }
  .levelup { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; pointer-events: none;
    background: radial-gradient(circle, rgba(212,173,60,.35), rgba(17,14,21,.9) 70%); animation: fade 2.6s forwards; }
  .levelup div { text-align: center; font-family: Cinzel, serif; color: var(--gold); padding: 0 20px; }
  .levelup b { display: block; font-size: 40px; font-weight: 800; letter-spacing: .05em; }
  .levelup span { font-size: 18px; color: var(--text); }
  @keyframes fade { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 25;
    background: #3a1f1f; color: #ffc2c2; padding: 10px 14px; border-radius: 10px; font-size: 13px; display: none; }
  .loading { text-align: center; color: var(--muted); padding: 60px 0; font-size: 14px; }
  .demo { text-align: center; font-size: 11px; color: var(--warn); padding-top: 10px; }

  /* Profil */
  .back { margin: 16px 0 0; padding: 6px 0; border: 0; background: none; color: var(--gold); font: 600 14px Inter, sans-serif; cursor: pointer; }
  .id-card { margin-top: 10px; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .id-card svg { width: 92px; height: auto; display: block; }
  .id-card .nm { font-family: Cinzel, serif; font-size: 18px; font-weight: 800; }
  .id-card .tt { color: var(--gold); font-size: 13px; margin-top: 2px; }
  .devise { margin-top: 8px; font-style: italic; font-size: 13px; color: #d9cfe6; line-height: 1.4; }
  .devise.vide { color: var(--muted); }
  .lien { border: 0; background: none; color: var(--gold); font: 600 12px Inter, sans-serif; padding: 4px 0 0; cursor: pointer; }
  .grid-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .grid-wrap canvas { display: block; margin: 0 auto; max-width: 100%; height: auto; }
  .grid-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .grid-info b { color: var(--text); }
  .legende { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font-size: 11px; color: var(--muted); }
  .legende i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .records { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .rec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .rec b { display: block; font-family: Cinzel, serif; font-size: 19px; color: var(--gold); }
  .rec span { font-size: 11px; color: var(--muted); line-height: 1.35; display: block; }
  .histoire { font-size: 13px; line-height: 1.55; color: #ddd3ea; padding: 10px 0; }
  .histoire p { margin: 0 0 8px; } .histoire p:last-child { margin: 0; color: var(--muted); font-size: 12px; }
  .evo { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .evo:last-child { border-bottom: 0; }
  .evo .lv { flex: none; width: 46px; text-align: center; font-family: Cinzel, serif; font-weight: 800; color: var(--gold); font-size: 12px; }
  .evo.lock { opacity: .45; } .evo.ici { background: rgba(212,173,60,.08); margin: 0 -14px; padding: 9px 14px; }
  .evo b { display: block; } .evo span { color: var(--muted); font-size: 12px; }
  .reg { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .reg h3 { margin: 0 0 4px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  .reg .aide { font-size: 12px; color: var(--muted); line-height: 1.45; margin-bottom: 8px; }
  .reg .ligne { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .reg .ligne:first-of-type { border-top: 0; }
  .reg input[type=date], .reg select, .reg input[type=text] { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 8px; font: 13px Inter, sans-serif; min-width: 0; }
  .reg .form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 6px; }
  .reg .form label { font-size: 11px; color: var(--muted); display: grid; gap: 4px; }
  .btn { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    font: 600 13px Inter, sans-serif; cursor: pointer; }
  .btn.or { border-color: #6a5320; background: #2b2410; color: var(--gold); }
  .btn.plein { width: 100%; margin-top: 8px; }
  .btn.mini { padding: 5px 9px; font-size: 12px; }
  .btn:disabled { opacity: .45; }
  .sw { position: relative; width: 44px; height: 26px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; background: #3a3145; border-radius: 13px; transition: .2s; }
  .sw span::before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .sw input:checked + span { background: var(--gold); }
  .sw input:checked + span::before { transform: translateX(18px); }
  .modes { display: grid; gap: 6px; }
  .mode { text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; font: 13px Inter, sans-serif; }
  .mode b { display: block; margin-bottom: 2px; } .mode span { font-size: 12px; color: var(--muted); }
  .mode.on { border-color: var(--gold); background: #2b2410; } .mode.on b { color: var(--gold); }
  .mode:disabled:not(.on) { opacity: .45; }
  .pause-note { display: block; width: 100%; margin-top: 14px; padding: 10px; border-radius: 12px; border: 1px dashed var(--line);
    background: transparent; color: var(--muted); font: 13px Inter, sans-serif; cursor: pointer; }
  .chip.d { background: #1f2a3a; color: #9fc2ef; }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><div class="loading">Chargement de ta feuille de personnage…</div></div>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <h3 id="sheetTitle"></h3>
  <button data-act="Fait">✅ Fait</button>
  <button data-act="hier">⏪ C'était hier (oubli de saisie)</button>
  <button data-act="Raté">❌ Raté (−PV)</button>
  <button data-act="Repos" id="btnRepos">💤 Repos (utilise le joker de la semaine)</button>
  <button data-act="undo">↩️ Annuler la dernière saisie du jour</button>
  <button data-act="renommer">✏️ Renommer la quête</button>
  <button class="cancel" data-act="close">Fermer</button>
</div>
<div class="toast" id="toast"></div>
<div class="d20-ov" id="d20ov"></div>

<script>
/* Magicien : personnage SVG par calques, 8 paliers (0 = niveau 1 … 7 = niveau 100) */
const PALIERS_MAGE = [
  { n: 1, titre: "l'Apprenti", desc: 'Robe de laine, baguette de bois, premier grimoire.' },
  { n: 5, titre: "l'Aventurier", desc: 'Robe bleue, chapeau pointu, bâton de voyage.' },
  { n: 10, titre: 'le Vagabond', desc: 'Grand manteau, bâton à cristal, parchemins à la ceinture.' },
  { n: 20, titre: 'le Chevalier', desc: 'Robe de mage de bataille, mantelet, runes dorées.' },
  { n: 35, titre: 'le Champion', desc: 'Cristal lumineux, grimoire flottant, première aura.' },
  { n: 50, titre: 'le Héros', desc: 'Robe d\'archiviste violette, chapeau étoilé, aura dorée.' },
  { n: 75, titre: 'le Légendaire', desc: 'Regard arcanique, cercle de runes sous les pieds.' },
  { n: 100, titre: "l'Ascendant", desc: 'Lévitation, halo de lumière, trois orbes en orbite.' }
];
function palierMage(niveau) {
  let i = 0;
  PALIERS_MAGE.forEach((p, k) => { if (niveau >= p.n) i = k; });
  return i;
}

function magicien(st, id) {
  const C = {
    peau: '#e3bd98', cheveux: '#3b2a20',
    robe: ['#86735c', '#3456a6', '#3456a6', '#2f48a0', '#2f48a0', '#5a2f96', '#4c2a8c', '#45267f'][st],
    robeOmbre: ['#5a4a38', '#1f3470', '#1f3470', '#1b2c66', '#1b2c66', '#331a5c', '#2a1652', '#25134a'][st],
    peauOmbre: '#c0916c', yeux: '#6b4a2c',
    manteau: '#3a2a5a', manteauOmbre: '#261a3e', or: '#d4ad3c', cuir: '#5a3a22',
    cristal: st >= 7 ? '#fffbe6' : st >= 4 ? '#8ff0ff' : '#9fd6e8', bois: '#6a4426'
  };
  const auraCol = st >= 7 ? '#fff3c4' : st >= 5 ? '#c9a2ff' : '#7fd6ff';
  const lev = st >= 7 ? -10 : 0; // lévitation au palier ultime
  let s = `<svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Magicien, palier ${st + 1}">
  <defs>
    <radialGradient id="mau${id}" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${auraCol}" stop-opacity="${st >= 7 ? .7 : .45}"/>
      <stop offset="60%" stop-color="${auraCol}" stop-opacity="${st >= 7 ? .22 : .12}"/>
      <stop offset="100%" stop-color="${auraCol}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mcr${id}" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="${C.cristal}"/><stop offset="100%" stop-color="${C.cristal}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mro${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${C.robe}"/><stop offset="100%" stop-color="${C.robeOmbre}"/>
    </linearGradient>
    <linearGradient id="mlat${id}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity=".16"/><stop offset="35%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="65%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="mvis${id}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity=".10"/><stop offset="45%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="mhs${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity=".38"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mfc${id}"><path d="M85.5,72 Q85.5,57 100,57 Q114.5,57 114.5,72 Q114.5,82 110,88 Q105,94.5 100,94.5 Q95,94.5 90,88 Q85.5,82 85.5,72Z"/></clipPath>
  </defs>`;

  // Aura (35+)
  if (st >= 4) s += `<circle class="aura" cx="100" cy="${140 + lev}" r="${st >= 7 ? 98 : st >= 5 ? 88 : 78}" fill="url(#mau${id})"/>`;
  // Halo (100)
  if (st >= 7) s += `<g class="spin" style="transform-origin:100px 66px"><circle cx="100" cy="66" r="40" fill="none" stroke="#fff3c4" stroke-width="2" stroke-dasharray="6 5" opacity=".8"/></g>
    <circle cx="100" cy="66" r="30" fill="none" stroke="#ffe9a0" stroke-width="1.2" opacity=".6"/>`;
  // Cercle de runes au sol (75+)
  if (st >= 6) {
    let runes = '';
    for (let i = 0; i < 12; i++) {
      const a = i * 30 * Math.PI / 180, x = 100 + Math.cos(a) * 52, y = 242 + Math.sin(a) * 11;
      runes += `<path d="M${x - 2},${y} l2,-3 l2,3 z" fill="${st >= 7 ? '#ffe9a0' : '#c9a2ff'}"/>`;
    }
    s += `<g class="eyes"><ellipse cx="100" cy="242" rx="58" ry="13" fill="none" stroke="${st >= 7 ? '#ffe9a0' : '#c9a2ff'}" stroke-width="1.5"/>
      <ellipse cx="100" cy="242" rx="46" ry="9" fill="none" stroke="${st >= 7 ? '#ffe9a0' : '#c9a2ff'}" stroke-width="1" stroke-dasharray="3 3"/>${runes}</g>`;
  } else {
    s += `<ellipse cx="100" cy="243" rx="${st >= 5 ? 50 : 42}" ry="7" fill="#000" opacity=".45"/>`;
  }

  s += `<g transform="translate(0,${lev})">`;
  // Manteau (10+) derrière
  if (st >= 2) s += `<g class="cape"><path d="M78,100 L${st >= 5 ? 52 : 58},236 Q100,244 ${st >= 5 ? 148 : 142},236 L122,100 Z" fill="${C.manteau}"/>
    <path d="M122,100 L${st >= 5 ? 148 : 142},236 L${st >= 5 ? 132 : 128},238 L118,104Z" fill="#000" opacity=".25"/>
    <path d="M78,100 L${st >= 5 ? 52 : 58},236" stroke="#fff" stroke-width="1.2" opacity=".15"/>
    ${st >= 3 ? `<path d="M${st >= 5 ? 52 : 58},236 Q100,244 ${st >= 5 ? 148 : 142},236" fill="none" stroke="${C.or}" stroke-width="2.5"/>` : ''}</g>`;

  // Bâton (5+) à droite, derrière la main
  if (st >= 1) {
    const haut = st >= 2 ? 56 : 92;
    s += `<path d="M136,${haut} L134,238" stroke="${st >= 7 ? '#fff3c4' : C.bois}" stroke-width="${st >= 5 ? 5 : 4}" stroke-linecap="round"/>`;
    if (st >= 2) {
      s += `<path d="M136,${haut + 6} q-8,-8 0,-16 q8,8 0,16z" fill="none" stroke="${st >= 3 ? C.or : C.bois}" stroke-width="2.5"/>
        <path d="M136,${haut - 16} l6,9 l-6,9 l-6,-9z" fill="${C.cristal}"/>`;
      if (st >= 4) s += `<circle class="eyes" cx="136" cy="${haut - 7}" r="${st >= 7 ? 18 : 13}" fill="url(#mcr${id})"/>`;
    } else {
      s += `<circle cx="136" cy="${haut - 2}" r="4" fill="${C.bois}"/>`;
    }
  }

  // Robe longue (cache les jambes)
  s += `<path d="M76,102 Q100,93 124,102 L${st >= 5 ? 138 : 134},236 Q100,244 ${st >= 5 ? 62 : 66},236Z" fill="url(#mro${id})"/>`;
  s += `<path d="M76,102 Q100,93 124,102 L${st >= 5 ? 138 : 134},236 Q100,244 ${st >= 5 ? 62 : 66},236Z" fill="url(#mlat${id})"/>
    <path d="M88,160 Q86,200 82,234 M112,160 Q115,200 120,234 M95,170 Q94,205 93,238" stroke="#000" stroke-width="1.3" opacity=".18" fill="none"/>
    <path d="M84,112 Q80,170 72,232" stroke="#fff" stroke-width="1.2" opacity=".12" fill="none"/>`;
  s += `<path d="M100,104 L100,238" stroke="${C.robeOmbre}" stroke-width="2" opacity=".6"/>`;
  // Bordure et runes dorées (20+)
  if (st >= 3) {
    s += `<path d="M${st >= 5 ? 62 : 66},236 Q100,244 ${st >= 5 ? 138 : 134},236" fill="none" stroke="${C.or}" stroke-width="3"/>
      <path d="M100,104 L100,238" stroke="${C.or}" stroke-width="2" opacity=".85"/>`;
    const runes = [[86, 196], [114, 204], [90, 220], [110, 180]];
    s += runes.map(([x, y]) => `<path d="M${x},${y} l3,-5 l3,5 m-3,-5 v8" stroke="${C.or}" stroke-width="1.2" fill="none" opacity=".9"/>`).join('');
  }
  // Pieds
  s += `<ellipse cx="90" cy="239" rx="8" ry="3.5" fill="#2c211a"/><ellipse cx="110" cy="239" rx="8" ry="3.5" fill="#2c211a"/>`;

  // Bras / manches évasées
  s += `<path d="M76,104 Q64,130 60,166 L76,166 Q78,136 84,112Z" fill="url(#mro${id})"/>
    <path d="M124,104 Q136,130 140,166 L124,166 Q122,136 116,112Z" fill="url(#mro${id})"/>
    <path d="M124,104 Q136,130 140,166 L132,166 Q128,136 120,108Z" fill="#000" opacity=".2"/>
    <path d="M76,104 Q66,128 61,164" stroke="#fff" stroke-width="1.1" opacity=".14" fill="none"/>`;
  if (st >= 3) s += `<path d="M60,166 L76,166 M124,166 L140,166" stroke="${C.or}" stroke-width="2.5"/>`;
  // Ceinture + sacoche / parchemins
  s += `<rect x="74" y="148" width="52" height="6" rx="2" fill="${st >= 3 ? C.or : C.cuir}"/>`;
  if (st === 1) s += `<path d="M120,104 L84,152" stroke="${C.cuir}" stroke-width="4"/><rect x="76" y="150" width="16" height="14" rx="3" fill="${C.cuir}"/>`;
  if (st >= 2) s += `<rect x="80" y="154" width="5" height="16" rx="2" fill="#efe3c4" transform="rotate(-8 82 162)"/><rect x="87" y="154" width="5" height="14" rx="2" fill="#e6d6b0" transform="rotate(6 89 161)"/>`;
  // Mantelet (20+)
  if (st >= 3) s += `<path d="M74,104 Q100,90 126,104 L122,124 Q100,116 78,124Z" fill="${st >= 5 ? '#2a1648' : C.robeOmbre}" stroke="${C.or}" stroke-width="1.5"/>
    <path d="M100,108 l3,6 l6,0 l-5,4 l2,6 l-6,-4 l-6,4 l2,-6 l-5,-4 l6,0z" fill="${C.or}"/>`;
  // Mains
  s += `<circle cx="68" cy="168" r="5.5" fill="${C.peau}"/><circle cx="132" cy="168" r="5.5" fill="${C.peau}"/>`;
  // Baguette + grimoire (1)
  if (st === 0) s += `<path d="M132,168 L148,146" stroke="${C.bois}" stroke-width="3" stroke-linecap="round"/><circle cx="148" cy="146" r="2.5" fill="#bfefff"/>
    <rect x="56" y="150" width="20" height="24" rx="2" fill="#6a3a2a" transform="rotate(-10 66 162)"/><rect x="58" y="152" width="3" height="20" fill="${C.or}" transform="rotate(-10 66 162)"/>`;

  // Chapeau : arrière du bord, derrière la tête
  if (st >= 1 && st < 7) s += `<ellipse cx="100" cy="63" rx="${st >= 5 ? 33 : 29}" ry="7" fill="${C.robeOmbre}"/>
    <path d="M84,64 Q82,76 86,84 L90,80 L88,66Z M116,64 Q118,76 114,84 L110,80 L112,66Z" fill="${C.cheveux}"/>`;
  // Cou + tête (visage détaillé : mâchoire, oreilles, yeux en amande, nez, sourire)

  // Grimoire flottant (35+)
  if (st >= 4) s += `<g class="bob"><rect x="38" y="108" width="24" height="18" rx="2" fill="${st >= 5 ? '#4a1f2a' : '#5a3a2a'}" transform="rotate(-12 50 117)"/>

  // Orbes (100)
  if (st >= 7) s += `<g class="spin" style="transform-origin:100px 150px">

    s += pts.map(([x, y, d]) => `<circle class="p" style="animation-delay:${d}s" cx="${x}" cy="${y}" r="2" fill="${st >= 7 ? '#ffe9a0' : '#d9b8ff'}"/>`).join('');
  }
  return s + '</g></svg>';
}

/* ---------- Outils de date ---------- */
function versDate(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
function ecartJours(a, b) { return Math.round((versDate(b) - versDate(a)) / 864e5); }
function indexJour(iso) { return (versDate(iso).getDay() + 6) % 7; } // 0 = lundi
function dateLongue(iso) {
  const t = versDate(iso).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function dateCourte(iso) { return versDate(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); }

/** Prochaine occurrence d'une habitude, en texte court. */
function plusJours(iso, n) { const d = versDate(iso); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
/** Routine prévue ce jour-là ? (décalages compris) */
function prevu(h, iso) {
  const decs = h.decalages || [];
  if (decs.some(x => x.a === iso)) return true;
  if (decs.some(x => x.de === iso)) return false;
  return h.jours.split(',').map(s => s.trim()).includes(JOURS[indexJour(iso)]);
}
function prochaine(h) {
  if (h.prochaine !== undefined) { // calculée par le serveur avec la règle unique
    if (!h.prochaine) return h.enPause ? 'en pause' : '';
    const k = ecartJours(state.today, h.prochaine);
    return k === 1 ? 'demain' : k < 7 ? JOURS_LONGS[indexJour(h.prochaine)] : `dans ${k} j`;
  }
  if (h.type === 'Routine') {
    for (let k = 1; k <= 7; k++) {
      const d = plusJours(state.today, k);
      if (prevu(h, d)) return k === 1 ? 'demain' : JOURS_LONGS[indexJour(d)];
    }
    return '';
  }
  if (!h.derniere || h.derniere === 'Jamais') return 'dès que possible';
  const reste = h.tousLes - ecartJours(h.derniere, state.today);
  return reste <= 1 ? 'demain' : `dans ${reste} j`;
}

  const libre = !h.jour.fait && !h.jour.rate && !h.jour.repos;
  const droite = petite && libre ? `<span class="chip n">${prochaine(h)}</span>`
    : !petite && libre && h.type === 'Rythme' && h.marge === 0 ? '<span class="chip r">⚠️ dernier jour</span>'
    : chipJour(h.jour);
  return `<div class="card ${petite ? 'small' : ''} ${classeJour(h.jour)} ${busy.has(h.nom) ? 'busy' : ''}" data-q="${esc(h.nom)}">
    <div class="icon">${ICONES[h.carac] || '⭐'}</div>
    <div class="body">
      <div class="name">${esc(h.nom)}</div>${h.sous ? `<div class="sous">${esc(h.sous)}</div>` : ''}
      <div class="meta">${h.serieNb > 0 && h.serie > 0 ? `<span class="streak">🔥 ${h.serie} j</span> · ` : ''}${caracs(h)} · ${h.xp} XP · ${rythme}${h.categorie === 'Pro' ? ' · <span class="pro">Pro</span>' : ''}${sortSur(h.nom)}</div>
      ${(h.decalages || []).map(x => `<span class="chip d">↔ ${JOURS_LONGS[indexJour(x.de)]} → ${JOURS_LONGS[indexJour(x.a)]}</span>`).join(' ')}
    </div>
    <div class="right">
      <div class="week ${okSem ? 'ok' : ''}"><b>${h.semaine}/${h.objectif}</b> sem.</div>
      ${droite}
    </div>
    <button class="more" data-more="${esc(h.nom)}" aria-label="Plus d'options">⋯</button>
  </div>`;
}

function carteAnnexe(a) {
  let info = a.mensuel ? 'une fois par mois' : a.repetable ? (a.fois ? `faite ${a.fois} fois` : 'répétable') : 'unique';
  if (a.echeance) info += ` · avant le ${dateCourte(a.echeance)}`;
  return `<div class="card annexe ${classeJour(a.jour)} ${busy.has(a.nom) ? 'busy' : ''}" data-q="${esc(a.nom)}">
    <div class="icon">${ICONES[a.carac] || '⭐'}</div>
    <div class="body">
      <div class="name">${esc(a.nom)}</div>${a.sous ? `<div class="sous">${esc(a.sous)}</div>` : ''}
      <div class="meta"><span class="bonus">+${a.xp} XP</span> · ${caracs(a)} · ${info}${a.categorie === 'Pro' ? ' · <span class="pro">Pro</span>' : ''}${sortSur(a.nom)}</div>
    </div>
    <div class="right">${chipJour(a.jour)}</div>
    <button class="more" data-more="${esc(a.nom)}" aria-label="Plus d'options">⋯</button>
  </div>`;
}

function carteEpique(o) {
  const cls = { 'Accompli': 'st-done', 'Dans les temps': 'st-ok', 'En retard': 'st-late', 'Échoué': 'st-fail', 'À venir': 'st-ok' }[o.statut] || '';
  const pct = Math.min(100, o.progression * 100), temps = Math.min(100, o.temps * 100);
  return `<div class="epic">
    <div class="epic-top"><div class="epic-name">${esc(o.nom)}${o.sous ? `<div class="sous">${esc(o.sous)}</div>` : ''}</div><div class="epic-reward">🏆 ${Number(o.recompense).toLocaleString('fr-FR')} XP</div></div>
    <div class="bar"><i style="width:${pct}%"></i><span class="mark" style="left:calc(${temps}% - 1px)" title="Temps écoulé"></span></div>
    <div class="epic-meta"><span>${o.statut === 'À venir' && o.debut ? `commence le ${dateCourte(o.debut)}` : `${o.faites}/${o.visees} séances`} · fin ${dateCourte(o.echeance)}</span><span class="${cls}">${o.statut}</span></div>
  </div>`;
}

function carteBilan(s, dimanche) {
  const b = s.bilan.semaine, pr = s.bilan.precedente;
  const delta = pr.xp ? Math.round((b.xp - pr.xp) / pr.xp * 100) : null;
  const tendance = delta === null ? '' : `<div class="${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta)} % vs sem. dern.</div>`;
  const meilleure = s.habitudes.reduce((m, h) => (h.serieNb > 0 && h.serie > m.serie ? h : m), { serie: 0 });
  let mot;
  if (b.aJour === b.total && b.total) mot = 'Semaine parfaite : toutes tes habitudes sont à jour. Légendaire.';
  else if (b.rates === 0) mot = 'Aucun raté cette semaine. Continue comme ça.';
  else if (delta !== null && delta > 0) mot = 'Plus d\'XP que la semaine dernière malgré quelques ratés : la progression est là.';
  else mot = 'Semaine plus difficile. Choisis UNE habitude à sécuriser la semaine prochaine.';
  return `<div class="bilan ${dimanche ? 'dimanche' : ''}">
    <h3>${dimanche ? 'Bilan du dimanche' : 'Semaine en cours'}</h3>
    <div class="sous">Du ${dateCourte(b.lundi)} au ${dateCourte(b.dimanche)}</div>
    <div class="kpis">
      <div class="kpi"><b>${b.xp}</b><span>XP gagnée</span>${tendance}</div>
      <div class="kpi"><b>${b.faits}</b><span>quêtes faites</span></div>
      <div class="kpi"><b>${b.aJour}/${b.total}</b><span>habitudes à jour</span></div>
      <div class="kpi"><b>${b.rates}</b><span>ratés</span></div>
      <div class="kpi"><b>${b.jokers}</b><span>joker utilisé</span></div>
      <div class="kpi"><b>${b.bonus}</b><span>bonus de série</span></div>
    </div>
    <p>${meilleure.serie ? `🔥 Meilleure série : <b>${esc(meilleure.nom)}</b>, ${meilleure.serie} jours. ` : ''}${mot}</p>
  </div>`;
}

function render() {
  const s = state;
  const p = Math.round((s.progression || 0) * 100);
  const pvPct = Math.max(0, Math.min(100, s.pv / s.pvMax * 100));

  // Le filtre Perso / Pro n'apparaît que s'il existe au moins une quête Pro
  const aPro = [...s.habitudes, ...s.annexes, ...s.objectifs].some(q => q.categorie === 'Pro');
  if (!aPro) filtre = 'Tout';
  const enPause = s.habitudes.filter(h => h.enPause);
  const habs = s.habitudes.filter(garde).filter(h => !h.enPause);
  const touche = h => h.jour.fait || h.jour.rate || h.jour.repos;
  const ordre = h => (h.type === 'Routine' ? 0 : 1);
  const duJour = habs.filter(h => (h.aFaire && !s.vacances) || touche(h)).sort((a, b) => ordre(a) - ordre(b));
  const plusTard = habs.filter(h => !(h.aFaire && !s.vacances) && !touche(h));
  const annexes = s.annexes.filter(garde);
  const epiques = s.objectifs.filter(garde);
  const faits = duJour.filter(h => h.jour.fait).length;
  const dimanche = indexJour(s.today) === 6;

  const statsHtml = s.stats.map(st => {
    const mod = Math.floor((st.score - 10) / 2);
    const max = st.score >= 20;
    const dansPalier = st.xp % s.xpParPoint;
    const pct = max ? 100 : dansPalier / s.xpParPoint * 100;
    return `<div class="stat2">
      <div class="stat2-top"><span>${ICONES[st.nom] || ''} <b>${st.nom}</b></span>
        <span><span class="sc">${st.score}</span> <span class="md">${mod >= 0 ? '+' : ''}${mod}</span></span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="stat2-sub">${max ? 'Score maximum atteint' : `${Math.round(dansPalier).toLocaleString('fr-FR')} / ${Number(s.xpParPoint).toLocaleString('fr-FR')} XP avant ${st.score + 1}`} · ${Math.round(st.xp).toLocaleString('fr-FR')} XP au total</div>
    </div>`;
  }).join('');

  const series = [...s.habitudes].sort((a, b) => (b.serieNb > 0 ? b.serie : 0) - (a.serieNb > 0 ? a.serie : 0)).map(h => `
    <div class="serie-row"><span>${ICONES[h.carac] || '⭐'} ${esc(h.nom)}</span>
      <span>${h.serieNb > 0 && h.serie > 0 ? `<span class="streak">🔥 ${h.serie} j</span>` : '<span class="muted">pas de série</span>'}
      <span class="muted"> · record&nbsp;${h.record || 0}&nbsp;j</span></span></div>`).join('');

  const entete = `
    ${enLigne ? '' : '<div class="demo">Aperçu avec des données fictives : rien n\'est enregistré</div>'}
    <div class="compagnie"><b>☀ La Compagnie de l'Aube ☀</b><span>Ce que l'on tient chaque jour forge ce que l'on devient.</span></div>
    <header>
      <div class="hero-row profil" data-tab="profil" role="button" aria-label="Ouvrir le profil du héros">
        <div class="lvl" style="--p:${p}"><span>${s.niveau}</span><small>NIV</small></div>
        <div class="hero-txt">
          <div class="hero-name">${esc(s.heros)}</div>
          <div class="hero-title">${esc(s.titre)}</div>
          <div class="hero-sub">${Math.round(Number(s.xpTotale)).toLocaleString('fr-FR')} XP · ${s.etat}<span class="joker">🃏 ${s.jokersRestants}/${s.jokersParSemaine}</span>${s.d20 ? `<span class="joker">🎲 ${s.d20.de}</span>` : ''}</div>
        </div>
        <span class="chev">›</span>
      </div>
      <div class="bars">
        <div><div class="bar-label"><span>Expérience</span><span><b>${s.xpSuivant}</b> XP avant le niveau ${s.niveau + 1}</span></div>
          <div class="bar xp"><i style="width:${p}%"></i></div></div>
        <div><div class="bar-label"><span>Points de vie</span><span><b>${s.pv}</b> / ${s.pvMax}</span></div>
          <div class="bar pv"><i style="width:${pvPct}%"></i></div></div>
      </div>
      ${s.debutSuivi ? `<div class="etat vac">🗓️ <b>Ton aventure commence le ${dateLongue(s.debutSuivi).toLowerCase()}.</b> D'ici là, rien n'est compté contre toi : tu peux tester l'app librement.</div>` : ''}
      ${s.vacances ? `<div class="etat vac">🏖️ <b>Mode vacances depuis le ${dateCourte(s.vacances.depuis)}</b> : aucun raté n'est compté et tes séries sont gelées. Tu peux quand même valider une quête si tu en fais une.<br><button data-vac="1">Je suis rentré</button></div>` : ''}
      ${s.arc ? `<div class="etat terre">⚔️ <b>À terre : arc d'entraînement.</b> Les ratés automatiques sont suspendus. Fais au moins une quête par jour pendant ${s.arc.requis} jours pour te relever
        <span class="pips">${Array.from({ length: s.arc.requis }, (_, i) => `<i class="${i < s.arc.jours ? 'on' : ''}"></i>`).join('')}</span></div>`
      : s.pv < s.seuilEpuise ? `<div class="etat epuise">😮‍💨 <b>Épuisé :</b> XP ×${String(s.malus).replace('.', ',')} tant que tu es sous ${s.seuilEpuise} PV. Chaque habitude faite rend des PV, une annexe en rend le double.</div>` : ''}
    </header>
    ${aPro ? `<div class="filters">${['Tout', 'Perso', 'Pro'].map(f => `<button data-f="${f}" class="${f === filtre ? 'on' : ''}">${f}</button>`).join('')}</div>` : ''}`;

  const vueQuetes = `
    ${carteD20(s)}
    ${dimanche ? `<button class="rappel" data-tab="heros">📜 Ton bilan du dimanche est prêt <span>→</span></button>` : ''}
    <div class="section"><h2>Aujourd'hui</h2><span>${dateLongue(s.today)} · ${faits}/${duJour.length}</span></div>
    <div class="list">${duJour.length ? duJour.map(h => carteHabitude(h, false)).join('')
      : `<div class="empty">${s.vacances ? 'Profite de tes vacances.' : 'Rien d\'obligatoire aujourd\'hui. Une quête annexe pour l\'XP bonus ?'}</div>`}</div>
    ${plusTard.length ? `<div class="section"><h2>Plus tard</h2><span>tap = séance bonus</span></div>
    <div class="list">${plusTard.map(h => carteHabitude(h, true)).join('')}</div>` : ''}
    ${annexes.length ? `<div class="section"><h2>Quêtes annexes</h2><span>facultatives · XP ×1,5</span></div>
    <div class="list">${annexes.map(carteAnnexe).join('')}</div>` : ''}
    ${enPause.length ? `<button class="pause-note" data-tab="profil">⏸ ${enPause.length > 1 ? enPause.length + ' quêtes en pause' : esc(enPause[0].nom) + ' est en pause'} · gérer dans ton profil</button>` : ''}`;

  const CL = classeDe(s), pal = palierDe(s.niveau, CL), prochain = CL.paliers[pal + 1];
  const cl = s.classe || { nom: 'Magicien', fav1: 'Intelligence', fav2: 'Sagesse', bonus: 1.1, epiques: 1.2 };
  const pctBonus = Math.round((cl.bonus - 1) * 100);
  const CAP = s.capacites || { liste: [], restaurables: [], sortPrepare: '' };
  const capas = CL.capacites.map(c => {
    const st = CAP.liste.find(x => x.n === c.n);
    const ok = st ? st.debloquee : s.niveau >= c.n;
    let actions = '';
    if (ok && st && st.action === 'preparer') {
      const choix = [...s.habitudes.filter(h => !h.enPause), ...s.annexes];
      actions = `<div class="cact"><select id="sortQ">${choix.map(q => `<option ${q.nom === CAP.sortPrepare ? 'selected' : ''}>${esc(q.nom)}</option>`).join('')}</select>
        <button class="btn mini or" data-pr="sort">${CAP.sortPrepare ? 'Changer' : '✨ Préparer'}</button></div>`;
    }
    if (ok && st && st.action === 'restaurer') {
      actions = `<div class="cact">${CAP.restaurables.map(r => `<button class="btn mini or" data-pr="restaurer" data-q="${esc(r.quete)}">✨ ${esc(r.quete)} · ${dateCourte(r.date)}</button>`).join('')}</div>`;
    }
    return `<div class="capa ${ok ? '' : 'lock'}"><div class="lv">${ok ? '✦' : '🔒'}<br>Niv ${c.n}</div>
    <div><b>${c.nom}</b><span class="d">${c.d}</span>${ok && st ? `<span class="cst">${esc(st.statut)}</span>` : ''}${actions}</div></div>`;
  }).join('');
  const vueHeros = `
    <div class="hero-card">
      <div>${avatar(pal, 'h', s)}</div>
      <div>
        <div class="classe">${esc(cl.nom || 'Magicien')}</div>
        <div class="classe-sub" style="color:var(--gold)">Veilleur de l'Aube</div>
        <div class="classe-sub">${esc(CL.paliers[pal].desc)}</div>
        <div class="classe-sub">★ ${esc(cl.fav1)} et ${esc(cl.fav2)} : +${pctBonus} % d'XP<br>${CL.passif(cl)}</div>
        ${prochain ? `<div class="next-evo">${avatar(pal + 1, 'n', s)}<div>Prochaine évolution<br><b>Niveau ${prochain.n}</b> · ${prochain.titre}</div></div>`
          : '<div class="next-evo">Forme ultime atteinte</div>'}
      </div>
    </div>
    <div class="section"><h2>Capacités</h2><span>actives dès leur niveau</span></div>
    <div class="panel">${capas}</div>
    <div class="section"><h2>Bilan</h2><span>semaine du ${dateCourte(s.bilan.semaine.lundi)}</span></div>
    ${carteBilan(s, dimanche)}
    ${epiques.length ? `<div class="section"><h2>Quêtes épiques</h2><span>trait doré = temps écoulé</span></div>
    <div class="list">${epiques.map(carteEpique).join('')}</div>` : ''}
    <div class="section"><h2>Séries</h2><span>jours sans raté</span></div>
    <div class="panel">${series}</div>
    <div class="section"><h2>Caractéristiques</h2><span>score · modificateur</span></div>
    <div class="panel">${statsHtml}
      <div class="stat-note">Chaque quête donne 100 % de son XP à sa carac. principale et 50 % en plus à la secondaire. Un point de score tous les ${Number(s.xpParPoint).toLocaleString('fr-FR')} XP, de 8 à 20.</div></div>
    <button class="vac-btn" data-tab="profil">⚙️ Profil et réglages (vacances, pauses, rappel…)</button>`;

  const coop = (s.compagnons || []).length > 0;
  if (!coop && onglet === 'compagnie') onglet = 'quetes';
  const vue = onglet === 'heros' ? vueHeros : onglet === 'profil' ? vueProfil(s) : onglet === 'compagnie' ? vueCompagnie(s, faits, duJour.length) : vueQuetes;
  document.getElementById('app').innerHTML = (onglet === 'profil' ? entete.split('<header>')[0] : entete) + vue + `
    <nav class="tabs">
      <button data-tab="quetes" class="${onglet === 'quetes' ? 'on' : ''}"><span>⚔️</span>Quêtes${duJour.length - faits > 0 && !s.vacances ? `<i>${duJour.length - faits}</i>` : ''}</button>
      <button data-tab="heros" class="${onglet === 'heros' ? 'on' : ''}"><span>🛡️</span>Héros${dimanche ? '<i>!</i>' : ''}</button>
      ${coop ? `<button data-tab="compagnie" class="${onglet === 'compagnie' ? 'on' : ''}"><span>🤝</span>Compagnie</button>` : ''}
    </nav>`;
  if (onglet === 'profil') dessinerGrille();
  document.getElementById('btnRepos').textContent = s.jokersRestants > 0
    ? `💤 Repos (utilise le joker, ${s.jokersRestants} restant)` : '💤 Repos (plus de joker cette semaine)';
}


/* ---------- Page Profil ---------- */
const COULEURS_GRILLE = { 0: '#2a2333', 1: '#6b6175', 2: '#c0614f', 3: '#4fbf7a', 4: '#d4ad3c', 5: '#5b8fd6', 6: '#ffffff', 7: '#4a4057' };
const sw = (id, on) => `<label class="sw"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}><span></span></label>`;

function joursRestantsSemaine() {
  const out = [], auj = indexJour(state.today);
  for (let k = 0; k <= 6 - auj; k++) out.push(plusJours(state.today, k));
  return out;
}

/* ---------- Onglet Compagnie : où en sont les autres héros ---------- */
function vueCompagnie(s, faits, total) {
  const moi = { nom: s.heros, classe: (s.classe || {}).nom, look: s.look, niveau: s.niveau, titre: s.titre, pv: s.pv,
    faitsAujourdhui: faits, xpSemaine: s.bilan.semaine.xp, moi: true };
  const carte = c => {
    const cl = classeDe({ classe: { nom: c.classe } }), pal = palierDe(Number(c.niveau) || 1, cl);
    const pv = Math.max(0, Math.min(100, (Number(c.pv) || 0) / (s.pvMax || 100) * 100));
    return `<div class="comp ${c.moi ? 'moi' : ''}">
      <div class="comp-av">${cl.dessin(pal, 'c' + esc(c.nom).replace(/\W/g, ''), lookDe(c.look))}</div>
      <div class="comp-txt">
        <b>${esc(c.nom)}${c.moi ? ' · toi' : ''}</b>
        <span class="tt">${esc(c.titre || '')} · niveau ${c.niveau || 1} · ${esc(c.classe || '')}</span>
        <div class="bar pv"><i style="width:${pv}%"></i></div>
        <span>${c.pv} PV · ${c.faitsAujourdhui} quête${c.faitsAujourdhui > 1 ? 's' : ''} aujourd'hui · ${Number(c.xpSemaine || 0).toLocaleString('fr-FR')} XP cette semaine</span>
      </div></div>`;
  };
  const autres = s.compagnons || [];
  const tous = [moi].concat(autres);
  const xpComp = tous.reduce((t, c) => t + (Number(c.xpSemaine) || 0), 0);
  const actifs = tous.filter(c => c.faitsAujourdhui > 0).length;
  const mot = actifs === tous.length ? 'Toute la Compagnie a déjà agi aujourd\'hui. L\'Aube se lève sur vous.'
    : actifs === 0 ? 'Personne n\'a encore agi aujourd\'hui : montre l\'exemple.'
    : (moi.faitsAujourdhui > 0 ? 'Tu as fait ta part. Un mot d\'encouragement à ton compagnon ?' : 'Ton compagnon est déjà en route. À toi de jouer !');
  return `
    <div class="section"><h2>La Compagnie</h2><span>${tous.length} héros</span></div>
    <div class="list">${tous.map(carte).join('')}</div>
    <div class="panel comp-bilan"><b>${xpComp.toLocaleString('fr-FR')} XP</b> gagnés ensemble cette semaine<br><span>${mot}</span></div>
    <div class="aide-coop">Les boss du Crépuscule et les quêtes à deux arrivent avec l'étape 2.</div>`;
}

function vueProfil(s) {
  const R = s.reglages || {};
  const CL = classeDe(s), pal = palierDe(s.niveau, CL);
  const p = profil;
  const rec = p && p.records;
  const grille = !p ? '<div class="grid-wrap"><div class="muted" style="font-size:13px">Chargement de ta Life Grid…</div></div>'
    : !p.grille ? '<div class="grid-wrap"><div class="muted" style="font-size:13px">Renseigne ta date de naissance dans le Sheet (Paramètres) pour afficher ta vie en semaines.</div></div>'
    : `<div class="grid-wrap">
        <div class="grid-info"><span>Semaine <b>${p.semaineVie.toLocaleString('fr-FR')}</b> sur 4 160</span><span><b>${(p.semaineVie / 41.6).toFixed(1).replace('.', ',')} %</b> de la grille</span></div>
        <canvas id="lifegrid" width="${52 * 6}" height="${80 * 6}"></canvas>
        <div class="legende">${[[4, 'parfaite'], [3, 'réussie'], [2, 'difficile'], [5, 'repos'], [6, 'cette semaine'], [1, 'avant le suivi']]
          .map(([c, t]) => `<span><i style="background:${COULEURS_GRILLE[c]}"></i>${t}</span>`).join('')}</div>
      </div>`;
  const records = !rec ? '' : `<div class="records">
      <div class="rec"><b>${rec.meilleureSerie.jours || 0} j</b><span>Plus longue série${rec.meilleureSerie.nom ? '<br>' + esc(rec.meilleureSerie.nom) : ''}</span></div>
      <div class="rec"><b>${rec.meilleureSemaine.xp ? rec.meilleureSemaine.xp.toLocaleString('fr-FR') : '—'}</b><span>Meilleure semaine (XP)${rec.meilleureSemaine.lundi ? '<br>sem. du ' + dateCourte(rec.meilleureSemaine.lundi) : ''}</span></div>
      <div class="rec"><b>${rec.quetes}</b><span>Quêtes accomplies</span></div>
      <div class="rec"><b>${rec.parfaites} · ${rec.reussies}</b><span>Semaines parfaites · réussies</span></div>
      <div class="rec"><b>${rec.jours}</b><span>Jours d'aventure</span></div>
      <div class="rec"><b>${rec.bonusSerie}</b><span>Paliers de série franchis</span></div>
    </div>`;

function dessinerGrille() {
  const c = document.getElementById('lifegrid');
  if (!c || !profil || !profil.grille) return;
  const g = c.getContext('2d'), t = 6;
  for (let i = 0; i < profil.grille.length; i++) {
    const code = profil.grille[i], x = (i % 52) * t, y = Math.floor(i / 52) * t;
    g.fillStyle = COULEURS_GRILLE[code] || COULEURS_GRILLE[0];
    g.fillRect(x, y, t - 1, t - 1);
    if (code === '6') { g.strokeStyle = '#d4ad3c'; g.lineWidth = 1; g.strokeRect(x - .5, y - .5, t, t); }
  }
  g.fillStyle = 'rgba(212,173,60,.35)';
  for (let d = 10; d < 80; d += 10) g.fillRect(0, d * t - 1, 52 * t, 1);
}

/* ---------- Saisies : réponse immédiate à l'écran, synchronisation en arrière-plan ----------
 * La carte, l'XP et les PV bougent dès le toucher (prédiction locale). Les envois partent ensuite
 * un par un vers le Sheet ; quand le dernier revient, l'état exact du serveur remplace la prédiction.
 */
let fileEnvois = Promise.resolve(), envoisEnCours = 0, confirme = null;
const copie = o => JSON.parse(JSON.stringify(o));

/** Prédit l'effet d'une saisie. Renvoie null si on ne sait pas la prédire (on attend alors le serveur). */
function predire(s, nom, statut) {
  const R = s.regles;
  if (!R || statut === 'undo' || statut === 'hier') return null;
  const n = copie(s);
  const q = n.habitudes.find(h => h.nom === nom) || n.annexes.find(a => a.nom === nom);
  if (!q) return null;
  const estAnnexe = !n.habitudes.some(h => h.nom === nom);
  const res = { etat: n, dXp: 0, dPv: 0 };
  if (statut === 'Fait') {
    const deja = q.jour.fait;
    const epuise = n.arc || n.pv < n.seuilEpuise;
    const capa = n.capacites || {};
    const sort = capa.sortPrepare === nom ? 1.5 : 1;
    const sournoise = capa.roublard && estAnnexe && (capa.liste || []).some(c => c.n === 5 && c.debloquee && /^Prête/.test(c.statut)) ? 2 : 1;
    res.dXp = Math.round((Number(q.xp) || 0) * R.rend[Math.min(deja, 2)] * (epuise ? n.malus : 1) * (R.xpMult || 1) * ((n.d20 && n.d20.mult) || 1) * sort * sournoise);
    if (!deja && !n.arc) res.dPv = Math.min(n.pvMax - n.pv, estAnnexe ? R.soinAnnexe : R.soinHab);
    q.jour.fait++;
    if (estAnnexe) q.fois = (Number(q.fois) || 0) + 1; else q.semaine = (Number(q.semaine) || 0) + 1;
    const span = n.progression < 1 ? n.xpSuivant / (1 - n.progression) : 0;
    n.xpTotale = Number(n.xpTotale) + res.dXp;
    n.xpSuivant = Math.max(0, n.xpSuivant - res.dXp);
    if (span > 0) n.progression = Math.min(1, n.progression + res.dXp / span);
  } else if (statut === 'Raté') {
    if (!n.arc) res.dPv = -Math.min(n.pv, R.pen);
    q.jour.rate++;
  } else if (statut === 'Repos') {
    if (n.jokersRestants <= 0) return null;
    n.jokersRestants--; q.jour.repos++;
  }
  n.pv += res.dPv;
  if (!n.arc) n.etat = n.pv < n.seuilEpuise ? `Épuisé (XP ×${String(n.malus).replace('.', ',')})` : 'En forme';
  return res;
}

function celebrerChangements(avant, apres) {
  if (!avant || !apres) return;
  if (palierDe(apres.niveau, classeDe(apres)) > palierDe(avant.niveau, classeDe(apres))) setTimeout(() => evolution(apres.niveau), 500);
  else if (apres.niveau > avant.niveau) setTimeout(() => niveauSup(apres.niveau, apres.titre, apres.titre !== avant.titre), 500);
  celebrer(apres.nouveauxBonus);
}

const dernierToucher = {};
function agir(nom, statut) {
  if (busy.has(nom)) return;
  // Anti double-toucher : un 2e toucher sur la même carte en moins de 0,7 s est ignoré
  const t = Date.now();
  if (statut === 'Fait' && dernierToucher[nom] && t - dernierToucher[nom] < 700) return;
  dernierToucher[nom] = t;
  const annexe = state.annexes.find(x => x.nom === nom);
  if (statut === 'Fait' && annexe && !annexe.repetable && annexe.jour.fait > 0) { toast('Quête unique : déjà accomplie ✔'); return; }
  if (!confirme) confirme = state;
  const pred = predire(state, nom, statut);
  if (pred) {
    state = pred.etat; render();
    if (pred.dXp > 0) flotter(`+${pred.dXp} XP${pred.dPv > 0 ? ` · +${pred.dPv} PV` : ''}`, 'var(--xp2)');
    else if (pred.dPv < 0) flotter(`${pred.dPv} PV`, 'var(--pv)');
    else if (statut === 'Repos') flotter('Repos', 'var(--rest)');
    if (pred.dXp > 0) vib(25);
  } else { busy.add(nom); render(); }
  envoisEnCours++;
  const appel = () => statut === 'undo' ? api('undoToday', nom)
    : statut === 'hier' ? api('logAction', nom, 'Fait', true) : api('logAction', nom, statut);
  fileEnvois = fileEnvois.then(appel).then(apres => {
    envoisEnCours--; busy.delete(nom);
    const avant = confirme; confirme = apres;
    if (!pred) { // saisie non prédite : retour visuel à l'arrivée
      const dXp = apres.xpTotale - avant.xpTotale, dPv = apres.pv - avant.pv;
      if (dXp > 0) flotter(`+${Math.round(dXp)} XP${dPv > 0 ? ` · +${dPv} PV` : ''}`, 'var(--xp2)');
      else if (dPv < 0) flotter(`${dPv} PV`, 'var(--pv)');
    }
    celebrerChangements(avant, apres);
    if (envoisEnCours === 0) { state = apres; confirme = null; render(); }
  }).catch(e => {
    envoisEnCours--; busy.delete(nom);
    toast('Échec de l\'enregistrement : ' + (e && e.message ? e.message : e));
    // On revient à la vérité du Sheet
    return api('getState').then(s => { if (envoisEnCours === 0) { state = s; confirme = null; } else confirme = s; render(); })
      .catch(() => { if (confirme && envoisEnCours === 0) { state = confirme; confirme = null; render(); } });
  });
}

/** Renomme partout (onglet, Journal, quête épique liée, pauses, décalages) : l'historique suit. */

  if (await regler('renommerQuete', nom, nouveau.trim())) toast(`Renommée en « ${nouveau.trim()} » ✏️`);
}

document.addEventListener('click', e => {

  if (v) {
    const msg = state.vacances ? 'Fin des vacances : le suivi reprend dès aujourd\'hui.' : 'Mode vacances : plus aucun raté ni perte de PV, séries gelées. Activer dès aujourd\'hui ?';
    if (confirm(msg)) api('toggleVacances').then(s => { state = s; render(); }).catch(err => toast('Échec : ' + (err.message || err)));
    return;
  }
  const t = e.target.closest('[data-tab]');
  if (t) {
    const cible = t.dataset.tab;
    if (cible === 'profil' && onglet !== 'profil') ongletPrec = onglet;
    onglet = cible;
    try { localStorage.setItem('onglet', onglet === 'profil' ? ongletPrec : onglet); } catch (err) {}
    render(); window.scrollTo(0, 0);
    if (onglet === 'profil') chargerProfil();
    return;
  }
  const pr = e.target.closest('[data-pr]');
  if (pr) { actionProfil(pr); return; }

  if (f) { filtre = f.dataset.f; try { localStorage.setItem('filtre', filtre); } catch (err) {} render(); return; }
  const more = e.target.closest('[data-more]');
  if (more) { e.stopPropagation(); ouvrirMenu(more.dataset.more); return; }
  const card = e.target.closest('.card');
  if (card) { agir(card.dataset.q, 'Fait'); return; }
  const act = e.target.closest('[data-act]');

});
