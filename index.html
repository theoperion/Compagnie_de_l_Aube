<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>La Compagnie de l'Aube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #110e15; --panel: #1c1722; --card: #241e2c; --card-done: #1d2a22;
    --line: #362e40; --text: #ece6f2; --muted: #9a90a6;
    --gold: #d4ad3c; --xp: #9b5de5; --xp2: #c08cff; --pv: #e05555; --ok: #4fbf7a;
    --warn: #e0a040; --rest: #5b8fd6; --epic: #b06cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, -apple-system, sans-serif; }
  body { padding: 0 0 48px; min-height: 100vh;
    background: radial-gradient(ellipse at top, #2a1f38 0%, var(--bg) 55%); }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px; }

  /* En-tête personnage */
  header { padding: 22px 0 6px; }
  .hero-row { display: flex; align-items: center; gap: 14px; }
  .profil { cursor: pointer; margin: -6px -8px; padding: 6px 8px; border-radius: 14px; -webkit-tap-highlight-color: transparent; transition: background .15s; }
  .profil:active { background: #221c2a; }
  .profil .hero-txt { flex: 1; min-width: 0; }
  .profil .chev { color: var(--gold); font-size: 26px; line-height: 1; opacity: .7; }
  .lvl { width: 66px; height: 66px; flex: none; border-radius: 50%;
    display: grid; place-items: center; position: relative;
    background: conic-gradient(var(--gold) calc(var(--p) * 1%), #3a3145 0);
    box-shadow: 0 0 24px rgba(212,173,60,.25); }
  .lvl::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--panel); }
  .lvl span { position: relative; font-family: Cinzel, serif; font-weight: 800; font-size: 24px; color: var(--gold); }
  .lvl small { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: .08em; background: var(--gold); color: #1a1408;
    padding: 1px 6px; border-radius: 6px; font-weight: 700; }
  .hero-name { font-family: Cinzel, serif; font-size: 21px; font-weight: 800; letter-spacing: .02em; line-height: 1.15; }
  .hero-title { font-family: Cinzel, serif; color: var(--gold); font-size: 14px; font-style: italic; margin-top: 2px; }
  .hero-sub { color: var(--muted); font-size: 12px; margin-top: 3px; }

  .bars { margin-top: 16px; display: grid; gap: 10px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .bar-label b { color: var(--text); font-weight: 600; }
  .bar { height: 10px; border-radius: 6px; background: #2c2535; overflow: hidden; position: relative; }
  .bar > i { display: block; height: 100%; border-radius: 6px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .bar.xp > i { background: linear-gradient(90deg, var(--xp), var(--xp2)); }
  .bar.pv > i { background: linear-gradient(90deg, #b83a3a, var(--pv)); }

  /* Filtre Perso / Pro */
  .filters { display: flex; gap: 8px; margin: 18px 0 4px; }
  .filters button { flex: 1; padding: 8px 0; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font: 600 13px Inter, sans-serif; cursor: pointer; }
  .filters button.on { background: var(--card); color: var(--text); border-color: var(--gold); }

  .section { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 0 10px; }
  .section h2 { margin: 0; font-family: Cinzel, serif; font-size: 15px; letter-spacing: .06em; color: var(--gold); text-transform: uppercase; }
  .section span { font-size: 12px; color: var(--muted); }
  .empty { padding: 16px; border-radius: 14px; border: 1px dashed var(--line); color: var(--muted); font-size: 13px; text-align: center; }

  /* Cartes */
  .list { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
  .card { display: flex; align-items: center; gap: 12px; padding: 13px 12px 13px 14px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line); cursor: pointer; user-select: none;
    transition: transform .12s, background .25s, border-color .25s; position: relative; }
  .card:active { transform: scale(.98); }
  .card.small { padding: 10px 12px; opacity: .85; }
  .card.small .icon { width: 34px; height: 34px; font-size: 17px; }
  .card.small .name { font-size: 14px; }
  .card.annexe { border-left: 3px solid var(--gold); }
  .card.done { background: var(--card-done); border-color: #2f5a3e; }
  .card.missed { border-color: #6a2e2e; }
  .card.rest { border-color: #2e466a; }
  .card.busy { opacity: .5; pointer-events: none; }
  .icon { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center;
    font-size: 21px; background: #2f2739; }
  .card.done .icon { background: #24402f; }
  .body { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .meta .pro { color: var(--warn); font-weight: 600; }
  .meta .bonus { color: var(--gold); font-weight: 600; }
  .right { text-align: right; flex: none; }
  .week { font-size: 12px; color: var(--muted); }
  .week b { color: var(--text); }
  .week.ok b { color: var(--ok); }
  .chip { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  .chip.f { background: #24402f; color: var(--ok); }
  .chip.r { background: #4a2323; color: #ff8b8b; }
  .chip.p { background: #22344f; color: #8fb6ee; }
  .chip.n { background: #2f2739; color: var(--muted); font-weight: 600; }
  .more { width: 32px; height: 32px; flex: none; border: 0; border-radius: 10px; background: transparent;
    color: var(--muted); font-size: 20px; cursor: pointer; }
  .more:active { background: #2f2739; }

  /* Quêtes épiques */
  .epic { padding: 14px; border-radius: 14px; background: linear-gradient(135deg, #2a1f3a, #221b2b);
    border: 1px solid #4a3866; }
  .epic-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .epic-name { font-weight: 700; font-size: 14px; }
  .epic-reward { font-size: 12px; color: var(--gold); white-space: nowrap; font-weight: 600; }
  .epic .bar { height: 8px; margin: 10px 0 6px; }
  .epic .bar > i { background: linear-gradient(90deg, #7b3fd1, var(--epic)); }
  .epic .bar .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--gold); border-radius: 1px; }
  .epic-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .st-ok { color: var(--ok); font-weight: 600; } .st-late { color: var(--warn); font-weight: 600; }
  .st-done { color: var(--gold); font-weight: 700; } .st-fail { color: var(--pv); font-weight: 600; }

  .streak { color: #ff9b4a; font-weight: 700; }
  .etat { margin-top: 12px; padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 1.45; }
  .etat.epuise { background: #3a2a14; border: 1px solid #7a5a22; color: #f3d39a; }
  .etat.terre { background: #3a1717; border: 1px solid #8a3030; color: #ffc2c2; }
  .etat b { color: #fff; }
  .etat.vac { background: #12303a; border: 1px solid #2c6a7a; color: #bfe8f2; }
  .etat button, .vac-btn { margin-top: 8px; padding: 8px 12px; border-radius: 10px; border: 1px solid #2c6a7a;
    background: #173d49; color: #e6f7fb; font: 600 13px Inter, sans-serif; cursor: pointer; }
  .vac-btn { display: block; width: 100%; margin-top: 22px; background: transparent; border-style: dashed; color: var(--muted); border-color: var(--line); }
  .pips { display: inline-flex; gap: 5px; margin-left: 6px; vertical-align: middle; }
  .pips i { width: 10px; height: 10px; border-radius: 50%; background: #5a2a2a; border: 1px solid #a04545; }
  .pips i.on { background: var(--ok); border-color: var(--ok); }
  .joker { display: inline-block; margin-left: 6px; font-size: 11px; padding: 1px 7px; border-radius: 8px;
    background: #22344f; color: #8fb6ee; font-weight: 600; }
  /* Bilan */
  .bilan { padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  .bilan.dimanche { background: linear-gradient(135deg, #2b2410, #1f1a12); border-color: #6a5320; }
  .bilan h3 { margin: 0 0 4px; font-family: Cinzel, serif; color: var(--gold); font-size: 16px; }
  .bilan .sous { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .kpi { background: rgba(255,255,255,.04); border-radius: 10px; padding: 10px 8px; text-align: center; }
  .kpi b { display: block; font-family: Cinzel, serif; font-size: 20px; }
  .kpi span { font-size: 11px; color: var(--muted); }
  .kpi .up { color: var(--ok); font-size: 11px; font-weight: 600; } .kpi .down { color: var(--pv); font-size: 11px; font-weight: 600; }
  .bilan p { margin: 12px 0 0; font-size: 13px; line-height: 1.5; }
  .bonus-pop { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); z-index: 28; pointer-events: none;
    background: linear-gradient(135deg, #3a2a0e, #241a08); border: 1px solid var(--gold); border-radius: 16px;
    padding: 16px 22px; text-align: center; animation: pop 2.6s forwards; min-width: 240px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .bonus-pop b { display: block; font-family: Cinzel, serif; color: var(--gold); font-size: 22px; }
  .bonus-pop span { font-size: 13px; color: var(--text); }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.9); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1.03); }
    80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -20px); } }
  .compagnie { text-align: center; padding-top: 16px; }
  .compagnie b { display: block; font-family: Cinzel, serif; font-size: 12px; letter-spacing: .22em; color: var(--gold); text-transform: uppercase; }
  .compagnie span { display: block; font-size: 11px; color: var(--muted); font-style: italic; margin-top: 3px; }
  /* Avatar */
  @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .95; transform: scale(1.05); } }
  @keyframes sway { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(1.4deg); } }
  @keyframes floatp { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-70px); opacity: 0; } }
  @keyframes glow { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  svg .aura { transform-origin: 100px 140px; animation: pulse 3.2s ease-in-out infinite; }
  svg .cape { transform-origin: 100px 100px; animation: sway 4s ease-in-out infinite; }
  svg .p { animation: floatp 3.6s linear infinite; }
  svg .eyes { animation: glow 1.8s ease-in-out infinite; }
  svg .spin { animation: spin 14s linear infinite; }
  svg .bob { animation: bob 2.6s ease-in-out infinite; }
  .hero-card { margin-top: 18px; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; align-items: center;
    padding: 12px; border-radius: 16px; border: 1px solid #4a3866; background: radial-gradient(circle at 25% 50%, #2c2142, #1c1722 70%); }
  .hero-card svg { width: 150px; height: auto; display: block; }
  .classe { font-family: Cinzel, serif; color: var(--gold); font-size: 17px; font-weight: 800; }
  .classe-sub { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
  .sous { font-size: 11.5px; color: var(--muted); font-style: italic; margin: 1px 0 2px; font-weight: 400; font-family: inherit; letter-spacing: 0; }
  .next-evo { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px; border-radius: 10px; background: rgba(255,255,255,.04); font-size: 12px; }
  .next-evo svg { width: 38px; filter: brightness(0) invert(.35); opacity: .7; }
  /* d20 du jour */
  .d20-ov { position: fixed; inset: 0; z-index: 40; display: none; place-items: center; padding: 16px;
    background: radial-gradient(circle at 50% 38%, rgba(212,173,60,.28), transparent 62%), rgba(14,11,18,.985); }
  .d20-ov.on { display: grid; }
  .d20-box { width: 100%; max-width: 360px; text-align: center; }
  .d20-box h2 { font-family: Cinzel, serif; color: var(--gold); font-size: 22px; margin: 0 0 6px; letter-spacing: .04em; }
  .d20-sub { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 0 0 6px; }
  .d20 { width: 170px; height: 170px; display: block; margin: 10px auto; filter: drop-shadow(0 8px 18px rgba(0,0,0,.55)); }
  .d20 text { font-family: Cinzel, serif; font-weight: 800; }
  .d20.roule { animation: rouler .35s linear infinite; }
  @keyframes rouler { 0% { transform: rotate(0) scale(.92); } 50% { transform: rotate(180deg) scale(1.05); } 100% { transform: rotate(360deg) scale(.92); } }
  .d20.pose { animation: poser .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes poser { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .d20.crit { filter: drop-shadow(0 0 22px rgba(255,214,102,.95)) drop-shadow(0 0 40px rgba(255,170,40,.6)); animation: poser .45s cubic-bezier(.2,1.6,.4,1), pulse 1.2s ease-in-out .45s infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .d20.fumble { filter: grayscale(.7) drop-shadow(0 8px 18px rgba(0,0,0,.6)); animation: secouer .5s; }
  @keyframes secouer { 20%, 60% { transform: translateX(-7px) rotate(-4deg); } 40%, 80% { transform: translateX(7px) rotate(4deg); } }
  .d20-res { min-height: 92px; }
  .d20-res .calc { color: var(--muted); font-size: 13px; }
  .d20-res .titre { font-family: Cinzel, serif; font-size: 21px; font-weight: 800; color: var(--gold); margin: 4px 0; }
  .d20-res .titre.crit { color: #ffd666; text-shadow: 0 0 14px rgba(255,200,80,.7); }
  .d20-res .titre.fumble { color: #c9b9d6; }
  .d20-res .texte { font-size: 14px; line-height: 1.45; }
  .d20-res .mult { display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 99px; background: #2b2410; border: 1px solid #6a5320; color: var(--gold); font-weight: 700; font-size: 13px; }
  .d20-table { color: var(--muted); font-size: 11.5px; margin-top: 12px; line-height: 1.5; }
  .d20-res .mult.malus, .d20-card.malus b { color: #e07a6f; }
  .d20-res .mult.malus { border-color: #6b2a25; background: #2a1414; }
  .d20-vol { position: fixed; left: 0; top: 0; width: 110px; height: 110px; z-index: 41; pointer-events: none; }
  .d20-vol svg { width: 110px; height: 110px; margin: 0; filter: drop-shadow(0 10px 14px rgba(0,0,0,.6)); }
  .d20-later { background: none; border: 0; color: var(--muted); font-size: 13px; margin-top: 8px; text-decoration: underline; }
  .d20-card { display: flex; align-items: center; gap: 10px; width: 100%; margin: 4px 0 12px; padding: 12px 14px; border-radius: 14px; text-align: left;
    border: 1px solid #6a5320; background: linear-gradient(135deg, #2b2410, #1c1726); color: var(--gold); font: 700 15px Cinzel, serif; }
  .d20-card svg { width: 40px; height: 40px; flex: none; margin: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .d20-card div { line-height: 1.35; }
  .d20-card span { margin-left: auto; }
  .d20-card.fait { font: 600 13px inherit; font-family: inherit; color: var(--text); border-color: var(--line); background: var(--card); }
  .d20-card.fait b { color: var(--gold); }
  .sort { color: #c9a2ff; font-weight: 600; }
  .cst { display: block; margin-top: 4px; font-size: 12px; color: var(--gold); }
  .cact { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .cact select { flex: 1; min-width: 0; padding: 5px 8px; border-radius: 8px; background: var(--card); color: var(--text); border: 1px solid var(--line); font-size: 12px; }
  :root { --moi: #7da7ff; --allie: #5fc4a8; --boss: #e0584b; }
  .boss-mini { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; margin: 10px 0 4px; padding: 8px 12px 8px 8px;
    background: linear-gradient(180deg, #2a1414, var(--panel)); border: 1px solid #5a2620; border-radius: 14px; color: var(--text); font: inherit; cursor: pointer; }
  .boss-mini.vaincu { border-color: #6a5320; background: linear-gradient(180deg, #2b2410, var(--panel)); }
  .bm-av { width: 54px; flex: none; } .bm-av svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 3px 5px rgba(0,0,0,.5)); }
  .bm-txt { flex: 1; min-width: 0; } .bm-txt b { display: block; font: 700 14.5px Georgia, serif; color: #ff9b8a; }
  .bm-txt span { font-size: 12px; color: var(--muted); } .bm-ok { color: var(--gold) !important; font-weight: 600; }
  .bm-go { color: var(--gold); font-size: 22px; }
  .bar.boss { height: 8px; margin: 5px 0 3px; background: #2b2236; } .bar.boss i { background: linear-gradient(90deg, #8f2b24, var(--boss)); }
  .bar.boss.big { height: 14px; border-radius: 7px; }
  .bar.split { display: flex; height: 7px; margin-top: 5px; background: #2b2236; } .bar.split i { height: 100%; display: block; }
  .boss-card { background: linear-gradient(180deg, #2a1414, var(--panel)); border: 1px solid #5a2620; border-radius: 18px; padding: 14px; margin-bottom: 10px; }
  .boss-card.mois { background: linear-gradient(180deg, #1f1430, var(--panel)); border-color: #46306a; }
  .boss-card.vaincu { border-color: #6a5320; }
  .boss-card.vaincu .bc-av svg { filter: grayscale(.7) brightness(.7); }
  .bc-top { display: flex; gap: 12px; align-items: center; }
  .bc-av { width: 104px; flex: none; } .bc-av svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
  .bc-av.hit svg { animation: bossHit .35s; }
  @keyframes bossHit { 25% { transform: translateX(-6px) rotate(-3deg); } 50% { transform: translateX(6px) rotate(3deg); } 75% { transform: translateX(-3px); } }
  .bc-id { min-width: 0; } .bc-type { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .bc-id b { display: block; font: 800 17px Georgia, serif; color: #ff9b8a; line-height: 1.2; margin: 2px 0; }
  .boss-card.mois .bc-id b { color: #c9a8ff; }
  .bc-rang { color: var(--gold); font-size: 12.5px; }
  .bc-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; font-size: 11.5px; }
  .bc-tags .tag { padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); background: #16121e; }
  .bc-tags .tag.f { border-color: #6a5320; color: var(--gold); } .bc-tags .tag.r { color: var(--muted); }
  .bc-pv { display: flex; justify-content: space-between; font-size: 13px; margin: 12px 0 4px; } .bc-pv span { color: var(--muted); }
  .bc-dmg { font-size: 12.5px; color: var(--muted); margin-top: 10px; } .bc-dmg .rip { color: #ff8b8b; }
  .bc-tip { margin-top: 10px; font-style: italic; font-size: 13px; color: #d8c9a8; }
  .bc-xp { margin-top: 6px; font-size: 12px; color: var(--gold); }
  .bc-win { margin-top: 12px; padding: 10px; border-radius: 12px; background: #2b2410; border: 1px solid #6a5320; color: var(--gold); font-weight: 700; font-size: 14px; text-align: center; }
  .bc-win.avenir { background: #1d1626; border-color: var(--line); color: var(--text); font-weight: 600; }
  .bc-win span { font-weight: 500; color: var(--text); font-size: 13px; }
  .coups { padding: 4px 12px; }

  .reg input[type=date], .reg select, .reg input[type=text] { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 8px; font: 13px Inter, sans-serif; min-width: 0; }
  .reg .form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 6px; }
  .reg .form label { font-size: 11px; color: var(--muted); display: grid; gap: 4px; }
  .btn { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    font: 600 13px Inter, sans-serif; cursor: pointer; }
  .btn.or { border-color: #6a5320; background: #2b2410; color: var(--gold); }
  .btn.plein { width: 100%; margin-top: 8px; }
  .btn.mini { padding: 5px 9px; font-size: 12px; }
  .btn:disabled { opacity: .45; }
  .sw { position: relative; width: 44px; height: 26px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; background: #3a3145; border-radius: 13px; transition: .2s; }
  .sw span::before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .sw input:checked + span { background: var(--gold); }
  .sw input:checked + span::before { transform: translateX(18px); }
  .modes { display: grid; gap: 6px; }
  .mode { text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; font: 13px Inter, sans-serif; }
  .mode b { display: block; margin-bottom: 2px; } .mode span { font-size: 12px; color: var(--muted); }
  .mode.on { border-color: var(--gold); background: #2b2410; } .mode.on b { color: var(--gold); }
  .mode:disabled:not(.on) { opacity: .45; }
  .pause-note { display: block; width: 100%; margin-top: 14px; padding: 10px; border-radius: 12px; border: 1px dashed var(--line);
    background: transparent; color: var(--muted); font: 13px Inter, sans-serif; cursor: pointer; }
  .chip.d { background: #1f2a3a; color: #9fc2ef; }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><div class="loading">Chargement de ta feuille de personnage…</div></div>
</div>

<div id="carnetBox" hidden></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <h3 id="sheetTitle"></h3>
  <button data-act="Fait">✅ Fait</button>

</div>
<div class="sheet" id="sheetPal"></div>
<div class="toast" id="toast"></div>
<div class="d20-ov" id="d20ov"></div>

<script>
/* Magicien : personnage SVG par calques, 8 paliers (0 = niveau 1 … 7 = niveau 100) */
const PALIERS_MAGE = [
  { n: 1, titre: "l'Apprenti", desc: 'Robe de laine, baguette de bois, premier grimoire.' },
  { n: 5, titre: "l'Aventurier", desc: 'Robe bleue, chapeau pointu, bâton de voyage.' },
  { n: 10, titre: 'le Vagabond', desc: 'Grand manteau, bâton à cristal, parchemins à la ceinture.' },
  { n: 20, titre: 'le Chevalier', desc: 'Robe de mage de bataille, mantelet, runes dorées.' },
  { n: 35, titre: 'le Champion', desc: 'Cristal lumineux, grimoire flottant, première aura.' },
  { n: 50, titre: 'le Héros', desc: 'Robe d\'archiviste violette, chapeau étoilé, aura dorée.' },
  { n: 75, titre: 'le Légendaire', desc: 'Regard arcanique, cercle de runes sous les pieds.' },
  { n: 100, titre: "l'Ascendant", desc: 'Lévitation, halo de lumière, trois orbes en orbite.' }
];
function palierMage(niveau) {
  let i = 0;
  PALIERS_MAGE.forEach((p, k) => { if (niveau >= p.n) i = k; });
  return i;
}

function magicien(st, id) {
  const C = {
    peau: '#e3bd98', cheveux: '#3b2a20',
    robe: ['#86735c', '#3456a6', '#3456a6', '#2f48a0', '#2f48a0', '#5a2f96', '#4c2a8c', '#45267f'][st],
    robeOmbre: ['#5a4a38', '#1f3470', '#1f3470', '#1b2c66', '#1b2c66', '#331a5c', '#2a1652', '#25134a'][st],
    peauOmbre: '#c0916c', yeux: '#6b4a2c',
    manteau: '#3a2a5a', manteauOmbre: '#261a3e', or: '#d4ad3c', cuir: '#5a3a22',
    cristal: st >= 7 ? '#fffbe6' : st >= 4 ? '#8ff0ff' : '#9fd6e8', bois: '#6a4426'
  };
  const auraCol = st >= 7 ? '#fff3c4' : st >= 5 ? '#c9a2ff' : '#7fd6ff';
  const lev = st >= 7 ? -10 : 0; // lévitation au palier ultime
  let s = `<svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Magicien, palier ${st + 1}">
  <defs>
    <radialGradient id="mau${id}" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${auraCol}" stop-opacity="${st >= 7 ? .7 : .45}"/>
      <stop offset="60%" stop-color="${auraCol}" stop-opacity="${st >= 7 ? .22 : .12}"/>
      <stop offset="100%" stop-color="${auraCol}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mcr${id}" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="${C.cristal}"/><stop offset="100%" stop-color="${C.cristal}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mro${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${C.robe}"/><stop offset="100%" stop-color="${C.robeOmbre}"/>
    </linearGradient>
    <linearGradient id="mlat${id}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity=".16"/><stop offset="35%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="65%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="mvis${id}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity=".10"/><stop offset="45%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="mhs${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity=".38"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mfc${id}"><path d="M85.5,72 Q85.5,57 100,57 Q114.5,57 114.5,72 Q114.5,82 110,88 Q105,94.5 100,94.5 Q95,94.5 90,88 Q85.5,82 85.5,72Z"/></clipPath>
  </defs>`;

  // Aura (35+)
  if (st >= 4) s += `<circle class="aura" cx="100" cy="${140 + lev}" r="${st >= 7 ? 98 : st >= 5 ? 88 : 78}" fill="url(#mau${id})"/>`;
  // Halo (100)
  if (st >= 7) s += `<g class="spin" style="transform-origin:100px 66px"><circle cx="100" cy="66" r="40" fill="none" stroke="#fff3c4" stroke-width="2" stroke-dasharray="6 5" opacity=".8"/></g>
    <circle cx="100" cy="66" r="30" fill="none" stroke="#ffe9a0" stroke-width="1.2" opacity=".6"/>`;
  // Cercle de runes au sol (75+)
  if (st >= 6) {
    let runes = '';
    for (let i = 0; i < 12; i++) {
      const a = i * 30 * Math.PI / 180, x = 100 + Math.cos(a) * 52, y = 242 + Math.sin(a) * 11;
      runes += `<path d="M${x - 2},${y} l2,-3 l2,3 z" fill="${st >= 7 ? '#ffe9a0' : '#c9a2ff'}"/>`;
    }
    s += `<g class="eyes"><ellipse cx="100" cy="242" rx="58" ry="13" fill="none" stroke="${st >= 7 ? '#ffe9a0' : '#c9a2ff'}" stroke-width="1.5"/>
      <ellipse cx="100" cy="242" rx="46" ry="9" fill="none" stroke="${st >= 7 ? '#ffe9a0' : '#c9a2ff'}" stroke-width="1" stroke-dasharray="3 3"/>${runes}</g>`;
  } else {
    s += `<ellipse cx="100" cy="243" rx="${st >= 5 ? 50 : 42}" ry="7" fill="#000" opacity=".45"/>`;
  }

  s += `<g transform="translate(0,${lev})">`;
  // Manteau (10+) derrière
  if (st >= 2) s += `<g class="cape"><path d="M78,100 L${st >= 5 ? 52 : 58},236 Q100,244 ${st >= 5 ? 148 : 142},236 L122,100 Z" fill="${C.manteau}"/>
    <path d="M122,100 L${st >= 5 ? 148 : 142},236 L${st >= 5 ? 132 : 128},238 L118,104Z" fill="#000" opacity=".25"/>
    <path d="M78,100 L${st >= 5 ? 52 : 58},236" stroke="#fff" stroke-width="1.2" opacity=".15"/>
    ${st >= 3 ? `<path d="M${st >= 5 ? 52 : 58},236 Q100,244 ${st >= 5 ? 148 : 142},236" fill="none" stroke="${C.or}" stroke-width="2.5"/>` : ''}</g>`;

  // Bâton (5+) à droite, derrière la main
  if (st >= 1) {
    const haut = st >= 2 ? 56 : 92;
    s += `<path d="M136,${haut} L134,238" stroke="${st >= 7 ? '#fff3c4' : C.bois}" stroke-width="${st >= 5 ? 5 : 4}" stroke-linecap="round"/>`;
    if (st >= 2) {
      s += `<path d="M136,${haut + 6} q-8,-8 0,-16 q8,8 0,16z" fill="none" stroke="${st >= 3 ? C.or : C.bois}" stroke-width="2.5"/>
        <path d="M136,${haut - 16} l6,9 l-6,9 l-6,-9z" fill="${C.cristal}"/>`;
      if (st >= 4) s += `<circle class="eyes" cx="136" cy="${haut - 7}" r="${st >= 7 ? 18 : 13}" fill="url(#mcr${id})"/>`;
    } else {
      s += `<circle cx="136" cy="${haut - 2}" r="4" fill="${C.bois}"/>`;
    }
  }

  // Robe longue (cache les jambes)
  s += `<path d="M76,102 Q100,93 124,102 L${st >= 5 ? 138 : 134},236 Q100,244 ${st >= 5 ? 62 : 66},236Z" fill="url(#mro${id})"/>`;
  s += `<path d="M76,102 Q100,93 124,102 L${st >= 5 ? 138 : 134},236 Q100,244 ${st >= 5 ? 62 : 66},236Z" fill="url(#mlat${id})"/>
    <path d="M88,160 Q86,200 82,234 M112,160 Q115,200 120,234 M95,170 Q94,205 93,238" stroke="#000" stroke-width="1.3" opacity=".18" fill="none"/>
    <path d="M84,112 Q80,170 72,232" stroke="#fff" stroke-width="1.2" opacity=".12" fill="none"/>`;
  s += `<path d="M100,104 L100,238" stroke="${C.robeOmbre}" stroke-width="2" opacity=".6"/>`;
  // Bordure et runes dorées (20+)
  if (st >= 3) {
    s += `<path d="M${st >= 5 ? 62 : 66},236 Q100,244 ${st >= 5 ? 138 : 134},236" fill="none" stroke="${C.or}" stroke-width="3"/>
      <path d="M100,104 L100,238" stroke="${C.or}" stroke-width="2" opacity=".85"/>`;
    const runes = [[86, 196], [114, 204], [90, 220], [110, 180]];
    s += runes.map(([x, y]) => `<path d="M${x},${y} l3,-5 l3,5 m-3,-5 v8" stroke="${C.or}" stroke-width="1.2" fill="none" opacity=".9"/>`).join('');
  }
  // Pieds
  s += `<ellipse cx="90" cy="239" rx="8" ry="3.5" fill="#2c211a"/><ellipse cx="110" cy="239" rx="8" ry="3.5" fill="#2c211a"/>`;

  // Bras / manches évasées
  s += `<path d="M76,104 Q64,130 60,166 L76,166 Q78,136 84,112Z" fill="url(#mro${id})"/>
    <path d="M124,104 Q136,130 140,166 L124,166 Q122,136 116,112Z" fill="url(#mro${id})"/>
    <path d="M124,104 Q136,130 140,166 L132,166 Q128,136 120,108Z" fill="#000" opacity=".2"/>
    <path d="M76,104 Q66,128 61,164" stroke="#fff" stroke-width="1.1" opacity=".14" fill="none"/>`;
  if (st >= 3) s += `<path d="M60,166 L76,166 M124,166 L140,166" stroke="${C.or}" stroke-width="2.5"/>`;
  // Ceinture + sacoche / parchemins
  s += `<rect x="74" y="148" width="52" height="6" rx="2" fill="${st >= 3 ? C.or : C.cuir}"/>`;
  if (st === 1) s += `<path d="M120,104 L84,152" stroke="${C.cuir}" stroke-width="4"/><rect x="76" y="150" width="16" height="14" rx="3" fill="${C.cuir}"/>`;
  if (st >= 2) s += `<rect x="80" y="154" width="5" height="16" rx="2" fill="#efe3c4" transform="rotate(-8 82 162)"/><rect x="87" y="154" width="5" height="14" rx="2" fill="#e6d6b0" transform="rotate(6 89 161)"/>`;
  // Mantelet (20+)
  if (st >= 3) s += `<path d="M74,104 Q100,90 126,104 L122,124 Q100,116 78,124Z" fill="${st >= 5 ? '#2a1648' : C.robeOmbre}" stroke="${C.or}" stroke-width="1.5"/>
    <path d="M100,108 l3,6 l6,0 l-5,4 l2,6 l-6,-4 l-6,4 l2,-6 l-5,-4 l6,0z" fill="${C.or}"/>`;
  // Mains
  s += `<circle cx="68" cy="168" r="5.5" fill="${C.peau}"/><circle cx="132" cy="168" r="5.5" fill="${C.peau}"/>`;
  // Baguette + grimoire (1)
  if (st === 0) s += `<path d="M132,168 L148,146" stroke="${C.bois}" stroke-width="3" stroke-linecap="round"/><circle cx="148" cy="146" r="2.5" fill="#bfefff"/>
    <rect x="56" y="150" width="20" height="24" rx="2" fill="#6a3a2a" transform="rotate(-10 66 162)"/><rect x="58" y="152" width="3" height="20" fill="${C.or}" transform="rotate(-10 66 162)"/>`;

  // Chapeau : arrière du bord, derrière la tête
  if (st >= 1 && st < 7) s += `<ellipse cx="100" cy="63" rx="${st >= 5 ? 33 : 29}" ry="7" fill="${C.robeOmbre}"/>
    <path d="M84,64 Q82,76 86,84 L90,80 L88,66Z M116,64 Q118,76 114,84 L110,80 L112,66Z" fill="${C.cheveux}"/>`;
  // Cou + tête (visage détaillé : mâchoire, oreilles, yeux en amande, nez, sourire)
  s += `<path d="M94,86 L106,86 L107,100 Q100,104 93,100Z" fill="${C.peauOmbre}"/>
    <ellipse cx="85.5" cy="77" rx="2.6" ry="4.2" fill="${C.peauOmbre}"/><ellipse cx="114.5" cy="77" rx="2.6" ry="4.2" fill="${C.peauOmbre}"/>
    <path d="M85.5,72 Q85.5,57 100,57 Q114.5,57 114.5,72 Q114.5,82 110,88 Q105,94.5 100,94.5 Q95,94.5 90,88 Q85.5,82 85.5,72Z" fill="${C.peau}"/>
    <g clip-path="url(#mfc${id})"><rect x="84" y="56" width="32" height="40" fill="url(#mvis${id})"/>
      <path d="M110,74 Q114,84 106,93 L116,96 L116,70Z" fill="#000" opacity=".1"/></g>
    <ellipse cx="91" cy="83" rx="3" ry="1.6" fill="#c46a5a" opacity=".16"/><ellipse cx="109" cy="83" rx="3" ry="1.6" fill="#c46a5a" opacity=".16"/>`;
  // Cheveux : mèches sur le front (sous le chapeau)
  s += `<path d="M84.8,75 Q83,57 99,55.5 Q116,55 115.6,73 Q114,66 109,63.5 Q106,68.5 99,66.5 Q93,69.5 89.5,65.5 Q86.5,69 84.8,75Z" fill="${C.cheveux}"/>
    <path d="M92,57 Q88,58 86,63" stroke="${C.cheveux}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  // Sourcils, yeux, nez, bouche
  const lueurM = st >= 6 ? (st >= 7 ? '#ffe9a0' : '#c9a2ff') : null;
  s += `<path d="M88.2,71.4 Q92.8,69.8 97.6,72" stroke="${C.cheveux}" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M102.4,72 Q107.2,69.8 111.8,71.4" stroke="${C.cheveux}" stroke-width="1.6" stroke-linecap="round" fill="none"/>`;
  if (lueurM) s += `<g class="eyes"><ellipse cx="93.3" cy="77" rx="4.8" ry="2.6" fill="${lueurM}" opacity=".45"/><ellipse cx="106.7" cy="77" rx="4.8" ry="2.6" fill="${lueurM}" opacity=".45"/></g>`;
  const oeilM = (cx, sens) => {
    const a = cx - 4.6 * sens, b = cx + 4.6 * sens, iris = lueurM ? (st >= 7 ? '#c9952a' : '#7a3fd1') : C.yeux;
    return `<path d="M${a},77.2 Q${cx},73.4 ${b},76.6 Q${cx},79.8 ${a},77.2Z" fill="#f3eee8"/>
      <circle cx="${cx + .3 * sens}" cy="76.9" r="2.15" fill="${iris}"/><circle cx="${cx + .3 * sens}" cy="76.9" r="1.05" fill="${lueurM ? '#fff' : '#0e0b0a'}"/>
      <circle cx="${cx + .9 * sens}" cy="76.1" r=".62" fill="#fff"/>
      <path d="M${a - .3 * sens},77.3 Q${cx},72.8 ${b + .5 * sens},76.4" stroke="#1c1412" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M${a + .9 * sens},78 Q${cx},80.1 ${b - .4 * sens},77.1" stroke="#5a3a30" stroke-width=".7" opacity=".45" fill="none"/>`;
  };
  s += oeilM(93.3, -1) + oeilM(106.7, 1);
  s += `<path d="M100.4,78.5 L98.9,84.4 Q100.3,85.6 102,84.6" stroke="${C.peauOmbre}" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M96.2,88.2 Q100,90.6 103.8,88.2" stroke="#8a4e42" stroke-width="1.3" fill="none" stroke-linecap="round"/>`;

  // Chapeau (5+) : cône emboîté sur le crâne + avant du bord devant le front (l'arrière est dessiné derrière la tête)
  if (st >= 1 && st < 7) {
    const pointe = st >= 5 ? 6 : st >= 2 ? 14 : 22, tx = st >= 5 ? 122 : 116, rx = st >= 5 ? 33 : 29;
    s += `<g clip-path="url(#mfc${id})"><rect x="84" y="63" width="32" height="10" fill="url(#mhs${id})"/></g>
      <path d="M85.2,64 Q84.6,70 86.2,75.5 Q87.6,70.5 89.4,66Z M114.8,64 Q115.4,70 113.8,75.5 Q112.4,70.5 110.6,66Z" fill="${C.cheveux}"/>
      <path d="M83,63.5 Q89,40 ${tx},${pointe} Q112,40 117,63.5 Q100,68 83,63.5Z" fill="${C.robe}"/>
      <path d="M${tx},${pointe} Q112,40 117,63.5 Q111,65.6 106,66 Q108,42 ${tx},${pointe}Z" fill="#000" opacity=".22"/>
      <path d="M86,60 Q91,42 ${tx - 4},${pointe + 6}" stroke="#fff" stroke-width="1.2" opacity=".18" fill="none"/>
      <path d="M83.5,61.8 Q100,66.6 116.5,61.8" stroke="${st >= 3 ? C.or : C.cuir}" stroke-width="3" fill="none"/>
      <path d="M${100 - rx},63 A${rx},7 0 0,0 ${100 + rx},63 Q100,67.5 ${100 - rx},63Z" fill="${C.robe}"/>
      <path d="M${100 - rx},63 A${rx},7 0 0,0 ${100 + rx},63" stroke="#000" stroke-width="1.1" opacity=".35" fill="none"/>`;
    if (st >= 5) s += `<path d="M98,44 l1.5,3 l3,0 l-2.5,2 l1,3 l-3,-2 l-3,2 l1,-3 l-2.5,-2 l3,0z" fill="${C.or}"/><circle cx="108" cy="32" r="1.6" fill="${C.or}"/><circle cx="92" cy="53" r="1.3" fill="${C.or}"/>`;
  }
  // Couronne de lumière (100)
  if (st >= 7) s += `<path d="M84,62 l5,-12 l6,8 l5,-14 l5,14 l6,-8 l5,12z" fill="#ffe9a0" stroke="${C.or}" stroke-width="1"/>`;

  // Grimoire flottant (35+)
  if (st >= 4) s += `<g class="bob"><rect x="38" y="108" width="24" height="18" rx="2" fill="${st >= 5 ? '#4a1f2a' : '#5a3a2a'}" transform="rotate(-12 50 117)"/>
    <path d="M40,110 l20,-4" stroke="${C.or}" stroke-width="1.5" transform="rotate(-12 50 117)"/>
    <circle cx="50" cy="117" r="3" fill="${C.or}"/><circle cx="50" cy="117" r="10" fill="${auraCol}" opacity=".2"/></g>`;

  // Orbes (100)
  if (st >= 7) s += `<g class="spin" style="transform-origin:100px 150px">
      <circle cx="40" cy="150" r="6" fill="url(#mcr${id})"/><circle cx="160" cy="150" r="6" fill="url(#mcr${id})"/><circle cx="100" cy="210" r="6" fill="url(#mcr${id})"/></g>`;
  // Étincelles (75+)
  if (st >= 6) {
    const pts = [[36, 210, 0], [164, 196, 1.1], [52, 176, 2.2], [150, 226, .6], [28, 140, 1.7], [172, 150, 2.8]];
    s += pts.map(([x, y, d]) => `<circle class="p" style="animation-delay:${d}s" cx="${x}" cy="${y}" r="2" fill="${st >= 7 ? '#ffe9a0' : '#d9b8ff'}"/>`).join('');
  }
  return s + '</g></svg>';
}

/* ====================== Voleur assassin : 8 paliers d'évolution ======================
 * Même format que magicien() : viewBox 200×260, mêmes classes d'animation (aura, cape, eyes, spin, bob, p).
 * Teint, cheveux et yeux réglables dans C (à caler sur la description du joueur).
 */
const PALIERS_VOLEUR = [
  { n: 1, titre: "l'Apprenti", desc: 'Tunique grise, capuche baissée, un simple couteau.' },
  { n: 5, titre: "l'Aventurier", desc: 'Capuche relevée, veste de cuir, gants, première dague.' },
  { n: 10, titre: 'le Vagabond', desc: 'Cape sombre, masque de tissu, deux dagues.' },

function voleur(st, id, look) {

  const capuche = st >= 1, masque = st >= 2;
  const yeuxLueur = st >= 6 ? (st >= 7 ? '#d9b8ff' : '#b9ffa8') : null;

  let s = `<svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Voleur assassin, palier ${st + 1}">
  <defs>
    <clipPath id="vfc${id}"><path d="M85.5,72 Q85.5,57 100,57 Q114.5,57 114.5,72 Q114.5,82 110,88 Q105,94.5 100,94.5 Q95,94.5 90,88 Q85.5,82 85.5,72Z"/></clipPath>

    <linearGradient id="vtis${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${C.tissu}"/><stop offset="100%" stop-color="${C.tissuOmbre}"/>

    <radialGradient id="vau${id}" cx="50%" cy="50%" r="50%">

  /* ---------- Fond : lune, aura, fumée ---------- */

  if (st >= 4) {
    s += `<g class="aura" style="transform-origin:100px 238px">
      <ellipse cx="78" cy="238" rx="34" ry="8" fill="${brume}" opacity=".35"/>
      <ellipse cx="124" cy="240" rx="38" ry="7" fill="${brume}" opacity=".3"/>

  } else s += `<ellipse cx="100" cy="240" rx="40" ry="6.5" fill="#000" opacity=".45"/>`;

  /* ---------- Cape / manteau (derrière) ---------- */
  if (st >= 2) {
    const bas = st >= 5 ? 236 : 222;
    const frange = st >= 5 ? `L146,${bas} l-8,-7 l-7,8 l-8,-8 l-8,9 l-8,-8 l-7,8 l-8,-8 l-8,8 l-8,-7 L54,${bas}` : `L140,${bas} Q100,${bas + 8} 60,${bas}`;
    s += `<g class="cape"><path d="M80,100 Q66,150 ${st >= 5 ? 54 : 60},${bas} ${frange} Q134,150 120,100 Z" fill="${C.tissuOmbre}"/>

  // Capuche : partie arrière (avant la tête)
  if (capuche) s += `<path d="M78,104 Q71,74 82,55 Q90,41 100,40 Q112,40 119,54 Q129,74 122,104 Z" fill="${C.tissuOmbre}"/>`;

  /* ---------- Jambes et bottes ---------- */

  s += `<path d="M85,150 Q82,180 81.5,${genou} L96.5,${genou} Q97.5,182 99.6,160 Z" fill="${C.tissuOmbre}"/>

  /* ---------- Torse ---------- */

  else {
    s += `<path d="M80,102 Q100,96 120,102 L118,156 Q100,161 82,156 Z" fill="url(#vtis${id})"/>
      <path d="M81,102 Q90,99 98,104 L96,156 L82,156 Z" fill="${C.cuir}"/><path d="M119,102 Q110,99 102,104 L104,156 L118,156 Z" fill="${C.cuir}"/>
      <path d="M98,104 L96,156 M102,104 L104,156" stroke="${C.cuirClair}" stroke-width="1"/>`;

      s += [[86, 112], [92, 113], [108, 113], [114, 112], [88, 146], [112, 146]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.1" fill="${st >= 5 ? C.argent : '#b8a27a'}"/>`).join('');
    }
  }
  // Bandoulière de couteaux de lancer (20+)
  if (st >= 3) {
    s += `<path d="M84,104 L118,150" stroke="${C.cuirClair}" stroke-width="4.5" stroke-linecap="round"/>`;
    s += [[90, 112], [97, 121.5], [104, 131], [111, 140.5]].map(([x, y]) =>
      `<path d="M${x - 2},${y - 5} l4,0 l-.5,6 l-3,0z" fill="${C.argent}"/><rect x="${x - 1.6}" y="${y}" width="3.2" height="4" fill="${C.cuir}"/>`).join('');
  }
  // Ceinture, boucle, bourses
  s += `<rect x="80" y="148" width="40" height="7" rx="2" fill="${C.cuir}"/>
    <rect x="96" y="147.5" width="8" height="8" rx="1.5" fill="none" stroke="${st >= 5 ? C.argent : '#b8a27a'}" stroke-width="1.6"/>`;
  if (st >= 1) s += `<path d="M107,155 h9 v8 q-4.5,4 -9,0z" fill="${C.cuirClair}"/><path d="M84,155 h8 v7 q-4,3.5 -8,0z" fill="${C.cuirClair}"/>`;
  // Fourreau de dague à la hanche (5)
  if (st === 1) s += `<path d="M118,152 L130,182 L126,184 L114,154Z" fill="${C.cuir}"/><rect x="114" y="146" width="5" height="8" rx="1" fill="${C.cuirClair}" transform="rotate(-22 116 150)"/>`;

  /* ---------- Bras ---------- */
  const manche = st === 0 ? 'url(#vtis' + id + ')' : C.tissu;
  s += `<path d="M80,103 Q69,122 69,148 L78,150 Q79,128 86,112Z" fill="${manche}"/>
    <path d="M120,103 Q131,122 131,148 L122,150 Q121,128 114,112Z" fill="${manche}"/>`;
  if (st >= 3) s += `<path d="M68.5,136 L78.5,137 L78,149 L69,148Z M121.5,137 L131.5,136 L131,148 L122,149Z" fill="${C.cuir}"/>
    <path d="M69,141 L78.5,142 M121.5,142 L131,141" stroke="${C.cuirClair}" stroke-width="1"/>`;
  if (st >= 3) s += `<path d="M76,102 Q70,104 69,114 Q76,112 84,108Z" fill="${C.cuirClair}"/><circle cx="74" cy="107" r="1" fill="${st >= 5 ? C.argent : '#b8a27a'}"/>`;
  // Mains (gants à partir du palier 2)

  // Main gauche : seconde dague, pointe vers l'avant-haut (10+)

    s += `${halo}<path d="M70.5,148 L73.5,150 L57,121 L58.5,128Z" fill="url(#vlame${id})"/>

      <rect x="73" y="152" width="3" height="8" rx="1.2" fill="${C.cuir}" transform="rotate(30 74.5 156)"/>`;

  /* ---------- Cou, tête, visage ---------- */
  s += `<path d="M94,86 L106,86 L107,100 Q100,104 93,100Z" fill="${L.peauOmbre}"/>`;

  // Visage : mâchoire affinée
  s += `<path d="M85.5,72 Q85.5,57 100,57 Q114.5,57 114.5,72 Q114.5,82 110,88 Q105,94.5 100,94.5 Q95,94.5 90,88 Q85.5,82 85.5,72Z" fill="${L.peau}"/>`;
  s += `<g clip-path="url(#vfc${id})"><rect x="84" y="56" width="32" height="40" fill="url(#vvis${id})"/>

    ${capuche ? `<rect x="84" y="56" width="32" height="${st >= 6 ? 22 : 17}" fill="url(#vcap${id})"/>` : ''}</g>`;
  // Pommettes
  s += `<ellipse cx="91" cy="83" rx="3" ry="1.6" fill="#c46a5a" opacity=".16"/><ellipse cx="109" cy="83" rx="3" ry="1.6" fill="#c46a5a" opacity=".16"/>`;
  // Sourcils : légèrement froncés, l'air concentré
  s += `<path d="M88.2,71.2 Q92.8,69.6 97.6,72.4" stroke="${L.cheveux}" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  // Yeux en amande : blanc, iris, pupille, reflet, paupière
  const oeil = (cx, sens) => {
    const a = cx - 4.6 * sens, b = cx + 4.6 * sens;
    const iris = yeuxLueur || L.yeux;
    return `<path d="M${a},77.2 Q${cx},73.4 ${b},76.6 Q${cx},79.8 ${a},77.2Z" fill="#f3eee8"/>
      <circle cx="${cx + .3 * sens}" cy="76.9" r="2.15" fill="${iris}"/><circle cx="${cx + .3 * sens}" cy="76.9" r="1.05" fill="${yeuxLueur ? '#fff' : '#0e0b0a'}"/>

    <path d="M90,86 Q100,84 110,86 M93,91 Q100,89.5 107,91" stroke="#000" stroke-width=".8" opacity=".35" fill="none"/>
    ${st >= 5 ? `<path d="M85,80.5 Q100,77.4 115,80.5" stroke="${C.argent}" stroke-width="1" fill="none" opacity=".8"/>` : ''}
    <path d="M87,90 Q100,99 113,90 L115,106 Q100,112 85,106Z" fill="${C.masque}"/>`;
  // Cheveux (sans capuche) : mèches balayées
  if (!capuche) s += `<path d="M84.8,75 Q83,57 99,55.5 Q116,55 115.6,73 Q114,66 109,63.5 Q106,68.5 99,66.5 Q93,69.5 89.5,65.5 Q86.5,69 84.8,75Z" fill="${L.cheveux}"/>
    <path d="M99,55.5 Q106,52 112,56 M92,57 Q88,58 86,63" stroke="${L.cheveux}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  else s += `<path d="M88.3,67 Q91.5,58.6 100,58.4 Q108.5,58.6 111.7,67 Q107.5,62.2 102.5,63.6 Q99.5,60.8 96,64.6 Q92,62.4 88.3,67Z" fill="${L.cheveux}"/>
    <path d="M98,59.2 Q93.6,62.6 92.4,68.2" stroke="${L.cheveux}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`; // frange sous la capuche
  // Capuche : bord avant qui encadre le visage
  // Capuche : bord avant qui encadre le visage et retombe en col sur les épaules
  if (capuche) s += `<path fill-rule="evenodd" d="M75,110 Q71,74 83,56 Q91,43 100,42.5 Q110,43 117,56 Q129,74 125,110 Q113,101 100,102 Q87,101 75,110 Z
      M87.5,92 Q84,78 88.5,66.5 Q93,58.5 100,58.2 Q107,58.5 111.5,66.5 Q116,78 112.5,92 Q100,101.5 87.5,92 Z" fill="${C.tissu}"/>
    <path d="M87.5,92 Q84,78 88.5,66.5 Q93,58.5 100,58.2 Q107,58.5 111.5,66.5 Q116,78 112.5,92 Q100,101.5 87.5,92" stroke="#000" stroke-width="1.6" opacity=".4" fill="none"/>
    <path d="M100,43 Q104,50 100,58" stroke="#000" stroke-width="1" opacity=".25" fill="none"/>
    <path d="M82,104 Q92,98 100,102 Q108,98 118,104" stroke="#000" stroke-width="1" opacity=".25" fill="none"/>
    ${st >= 5 ? `<path d="M87.5,92 Q84,78 88.5,66.5 Q93,58.5 100,58.2 Q107,58.5 111.5,66.5 Q116,78 112.5,92 Q100,101.5 87.5,92" stroke="${C.argent}" stroke-width=".9" opacity=".45" fill="none"/>` : ''}`;

  /* ---------- Effets des hauts paliers ---------- */
  // Ombres qui s'effilochent (75+)
  if (st >= 6) {
    const w = [[60, 200, 0], [140, 190, 1.2], [70, 150, 2.1], [132, 140, .7], [100, 226, 1.6], [52, 120, 2.8]];
    s += w.map(([x, y, d]) => `<path class="p" style="animation-delay:${d}s" d="M${x},${y} q3,-6 0,-12 q-3,-6 0,-12" stroke="${brume}" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".8"/>`).join('');
  }
  // Lames spectrales en orbite (100)
  if (st >= 7) {
    const lame = (x, y, r) => `<path d="M${x},${y - 9} l2.6,9 l-2.6,9 l-2.6,-9z" fill="${C.poison}" opacity=".85" transform="rotate(${r} ${x} ${y})"/>`;
    s += `<g class="spin" style="transform-origin:100px 150px">${lame(32, 150, 90)}${lame(168, 150, 90)}${lame(100, 228, 0)}</g>`;
  }
  return s + '</svg>';
}

/* ---------- Boss du Crépuscule ---------- */
const etoiles = r => '★'.repeat(r) + '☆'.repeat(Math.max(0, 5 - r));
const joursRestants = fin => Math.max(0, Math.round((versDate(fin) - versDate(state.today)) / 864e5));
const estMage = s => /magicien/i.test(String(((s || state).classe || {}).nom || ''));
function couleurHeros(nom, s) { return nom === s.heros ? 'var(--moi)' : 'var(--allie)'; }
/** Petite carte du boss de la semaine (onglet Quêtes) */
function carteBossMini(s) {
  const b = s.boss && s.boss.semaine;
  if (!b) return '';
  const pct = b.pvMax ? Math.max(0, Math.min(100, b.pv / b.pvMax * 100)) : 0;
  const j = joursRestants(b.fin);
  return `<button class="boss-mini ${b.statut === 'Vaincu' ? 'vaincu' : ''}" data-tab="combat">
    <div class="bm-av">${bossSvg(b.visuel, 'mini')}</div>

/* ---------- Textes longs : 4 lignes, puis « Lire la suite » ---------- */
const textesOuverts = {};
function plie(texte, cls, lignes) {

}
function hash32(t) { let h = 0; for (let i = 0; i < String(t).length; i++) h = (h * 31 + String(t).charCodeAt(i)) | 0; return 'p' + (h >>> 0); }
function boutonsPlies() {

    const t = d.querySelector('.pl-t'), b = d.querySelector('.pl-b');

/* ---------- Le Maître du Jeu : la Saga de l'Aube ---------- */
let mjDemande = '';

['Force', 'Endurance', 'Agilité', 'Intelligence', 'Sagesse', 'Volonté', 'Charisme'].forEach(c => { BENED['carac_' + c] = { type: 'carac', carac: c, mult: 1.2 }; });
function beneditionActive(s) { const m = s.mj; if (!m || !m.pret || m.decision == null) return null; const c = m.choix[m.decision]; return c ? Object.assign({ texte: c.effetTexte }, BENED[c.effet] || {}) : null; }
let rebondDemande = '';
function demanderMJ(s) {

  }).catch(() => {});

function vueSaga(s) {

    ${g.membres.slice().sort((x, y) => x.xp - y.xp).map(a => `<button data-palier="${esc(a.nom)}"><b>${esc(a.nom)}</b> · <span class="bonus">+${a.xp} XP</span>${a.note ? `<br><span class="muted" style="font-size:12px">${esc(a.note)}</span>` : ''}</button>`).join('')}

const moisNom = ym => { const m = Number(String(ym).slice(5, 7)); return ['', 'janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'][m] || 'ce mois'; };
function carteAnnexe(a) {
  let info = a.finDeMois ? `bilan de ${moisNom(a.moisBilan)}` : a.mensuel ? 'une fois par mois' : a.repetable ? (a.fois ? `faite ${a.fois} fois` : 'répétable') : 'unique';

function carteEpique(o) {
  const cls = { 'Accompli': 'st-done', 'Dans les temps': 'st-ok', 'En retard': 'st-late', 'Échoué': 'st-fail', 'À venir': 'st-ok' }[o.statut] || '';
  const pct = Math.min(100, o.progression * 100), temps = Math.min(100, o.temps * 100);
  return `<div class="epic">
    <div class="epic-top"><div class="epic-name">${esc(o.nom)}${o.sous ? `<div class="sous">${esc(o.sous)}</div>` : ''}</div><div class="epic-reward">🏆 ${Number(o.recompense).toLocaleString('fr-FR')} XP</div></div>
    <div class="bar"><i style="width:${pct}%"></i><span class="mark" style="left:calc(${temps}% - 1px)" title="Temps écoulé"></span></div>
    <div class="epic-meta"><span>${o.statut === 'À venir' && o.debut ? `commence le ${dateCourte(o.debut)}` : `${o.faites}/${o.visees} séances`} · fin ${dateCourte(o.echeance)}</span><span class="${cls}">${o.statut}</span></div>
  </div>`;
}

function carteBilan(s, dimanche) {
  const b = s.bilan.semaine, pr = s.bilan.precedente;
  const delta = pr.xp ? Math.round((b.xp - pr.xp) / pr.xp * 100) : null;
  const tendance = delta === null ? '' : `<div class="${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta)} % vs sem. dern.</div>`;
  const meilleure = s.habitudes.reduce((m, h) => (h.serieNb > 0 && h.serie > m.serie ? h : m), { serie: 0 });
  let mot;
  if (b.aJour === b.total && b.total) mot = 'Semaine parfaite : toutes tes habitudes sont à jour. Légendaire.';
  else if (b.rates === 0) mot = 'Aucun raté cette semaine. Continue comme ça.';
  else if (delta !== null && delta > 0) mot = 'Plus d\'XP que la semaine dernière malgré quelques ratés : la progression est là.';
  else mot = 'Semaine plus difficile. Choisis UNE habitude à sécuriser la semaine prochaine.';
  return `<div class="bilan ${dimanche ? 'dimanche' : ''}">
    <h3>${dimanche ? 'Bilan du dimanche' : 'Semaine en cours'}</h3>
    <div class="sous">Du ${dateCourte(b.lundi)} au ${dateCourte(b.dimanche)}</div>
    <div class="kpis">
      <div class="kpi"><b>${b.xp}</b><span>XP gagnée</span>${tendance}</div>
      <div class="kpi"><b>${b.faits}</b><span>quêtes faites</span></div>
      <div class="kpi"><b>${b.aJour}/${b.total}</b><span>habitudes à jour</span></div>
      <div class="kpi"><b>${b.rates}</b><span>ratés</span></div>
      <div class="kpi"><b>${b.jokers}</b><span>joker utilisé</span></div>
      <div class="kpi"><b>${b.bonus}</b><span>bonus de série</span></div>
    </div>
    <p>${meilleure.serie ? `🔥 Meilleure série : <b>${esc(meilleure.nom)}</b>, ${meilleure.serie} jours. ` : ''}${mot}</p>
  </div>`;
}

/* Caractéristiques d'un héros (soi ou compagnon) */
function statsDe(s) {
  return (s.stats || []).map(st => {
    const mod = Math.max(0, Math.floor((st.score - 10) / 2)); // comme le d20 : jamais négatif
    const max = st.score >= 20, xpp = s.xpParPoint || 1;
    const dansPalier = st.xp % xpp;
    const pct = max ? 100 : dansPalier / xpp * 100;
    return `<div class="stat2">
      <div class="stat2-top"><span>${ICONES[st.nom] || ''} <b>${st.nom}</b></span>
        <span><span class="sc">${st.score}</span> <span class="md">+${mod}</span></span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="stat2-sub">${max ? 'Score maximum atteint' : `${Math.round(dansPalier).toLocaleString('fr-FR')} / ${Number(xpp).toLocaleString('fr-FR')} XP avant ${st.score + 1}`} · ${Math.round(st.xp).toLocaleString('fr-FR')} XP au total</div>
    </div>`;
  }).join('');
}

/* Fiches des compagnons : gardées sur le téléphone, rechargées en arrière-plan */
const fichesComp = {};
try { Object.assign(fichesComp, JSON.parse(localStorage.getItem('fichesComp') || '{}')); } catch (e) {}
const fichesEnCours = {};
function chargerFiche(nom, fond) {
  if (fichesEnCours[nom]) return fichesEnCours[nom];
  fichesEnCours[nom] = (fond ? apiFond : api)('voirCompagnon', nom).then(c => {
    fichesComp[nom] = { data: c, t: Date.now() };
    try { localStorage.setItem('fichesComp', JSON.stringify(fichesComp)); } catch (e) {}
    return c;
  }).finally(() => { delete fichesEnCours[nom]; });
  return fichesEnCours[nom];
}
function prechargerFiches(s) {
  if (!(enLigne || distant)) return;
  (s.compagnons || []).forEach(c => {
    const m = fichesComp[c.nom];
    if (!m || Date.now() - m.t > 60000) chargerFiche(c.nom, true).catch(() => {});
  });
}

  const ligne = (h, droite) => `<div class="cl"><div><b>${esc(h.nom)}</b><span>${ICONES[h.carac] || '⭐'} ${caracs(h)}${h.serieNb > 0 && h.serie > 0 ? ` · 🔥 ${h.serie} j` : ''}</span></div>${droite}</div>`;
  const auj = c.habitudes.filter(h => !h.enPause && (h.aFaire || h.jour.fait || h.jour.rate || h.jour.repos));
  const sem = c.habitudes.filter(h => !h.enPause);

function dessinerGrille() {
  const c = document.getElementById('lifegrid');
  if (!c || !profil || !profil.grille) return;
  const g = c.getContext('2d'), t = 6;
  for (let i = 0; i < profil.grille.length; i++) {
    const code = profil.grille[i], x = (i % 52) * t, y = Math.floor(i / 52) * t;
    g.fillStyle = COULEURS_GRILLE[code] || COULEURS_GRILLE[0];
    g.fillRect(x, y, t - 1, t - 1);
    if (code === '6') { g.strokeStyle = '#d4ad3c'; g.lineWidth = 1; g.strokeRect(x - .5, y - .5, t, t); }
  }
  g.fillStyle = 'rgba(212,173,60,.35)';
  for (let d = 10; d < 80; d += 10) g.fillRect(0, d * t - 1, 52 * t, 1);
}

async function chargerProfil(force) {

/** Appel d'un réglage : met à jour l'état et réaffiche. */
/* Effet attendu de chaque réglage, appliqué tout de suite à l'écran (le Sheet confirme ensuite) */
const EFFETS_REGLAGE = {
  basculerPause: (n, nom) => { const h = n.habitudes.find(x => x.nom === nom); if (h) h.enPause = !h.enPause; },
  reglerConfort: (n, c) => { n.reglages.confort = c; },
  reglerDevise: (n, d) => { n.reglages.devise = d; },
  preparerSort: (n, q) => { n.capacites = Object.assign({}, n.capacites, { sortPrepare: q }); },
  utiliserRestauration: (n, q) => {
    const h = n.habitudes.find(x => x.nom === q) || n.annexes.find(x => x.nom === q);
    if (h && h.jour.rate > 0) h.jour.rate--;
    if (!n.arc) n.pv = Math.min(n.pvMax, n.pv + (n.regles ? n.regles.pen : 0));
  },
  renommerQuete: (n, ancien, nouveau) => { [...n.habitudes, ...n.annexes].forEach(x => { if (x.nom === ancien) x.nom = nouveau; }); },
  changerDifficulte: (n, v) => { n.reglages.difficulte.niveau = v; },
  choisirTitre: (n, id) => { if (n.titres) n.titres.choisi = id || ''; },
  encourager: n => { if (n.camp) n.camp.encourage = true; },
  voterMJ: (n, i) => { const m = n.mj; if (!m) return; m.monVote = i; m.votes = Object.assign({}, m.votes, { [n.heros]: i });
    const autres = Object.keys(m.votes).filter(k => k !== n.heros); if (autres.length && m.votes[autres[0]] === i) { m.decision = i; m.parMJ = false; } },
  toggleVacances: n => {
    const R = n.reglages;
    if (n.vacances) { n.vacances = null; (R.vacances || []).forEach(v => { if (v.enCours) { v.enCours = false; v.fin = isoPlus(n.today, -1); } }); R.vacances = (R.vacances || []).filter(v => v.fin === '' || v.fin >= n.today); }
    else { n.vacances = { depuis: n.today }; (R.vacances = R.vacances || []).push({ index: -1, debut: n.today, fin: '', enCours: true }); }
  },
  planifierVacances: (n, deb, fin) => {
    const enCours = deb <= n.today && (!fin || fin >= n.today);
    (n.reglages.vacances = n.reglages.vacances || []).push({ index: -1, debut: deb, fin: fin || '', enCours });
    if (enCours) n.vacances = { depuis: deb };
  },
  supprimerVacances: (n, i) => {
    const R = n.reglages, v = (R.vacances || []).find(x => x.index === i);
    R.vacances = (R.vacances || []).filter(x => x.index !== i);
    if (v && v.enCours) n.vacances = null;
  },
  decalerSeance: (n, nom, de, a) => { (n.reglages.decalages = n.reglages.decalages || []).push({ nom, de, a });
    const h = n.habitudes.find(x => x.nom === nom); if (h) { (h.decalages = h.decalages || []).push({ nom, de, a }); if (de === n.today && !h.jour.fait) h.aFaire = false; if (a === n.today) h.aFaire = true; } },
  annulerDecalage: (n, nom, de, a) => { const f = x => !(x.nom === nom && x.de === de && x.a === a); n.reglages.decalages = (n.reglages.decalages || []).filter(f);
    const h = n.habitudes.find(x => x.nom === nom); if (h) { h.decalages = (h.decalages || []).filter(f); if (a === n.today && !h.jour.fait) h.aFaire = false; if (de === n.today) h.aFaire = true; } },
  reglerRappel: (n, cfg) => { n.reglages.rappel = Object.assign({}, n.reglages.rappel, cfg); },
  sauvegarderMaintenant: n => { if (n.reglages.sauvegarde) n.reglages.sauvegarde.derniere = n.today; },
  proposerPacte: (n, id) => { if (n.camp) { const m = n.camp.modeles.find(x => x.id === id); if (m) n.camp.pacte = { id, texte: m.texte, par: n.heros, accepte: false }; } },
  accepterPacte: n => { if (n.camp && n.camp.pacte) Object.assign(n.camp.pacte, { accepte: true, ok: true, detail: 'pacte scellé' }); }
};
async function regler(fn, ...args) {
  const effet = EFFETS_REGLAGE[fn];
  if (effet && state) {
    if (!confirme) confirme = state;
    try { const n = copie(state); effet(n, ...args); state = n; render(); } catch (e) {}
  }
  envoisEnCours++;
  const p = fileEnvois.then(() => api(fn, ...args));
  fileEnvois = p.catch(() => {});
  try {
    const s = await p; envoisEnCours--;
    if (envoisEnCours === 0) { state = s; confirme = null; render(); } else confirme = s;
    return true;
  } catch (e) {
    envoisEnCours--;
    toast(e && e.message ? e.message : String(e));
    if (confirme && envoisEnCours === 0) { state = confirme; confirme = null; }
    render(); return false;
  }
}

/* ---------- Saisies : réponse immédiate à l'écran, synchronisation en arrière-plan ----------
 * La carte, l'XP et les PV bougent dès le toucher (prédiction locale). Les envois partent ensuite
 * un par un vers le Sheet ; quand le dernier revient, l'état exact du serveur remplace la prédiction.
 */
let fileEnvois = Promise.resolve(), envoisEnCours = 0, confirme = null;
const copie = o => JSON.parse(JSON.stringify(o));

/** Prédit l'effet d'une saisie. Renvoie null si on ne sait pas la prédire (on attend alors le serveur). */
/* Historique des saisies de la session, par quête : sert à savoir quoi annuler sans attendre le Sheet */
const histoSaisies = {};
function derniereSaisie(q) {
  const h = histoSaisies[q.nom] || [];
  for (let i = h.length - 1; i >= 0; i--) if (q.jour[h[i]] > 0) return h[i];
  return q.jour.fait > 0 ? 'fait' : q.jour.rate > 0 ? 'rate' : q.jour.repos > 0 ? 'repos' : '';
}
/* Ajoute (ou retire, si dXp < 0) de l'XP à l'état prédit, avec la barre et le niveau */
function bougerXp(n, res, dXp) {
  res.dXp = dXp;
  const span = n.progression < 1 && n.progression > 0 ? n.xpSuivant / (1 - n.progression) : n.xpSuivant || 0;
  n.xpTotale = Number(n.xpTotale) + dXp;
  if (dXp > 0 && dXp >= n.xpSuivant && n.xpSuivant > 0) { // la montée de niveau se voit tout de suite
    n.niveau = Number(n.niveau) + 1; res.monte = n.niveau;
    n.progression = 0.03; n.xpSuivant = Math.max(1, Math.round(span * 1.1)); // le Sheet donnera la valeur exacte
  } else {
    n.xpSuivant = Math.max(0, n.xpSuivant - dXp);
    if (span > 0) n.progression = Math.max(0, Math.min(1, n.progression + dXp / span));
  }
}
function predire(s, nom, statut) {
  const R = s.regles;
  if (!R) return null;
  const n = copie(s);
  const q = n.habitudes.find(h => h.nom === nom) || n.annexes.find(a => a.nom === nom);
  if (!q) return null;
  const estAnnexe = !n.habitudes.some(h => h.nom === nom);
  const res = { etat: n, dXp: 0, dPv: 0 };
  const capa = n.capacites || {};
  const gain = rang => {
    const epuise = n.arc || n.pv < n.seuilEpuise;
    const sort = capa.sortPrepare === nom ? 1.5 : 1;
    const sournoise = capa.roublard && estAnnexe && (capa.liste || []).some(c => c.n === 5 && c.debloquee && /^Prête/.test(c.statut)) ? 2 : 1;
    return Math.round((Number(q.xp) || 0) * R.rend[Math.min(rang, 2)] * (epuise ? n.malus : 1) * (R.xpMult || 1) * ((n.d20 && n.d20.mult) || 1) * sort * sournoise * multEvt(n, q, estAnnexe));
  };
  const soin = estAnnexe ? R.soinAnnexe : R.soinHab;
  if (statut === 'Fait') {
    const deja = q.jour.fait;
    bougerXp(n, res, gain(deja));
    if (!deja && !n.arc) res.dPv = Math.min(n.pvMax - n.pv, soin);
    q.jour.fait++;
    if (estAnnexe) q.fois = (Number(q.fois) || 0) + 1; else q.semaine = (Number(q.semaine) || 0) + 1;
    if (estAnnexe && q.groupe) n.annexes = n.annexes.filter(a => a === q || a.groupe !== q.groupe || a.jour.fait || a.jour.rate || a.jour.repos);
    res.trace = 'fait';
  } else if (statut === 'hier') { // rattrapage de la veille : XP tout de suite, le Sheet recalcule le reste
    bougerXp(n, res, gain(0));
    if (!estAnnexe && indexJour(n.today) !== 0) q.semaine = (Number(q.semaine) || 0) + 1;
  } else if (statut === 'Raté') {
    if (!n.arc) res.dPv = -Math.min(n.pv, R.pen);
    q.jour.rate++; res.trace = 'rate';
  } else if (statut === 'Repos') {
    if (n.jokersRestants <= 0) return null;
    n.jokersRestants--; q.jour.repos++; res.trace = 'repos';
  } else if (statut === 'undo') {
    const quoi = derniereSaisie(q);
    if (!quoi) return null;
    res.annule = quoi;
    if (quoi === 'fait') {
      q.jour.fait--;
      bougerXp(n, res, -gain(q.jour.fait));
      if (q.jour.fait === 0 && !n.arc) res.dPv = -Math.min(n.pv, soin);
      if (estAnnexe) q.fois = Math.max(0, (Number(q.fois) || 0) - 1); else q.semaine = Math.max(0, (Number(q.semaine) || 0) - 1);
    } else if (quoi === 'rate') {
      q.jour.rate--;
      if (!n.arc) res.dPv = Math.min(n.pvMax - n.pv, R.pen);
    } else { q.jour.repos--; n.jokersRestants++; }
  }
  // Boss : dégâts et riposte tout de suite
  if (n.boss && n.boss.regles) ['semaine', 'mois'].forEach(t => {
    const b = n.boss[t];
    if (!b || b.statut !== 'En cours') return;
    const rip = Math.round(b.pvMax * (t === 'mois' ? n.boss.regles.ripMois : n.boss.regles.ripSemaine));
    let d = 0;
    if (res.dXp) d = degatsQuete(n, b, q, res.dXp, estAnnexe);
    if (statut === 'Raté' || (statut === 'undo' && res.annule === 'rate')) {
      const sens = statut === 'Raté' ? 1 : -1;
      b.riposte = Math.max(0, (b.riposte || 0) + sens * rip); b.pv = Math.max(0, b.pv + sens * rip);
      if (b.coups && sens > 0) b.coups.unshift({ date: n.today, heros: n.heros, quete: q.nom, type: 'riposte', valeur: rip });
      if (b.coups && sens < 0) { const k = b.coups.findIndex(c => c.type === 'riposte' && c.quete === q.nom && c.heros === n.heros); if (k >= 0) b.coups.splice(k, 1); }
    }
    if (d) {
      b.degats[n.heros] = Math.max(0, (b.degats[n.heros] || 0) + d);
      b.pv = Math.max(0, b.pv - d);
      if (d > 0) (res.coups = res.coups || []).push({ t, d });
      if (d > 0 && b.coups) b.coups.unshift({ date: n.today, heros: n.heros, quete: q.nom, type: 'coup', valeur: d, faible: q.carac === b.faible, resiste: q.carac === b.resiste });
      if (d < 0 && b.coups) { const k = b.coups.findIndex(c => c.type === 'coup' && c.quete === q.nom && c.heros === n.heros && c.date === n.today); if (k >= 0) b.coups.splice(k, 1); }
      if (b.pv === 0 && d > 0) { b.statut = 'Vaincu'; b.vaincuLe = n.today; (res.victoires = res.victoires || []).push(b); }
    }
  });
  n.pv += res.dPv;
  if (!n.arc) n.etat = n.pv < n.seuilEpuise ? `Épuisé (XP ×${String(n.malus).replace('.', ',')})` : 'En forme';
  return res;
}

let niveauCelebre = 0;
function celebrerChangements(avant, apres) {
  if (!avant || !apres) return;
  if (niveauCelebre && apres.niveau <= niveauCelebre) { celebrer(apres.nouveauxBonus); return; } // déjà fêté à la prédiction
  if (palierDe(apres.niveau, classeDe(apres)) > palierDe(avant.niveau, classeDe(apres))) setTimeout(() => evolution(apres.niveau), 500);
  else if (apres.niveau > avant.niveau) setTimeout(() => niveauSup(apres.niveau, apres.titre, apres.titre !== avant.titre), 500);
  celebrer(apres.nouveauxBonus);
}

const dernierToucher = {};
function agir(nom, statut) {
  if (busy.has(nom)) return;
  // Anti double-toucher : un 2e toucher sur la même carte en moins de 0,7 s est ignoré
  const t = Date.now();
  if (statut === 'Fait' && dernierToucher[nom] && t - dernierToucher[nom] < 700) return;
  dernierToucher[nom] = t;
  const annexe = state.annexes.find(x => x.nom === nom);
  if (statut === 'Fait' && annexe && !annexe.repetable && annexe.jour.fait > 0) { toast('Quête unique : déjà accomplie ✔'); return; }
  if (!confirme) confirme = state;
  const pred = predire(state, nom, statut);
  if (pred) {
    if (pred.trace) (histoSaisies[nom] = histoSaisies[nom] || []).push(pred.trace);
    if (pred.annule) { const h = histoSaisies[nom] || []; const k = h.lastIndexOf(pred.annule); if (k >= 0) h.splice(k, 1); }
    state = pred.etat; render();
    if (pred.annule) { toast('↩️ Saisie annulée'); if (pred.dXp < 0) flotter(`${pred.dXp} XP${pred.dPv ? ` · ${pred.dPv > 0 ? '+' : ''}${pred.dPv} PV` : ''}`, 'var(--muted)'); else if (pred.dPv) flotter(`+${pred.dPv} PV`, 'var(--ok)'); }
    if (!pred.annule && pred.dXp > 0) flotter(`+${pred.dXp} XP${pred.dPv > 0 ? ` · +${pred.dPv} PV` : ''}`, 'var(--xp2)');
    else if (!pred.annule && pred.dPv < 0) flotter(`${pred.dPv} PV`, 'var(--pv)');
    else if (statut === 'Repos') flotter('Repos', 'var(--rest)');
    if (pred.dXp > 0) vib(25);
    if (pred.coups && pred.coups.length) setTimeout(() => flotter(`⚔ −${pred.coups[0].d} PV au boss`, '#ff8b7a'), 450);
    (pred.victoires || []).forEach((b, i) => setTimeout(() => bossVaincu(b), 700 + i * 300));
    if (pred.monte) { // montée de niveau fêtée tout de suite, sans attendre la réponse du Sheet
      niveauCelebre = pred.monte;
      const cl = classeDe(state);
      if (palierDe(pred.monte, cl) > palierDe(pred.monte - 1, cl)) setTimeout(() => evolution(pred.monte), 350);
      else setTimeout(() => niveauSup(pred.monte, state.titre, false), 350);
    }
  } else { busy.add(nom); render(); }
  envoisEnCours++;
  const appel = () => statut === 'undo' ? api('undoToday', nom)
    : statut === 'hier' ? api('logAction', nom, 'Fait', true) : api('logAction', nom, statut);
  fileEnvois = fileEnvois.then(appel).then(apres => {
    envoisEnCours--; busy.delete(nom);
    const avant = confirme; confirme = apres;
    if (!pred) { // saisie non prédite : retour visuel à l'arrivée
      const dXp = apres.xpTotale - avant.xpTotale, dPv = apres.pv - avant.pv;
      if (dXp > 0) flotter(`+${Math.round(dXp)} XP${dPv > 0 ? ` · +${dPv} PV` : ''}`, 'var(--xp2)');
      else if (dPv < 0) flotter(`${dPv} PV`, 'var(--pv)');
    }
    celebrerChangements(avant, apres);
    if (envoisEnCours === 0) { state = apres; confirme = null; render(); }
  }).catch(e => {
    envoisEnCours--; busy.delete(nom);
    toast('Échec de l\'enregistrement : ' + (e && e.message ? e.message : e));
    // On revient à la vérité du Sheet
    return api('getState').then(s => { if (envoisEnCours === 0) { state = s; confirme = null; } else confirme = s; render(); })
      .catch(() => { if (confirme && envoisEnCours === 0) { state = confirme; confirme = null; render(); } });
  });
}

/** Renomme partout (onglet, Journal, quête épique liée, pauses, décalages) : l'historique suit. */
async function renommer(nom) {
  const nouveau = prompt(`Nouveau nom pour « ${nom} »\n(l'historique, les séries et l'XP suivent la quête)`, nom);
  if (nouveau === null || nouveau.trim() === '' || nouveau.trim() === nom) return;

}

const SEANCES_MOBILES = /^(course|renfo)/i;

  const pris = (h.decalages || []).flatMap(x => [x.de, x.a]);
  return {
    de: jr.filter(d => prevu(h, d) && !pris.includes(d) && !(h.jour.fait && d === today)),
    a: jr.filter(d => !prevu(h, d) && !pris.includes(d))

}
function ouvrirMenu(nom) {

    ${j.de.length && j.a.length ? `<div class="form"><label>Séance prévue le<select id="cjDe">${j.de.map(d => `<option value="${d}">${nomJour(d)}</option>`).join('')}</select></label>

      <button class="btn or plein" data-jour-ok="1" style="margin-top:10px">Déplacer la séance</button>`

document.addEventListener('click', e => {

  }

    if (cible === 'profil' && onglet !== 'profil') ongletPrec = onglet;

document.getElementById('sheetBg').addEventListener('click', fermerMenu);

function actionProfil(b) {
  const a = b.dataset.pr;
  if (b.disabled) return;
  if (a === 'changer-heros') {
    if (distant) { if (confirm('Changer de héros sur ce téléphone ? Il faudra entrer l\'autre clé.')) { try { localStorage.removeItem('cle'); } catch (e) {} cleHeros = ''; state = null; profil = null; profilCharge = false; ecranCle(); } }
    else choisirHerosEcran();
    return;
  }
  if (a === 'profil-retry') { chargerProfil(true); render(); return; }
  if (a === 'cle-mod') { cleRefusee = true; ecranCle('Entre ta clé (elle remplace celle de ce téléphone).'); return; }
  if (a === 'sort') {
    const q = document.getElementById('sortQ').value;
    regler('preparerSort', q).then(ok => ok && toast(`✨ Sort préparé sur « ${q} » : accomplis-la cette semaine pour ×1,5`));
    return;
  }
  if (a === 'restaurer') {
    const q = b.dataset.q;
    if (confirm(`Restauration arcanique : effacer le raté de « ${q} » ? PV rendus et série intacte. (1 fois par mois)`)) regler('utiliserRestauration', q).then(ok => ok && toast('✨ Le raté s\'efface : la magie opère'));

  }
  if (a === 'sauver') {
    b.disabled = true; b.textContent = '💾 Copie en cours…';

    const deb = document.getElementById('vacDeb').value, fin = document.getElementById('vacFin').value;
    if (!deb || !fin) { toast('Choisis une date de départ et de retour'); return; }

  } else if (a === 'vac-now') {
    if (confirm('Mode vacances dès aujourd\'hui : plus aucun raté ni perte de PV, séries gelées. Activer ?')) regler('toggleVacances');
  } else if (a === 'vac-del') {
    const v = (state.reglages.vacances || []).find(x => String(x.index) === b.dataset.i);
    if (v && confirm(v.enCours ? 'Fin des vacances : le suivi reprend dès aujourd\'hui.' : 'Supprimer ces vacances ?')) regler('supprimerVacances', Number(b.dataset.i));
  } else if (a === 'pause') {
    const h = state.habitudes.find(x => x.nom === b.dataset.q);
    if (h && confirm(h.enPause ? `Reprendre « ${h.nom} » dès aujourd'hui ?` : `Mettre « ${h.nom} » en pause ? Plus de raté ni de rappel, série gelée.`)) regler('basculerPause', h.nom);
  } else if (a === 'dec-add') {
    const de = document.getElementById('decDe').value, aa = document.getElementById('decA').value;
    if (de && aa) { toast('Séance décalée ↔️'); regler('decalerSeance', decQuete, de, aa); }
  } else if (a === 'dec-del') {
    regler('annulerDecalage', b.dataset.q, b.dataset.de, b.dataset.a);
  } else if (a === 'rap-test') {
    toast('E-mail de test en cours d\'envoi 📬'); regler('testerRappel');
  } else if (a === 'diff') {
    const v = b.dataset.v;
    if (confirm(`Passer en mode ${v} ? Tu ne pourras plus changer pendant 30 jours.`)) regler('changerDifficulte', v);
  } else if (a === 'devise') {
    const t = prompt('Ta devise personnelle (laisse vide pour l\'effacer) :', (state.reglages && state.reglages.devise) || '');
    if (t !== null) regler('reglerDevise', t);
  }
}

/* ---------- Démarrage ---------- */
function erreurChargement(e) {
  document.getElementById('app').innerHTML = `<div class="loading">Impossible de charger les données.<br>${esc(e.message || e)}</div>`;
}
/* Dernier état connu, gardé sur le téléphone : l'app s'affiche tout de suite, puis se met à jour */
const cleEtat = () => 'etat|' + (herosActif || '');
function memoriserEtat() { try { if (state && (enLigne || distant)) localStorage.setItem(cleEtat(), JSON.stringify(state)); } catch (e) {} }
function lancer() {
  let memo = null;
  try { memo = JSON.parse(localStorage.getItem(cleEtat()) || 'null'); } catch (e) {}
  if (memo && (enLigne || distant)) { state = memo; render(); }
  else document.getElementById('app').innerHTML = '<div class="loading">Chargement de ta feuille de personnage…</div>';
  api('getState').then(s => {
    state = s; premierEtatRecu = true;
    if (s.heros && herosActif !== String(s.heros)) { herosActif = String(s.heros); try { localStorage.setItem('heros', herosActif); } catch (e) {} }
    render(); celebrer(s.nouveauxBonus);
    if (!s.d20 && !d20Vu) setTimeout(ouvrirD20, 350);
    setTimeout(() => prechargerFiches(state || s), 4000); // fiche du compagnon prête avant même d'ouvrir l'onglet
  }).catch(e => {
    // Dernière version déjà affichée : on la garde et on prévient, au lieu d'effacer l'écran
    premierEtatRecu = true;
    if (memo && state) toast('Le Sheet ne répond pas (' + (e && e.message ? e.message : e) + ') : affichage de la dernière version connue.');
    else erreurChargement(e);
  });
}
/** Écran « Qui rejoint la Compagnie ? » (seulement s'il y a plusieurs héros). */

  document.getElementById('app').innerHTML = '<div class="loading">La Compagnie se rassemble…</div>';
  api('getHeros').then(liste => {
    if (liste.length <= 1) { herosActif = liste[0] ? liste[0].nom : ''; lancer(); return; }
    document.getElementById('app').innerHTML = `<div class="choix"><h1>Qui rejoint la Compagnie ?</h1>
      <p>Ce téléphone s'en souviendra. Tu pourras changer depuis ton profil.</p>
      ${liste.map((h, i) => {
        const cl = classeDe({ classe: { nom: h.classe } });
        return `<button data-choix="${esc(h.nom)}">${cl.dessin(palierDe(Number(h.niveau) || 1, cl), 'ch' + i, lookDe(h.look))}
          <div><b>${esc(h.nom)}</b><span>${esc(h.classe || '')}${h.titre ? ' · ' + esc(h.titre) : ''} · niveau ${h.niveau || 1}</span></div></button>`;
      }).join('')}</div>`;
  }).catch(erreurChargement);
}
document.addEventListener('click', e => {

    <p>Entre ta clé de héros (une seule fois : ce téléphone s'en souviendra).</p>
    <input id="cleIn" autocomplete="off" autocapitalize="characters" placeholder="ABC-1234-WXYZ" value="${esc(cleHeros || '')}"
      style="width:100%;max-width:280px;padding:12px;border-radius:12px;border:1px solid #6a5320;background:#1c1726;color:#efe3c8;font:600 18px monospace;text-align:center;letter-spacing:.08em">
    <br><button class="btn or" id="cleGo" style="margin-top:12px;padding:10px 22px">Rejoindre la Compagnie</button>
    <p class="muted" id="cleMsg" style="margin-top:10px">${esc(msg || '')}</p>
    ${state ? '<button class="lien" id="cleRetour" style="margin-top:6px">‹ Revenir à l\'app sans changer</button>' : ''}</div>`;
  const ret = document.getElementById('cleRetour');
  if (ret) ret.onclick = () => { cleRefusee = false; render(); };
  const go = async () => {
    const v = document.getElementById('cleIn').value.replace(/\s+/g, '').toUpperCase();
    if (!v) return;
    const ancienne = cleHeros;
    cleHeros = v;
    document.getElementById('cleMsg').textContent = 'Vérification…';
    try {
      const h = await appelDistant('verifierCle', []);
      try { localStorage.setItem('cle', v); localStorage.setItem('heros', h.nom); } catch (e) {}
      cleRefusee = false; profilErreur = ''; herosActif = h.nom; state = null; profil = null; profilCharge = false; lancer();
    } catch (e) {
      cleHeros = ancienne;
      const m = String((e && e.message) || e);
      document.getElementById('cleMsg').textContent = /inconnue/i.test(m) ? 'Clé inconnue : vérifie-la (format THE-XXXX-XXXX) et réessaie.'
        : 'Le Sheet ne répond pas (' + m + '). Vérifie le déploiement Apps Script, puis réessaie.';
    }
  };
  document.getElementById('cleGo').onclick = go;
  document.getElementById('cleIn').onkeydown = e => { if (e.key === 'Enter') go(); };
}
if (distant) { if (cleHeros) lancer(); else ecranCle(); }
else if (herosActif) lancer(); else choisirHerosEcran();
</script>
</body>
</html>
