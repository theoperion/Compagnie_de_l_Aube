<meta charset="utf-8">

<title>Carnet de quêtes</title>

<style>
/* Layout : une colonne d'application (max 760px). Univers de La Compagnie de l'Aube : nuit violette, or et parchemin.
   Thème sombre assumé (comme le Grimoire), donc pas de variante claire. */
:root{
  --bg:#120d22; --surface:#1f1736; --surface2:#2a1f4a; --sunk:#171030;
  --line:rgba(211,168,74,.24); --line2:#3b2e63;
  --fg:#eee2c7; --muted:#a99bc4; --lav:#c8b6ff;
  --gold:#d3a84a; --gold2:#f0cf7a; --gold-soft:rgba(211,168,74,.14); --ink:#1a1230;
  --en:#b9a2ff; --en-soft:rgba(185,162,255,.14);
  --run:#6bbe79; --run-soft:rgba(107,190,121,.13);
  --str:#e0844f; --str-soft:rgba(224,132,79,.14);
  --ok:#6bbe79; --ok-soft:rgba(107,190,121,.16); --warn:#e8b04b; --warn-soft:rgba(232,176,75,.15); --bad:#e5737a; --bad-soft:rgba(229,115,122,.16);
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --body:"EB Garamond", Garamond, "Times New Roman", serif;
  --r:14px; color-scheme:dark;
}
body{background-color:var(--bg);color:var(--fg);font:18px/1.5 var(--body);
  background-image:radial-gradient(ellipse 130% 38% at 50% -6%, rgba(211,168,74,.20), rgba(185,162,255,.06) 45%, transparent 70%),
    radial-gradient(1px 1px at 18% 22%, rgba(238,226,199,.55), transparent),radial-gradient(1px 1px at 72% 14%, rgba(238,226,199,.45), transparent),
    radial-gradient(1px 1px at 86% 58%, rgba(238,226,199,.35), transparent),radial-gradient(1px 1px at 36% 78%, rgba(238,226,199,.3), transparent),
    radial-gradient(1.5px 1.5px at 56% 44%, rgba(200,182,255,.5), transparent);
  background-repeat:no-repeat,repeat,repeat,repeat,repeat,repeat;background-size:100% 100%,360px 360px,360px 360px,360px 360px,360px 360px,360px 360px;background-attachment:fixed}
html{background:var(--bg)} body{min-height:100vh}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0;font-weight:700}
h1{font-size:1.75rem;letter-spacing:.06em;color:var(--gold);text-shadow:0 0 24px rgba(211,168,74,.35)}
h2{font-size:1.18rem;color:var(--gold);letter-spacing:.03em}
h3{font-size:.98rem;letter-spacing:.03em}
p{margin:0} ul{margin:0;padding-left:1.2em}
.muted{color:var(--muted)} .small{font-size:.88rem}
.mono{font-variant-numeric:lining-nums tabular-nums}
.top{display:grid;justify-items:center;text-align:center;gap:2px;padding-top:6px;position:relative}
.gear{position:absolute;left:0;top:0;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--gold);display:grid;place-items:center;cursor:pointer}
.gear:hover{border-color:var(--gold)} .gear[aria-pressed="true"]{background:var(--gold-soft)}
.okc2{color:var(--ok)}
.sigil{font-size:1.4rem;color:var(--gold);line-height:1}
.sub{font-family:var(--display);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lav)}
.motto{font-style:italic;color:var(--muted)}
.orn{color:var(--gold);opacity:.55;letter-spacing:.15em;font-size:.8rem;white-space:nowrap;overflow:hidden;max-width:100%}
.sync{font-size:.78rem;color:var(--muted)}
.quests{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.quest{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.quest:hover{border-color:var(--gold)}
.quest:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.flash:focus-visible,summary:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.quest .k{font-family:var(--display);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.quest.en .k{color:var(--en)} .quest.run .k{color:var(--run)} .quest.str .k{color:var(--str)}
.quest .big{font-family:var(--display);font-size:1.05rem;font-weight:700;color:var(--fg)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:600;border:1px solid transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neutral{background:transparent;color:var(--muted);border-color:var(--line2)}
.dots{display:flex;gap:6px}
.dot{width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:.75rem;color:var(--muted)}
.dot.on{background:var(--run);border-color:var(--run);color:var(--ink);font-weight:700}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;width:max-content;max-width:100%;overflow-x:auto;border:1px solid var(--line2);justify-self:center}
.tab{border:0;background:transparent;color:var(--muted);font:700 .78rem var(--display);letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface2);color:var(--gold);box-shadow:inset 0 0 0 1px var(--line)}
.panel{display:grid;gap:16px;min-width:0}
.card{background:linear-gradient(180deg,#241a40,var(--surface));border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.25)}
.btn{border:1px solid var(--line2);background:var(--surface2);color:var(--fg);font:600 .95rem var(--body);padding:8px 16px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold);color:var(--ink);font:700 .8rem var(--display);letter-spacing:.08em;text-transform:uppercase;padding:11px 18px;box-shadow:0 0 18px rgba(211,168,74,.25)}
.btn.primary.run{background:linear-gradient(180deg,#9adca5,var(--run));border-color:var(--run);box-shadow:none}
.btn.primary.str{background:linear-gradient(180deg,#f3a77a,var(--str));border-color:var(--str);box-shadow:none}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:5px 11px;font-size:.88rem}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mod{border:1px solid var(--line2);background:var(--sunk);color:var(--fg);border-radius:var(--r);padding:12px;text-align:left;font:inherit;cursor:pointer;display:grid;gap:2px;min-width:0}
.mod b{font-family:var(--display);font-size:.92rem;letter-spacing:.03em}
.mod[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.mod[aria-pressed="true"] b{color:var(--gold)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step{border:1px solid var(--line2);border-radius:8px;padding:6px;font:700 .7rem var(--display);letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--muted);text-align:center}
.step.cur{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.step.done{background:var(--gold-soft);color:var(--gold);border-color:var(--line)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;flex:1;min-width:80px;border:1px solid var(--line2)}
.bar>i{display:block;height:100%;background:var(--en);width:0;transition:width .4s}
.bar.gold>i{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.bar.str>i{background:var(--str)}
.bar>i.indet{width:40%;animation:indet 1.4s ease-in-out infinite;background:var(--gold)}
@keyframes indet{0%{margin-left:-40%}100%{margin-left:100%}}
.flash{border:1px solid var(--line);border-radius:var(--r);padding:24px 16px;text-align:center;display:grid;gap:8px;justify-items:center;background:radial-gradient(ellipse at top,rgba(211,168,74,.08),transparent 70%),var(--sunk)}
.flash .w{font-family:var(--display);font-size:1.6rem;font-weight:700;color:var(--gold2)}
.flash .fr{font-size:1.25rem}
.okc{color:var(--ok)} .badc2{color:var(--bad)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:6px 0;border-bottom:1px solid var(--line2)}
.dl .spk{font-weight:700;color:var(--en);margin-right:4px}
details{border-top:1px solid var(--line2);padding-top:10px}
details.card{border-top:1px solid var(--line)}
summary{cursor:pointer;font-family:var(--display);font-size:.85rem;letter-spacing:.05em;color:var(--lav)}
textarea,input,select{font:inherit;color:var(--fg);background:var(--sunk);border:1px solid var(--line2);border-radius:10px;padding:10px;width:100%;box-sizing:border-box}
textarea{min-height:90px;resize:vertical}
input::placeholder,textarea::placeholder{color:#7d7099}
label{font-weight:600;font-size:.92rem;display:grid;gap:4px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.gap{display:grid;gap:8px}
.err{background:var(--bad-soft);border-radius:8px;padding:8px 10px}
.err s{color:var(--bad)} .err b{color:var(--ok)}
.miss{color:var(--bad);text-decoration:underline wavy;font-weight:700}
.note{background:var(--warn-soft);border:1px solid rgba(232,176,75,.3);border-radius:10px;padding:10px 12px;font-size:.92rem}
.chat{display:grid;gap:8px}
.bub{max-width:85%;padding:9px 12px;border-radius:14px;white-space:pre-wrap}
.bub.a{background:var(--sunk);border:1px solid var(--line2);justify-self:start;border-bottom-left-radius:4px}
.bub.u{background:var(--en-soft);border:1px solid rgba(185,162,255,.35);justify-self:end;border-bottom-right-radius:4px}
.week{border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);overflow:hidden;padding:0}
.week>summary,.week>header{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 14px;background:var(--sunk);flex-wrap:wrap;color:var(--fg);list-style:none}
.week>summary::-webkit-details-marker{display:none}
.week[open]>summary{border-bottom:1px solid var(--line2)}
.week.cur{border-color:var(--run)} .week.cur>summary{background:var(--run-soft)}
.sess{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;border-top:1px solid var(--line2)}
.sess:first-of-type{border-top:0}
.sess.today{background:var(--run-soft)}
.sess .tag{font-family:var(--display);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--run)}
.sess.strrow .tag{color:var(--str)}
.sess .detail{min-width:0;display:grid;gap:2px}
.check{width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);background:var(--sunk);cursor:pointer;display:grid;place-items:center;color:var(--ink);font-weight:700}
.check.on{background:var(--ok);border-color:var(--ok)}
.paces{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.pace{background:var(--sunk);border:1px solid var(--line2);border-radius:10px;padding:10px}
.pace b{display:block;font-family:var(--display);font-size:1.05rem;color:var(--gold2)}
.hist{display:grid;gap:6px}
.hist div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line2);padding-bottom:6px}
.stream{white-space:pre-wrap}
.story{font-style:italic;color:var(--lav)}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ex{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:12px;display:grid;gap:6px;align-content:start;min-width:0}
.ex b{font-family:var(--display);font-size:.9rem}
.figbox{background:radial-gradient(ellipse at 50% 120%,var(--str-soft),transparent 70%),var(--sunk);border-radius:10px;border:1px solid var(--line2)}
.fig{width:100%;height:auto;display:block}
.fig polyline,.fig line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .gnd{stroke:var(--line2);stroke-width:2}
.fig .far{stroke:var(--muted);stroke-width:6;opacity:.5}
.fig .torso{stroke:var(--fg);stroke-width:8}
.fig .near{stroke:var(--str);stroke-width:7}
.fig .head{fill:var(--fg)}
.player{display:grid;gap:12px;background:linear-gradient(180deg,#241a40,var(--surface));border:1px solid var(--str);border-radius:var(--r);padding:16px}
.player .phase{font-family:var(--display);font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.player .phase.work{color:var(--str)} .player .phase.rest{color:var(--muted)}
.player .count{font-family:var(--display);font-size:3.2rem;line-height:1;color:var(--gold2)}
.player .bigfig{max-width:440px;width:100%;justify-self:center}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl td,.tbl th{padding:7px 8px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
.tbl th{font-family:var(--display);font-size:.7rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.tbl tr.cur td{background:var(--str-soft)}
.hero .xp,.hud .xp{font-family:var(--display);font-size:1.4rem;font-weight:700;color:var(--gold2)}
.hud .xp.sm{font-size:1.05rem}
.game{border-color:var(--gold)}
.kicker{font-family:var(--display);font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.playrow{display:flex;gap:14px;align-items:center}
.play{width:64px;height:64px;flex:none;border-radius:50%;border:1px solid var(--gold2);background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold) 60%,#9c7a2c);color:var(--ink);font-size:1.5rem;cursor:pointer;box-shadow:0 0 22px rgba(211,168,74,.35)}
.play:active{transform:scale(.96)}
.choices{display:grid;gap:8px}
.choice{text-align:left;border:1px solid var(--line2);background:var(--sunk);color:var(--fg);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--gold)}
.choice.good{border-color:var(--ok);background:var(--ok-soft)} .choice.badc{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.verdict{border-radius:10px;padding:10px 12px;font-weight:700;animation:pop .3s}
.verdict.perfect{background:var(--ok-soft);color:var(--ok)} .verdict.ok{background:var(--warn-soft);color:var(--warn)} .verdict.bad{background:var(--bad-soft);color:var(--bad)}
.transcript{background:var(--sunk);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.big-fr{font-family:var(--display);font-size:1.2rem;font-weight:700;margin:0;color:var(--gold2)}
.mic{display:flex;gap:8px;align-items:center;color:var(--muted)}
.combo{background:var(--gold-soft);color:var(--gold2);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:700;font-size:.85rem;animation:pop .35s}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.hearts{color:var(--bad);font-size:1.3rem;letter-spacing:3px} .hearts .lost,.stars .lost{opacity:.3}
.stars{font-size:2.6rem;color:var(--gold2);letter-spacing:6px;line-height:1;text-shadow:0 0 18px rgba(211,168,74,.5)}
.starline{color:var(--gold);letter-spacing:1px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badge{display:grid;gap:3px;justify-items:center;text-align:center;padding:10px 8px;border-radius:10px;background:var(--sunk);border:1px solid var(--line2);opacity:.5}
.badge b{font-family:var(--display);font-size:.78rem}
.badge.on{opacity:1;border-color:var(--gold);background:var(--gold-soft)}
.medal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted);font-family:var(--display);font-weight:700;border:1px solid var(--line2)}
.badge.on .medal{background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold));color:var(--ink);border-color:var(--gold2)}
.boss{border-color:var(--bad)}
.bnote{justify-self:end;max-width:85%;color:var(--muted)} .bnote.bad{color:var(--bad)}
.foe{display:grid;gap:6px;background:var(--sunk);border:1px solid var(--line2);border-radius:12px;padding:10px 12px}
.foe-name{font-family:var(--display);font-size:.85rem;letter-spacing:.04em;color:var(--bad)}
.hp{height:10px;background:#120c20;border-radius:99px;overflow:hidden;border:1px solid var(--line2)}
.hp>i{display:block;height:100%;background:linear-gradient(90deg,#9e3640,var(--bad));transition:width .5s}
.epic{display:grid;gap:5px}
.epic b{font-family:var(--display);font-size:.85rem;color:var(--gold)}
.gauge{height:8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line2);overflow:hidden}
.gauge.thin{height:4px}
.gauge>i{display:block;height:100%}
.g-done{background:linear-gradient(90deg,var(--gold),var(--gold2))} .g-time{background:var(--bad);opacity:.7}
.d20card{display:flex;gap:16px;align-items:center}
.d20{width:76px;height:84px;flex:none;display:grid;place-items:center;background:linear-gradient(160deg,var(--surface2),var(--sunk));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font-family:var(--display);font-size:1.8rem;font-weight:700;color:var(--gold2)}
.d20.idle{color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grade{display:grid;gap:2px;justify-items:center;border:1px solid var(--line2);background:var(--sunk);color:var(--fg);border-radius:10px;padding:8px 4px;font:inherit;cursor:pointer}
.grade b{font-family:var(--display);font-size:.72rem;letter-spacing:.04em}
.grade.bad b{color:var(--bad)} .grade.warn b{color:var(--warn)} .grade.ok b{color:var(--ok)} .grade.gold b{color:var(--gold2)}
.grade:hover{border-color:var(--gold)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.slot{border:1px dashed var(--line2);border-radius:10px;padding:8px;text-align:center;font-size:.85rem;color:#7d7099}
.slot.on{border:1px solid var(--gold);color:var(--gold2);background:var(--gold-soft)}
.mapwrap{background:radial-gradient(ellipse at 50% 0,rgba(107,190,121,.08),transparent 70%),var(--sunk);border:1px solid var(--line2);border-radius:12px;padding:6px}
.map{width:100%;height:auto;display:block}
.map text{font-family:var(--display);font-size:9px;letter-spacing:.06em;fill:var(--muted)}
.map .route{fill:none;stroke:var(--line2);stroke-width:2;stroke-dasharray:4 4}
.map .walked{fill:none;stroke:var(--gold);stroke-width:2.5}
.map .n{fill:var(--sunk);stroke:var(--line2);stroke-width:1.5}
.map .n.q{stroke:var(--bad)}
.map .n.done{fill:var(--gold);stroke:var(--gold2)}
.map .n.today{stroke:var(--run);stroke-width:3}
.map .final{fill:var(--sunk);stroke:var(--gold2);stroke-width:2}
.map .final.done{fill:var(--gold2)}
.map .me{fill:var(--run);filter:drop-shadow(0 0 4px var(--run))}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;z-index:50;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--surface2);color:var(--fg);border:1px solid var(--gold);padding:10px 14px;border-radius:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.45);animation:pop .3s}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.confetti i{position:absolute;top:-12px;width:7px;height:11px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{top:105%;transform:rotate(600deg);opacity:.7}}
@media (max-width:520px){.steps{grid-template-columns:repeat(2,1fr)} h1{font-size:1.45rem} .mods{grid-template-columns:1fr} .grades{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* ======================================================================
   PONT VERS GOOGLE APPS SCRIPT
   Remplace les fonctions de claude.ai : l'IA passe par l'API Claude (Code.gs)
   et la sauvegarde va dans l'onglet caché de ta Google Sheet.
   APP_K : code d'accès injecté par doGet, renvoyé à chaque appel serveur.
   ====================================================================== */
function toParent(msg){try{if(window.parent!==window)window.parent.postMessage(msg,"*")}catch(e){}}
window.addEventListener("error",e=>toParent({t:"compagnie-erreur",msg:String(e.message||""),detail:String(e.filename||"").split("/").pop()+":"+e.lineno+":"+e.colno}));
window.addEventListener("unhandledrejection",e=>{const r=e.reason;toParent({t:"compagnie-erreur",msg:"promesse : "+String((r&&(r.message||r.code))||r),detail:String((r&&r.stack)||"").split("\n")[1]||""})});
(function(){
  /* Pont vers La Compagnie de l'Aube : même API (Apps Script de la Compagnie), même clé de héros.
     La clé et l'adresse sont celles de l'app Compagnie (même site GitHub). */
  const API=window.API_URL||"";
  const cle=()=>{try{return localStorage.getItem("cle")||""}catch(e){return ""}};
  const NOMS={intervals:"carnetIntervals",askClaude:"carnetClaude",loadState:"carnetCharger",saveState:"carnetSauver",getConfig:"carnetConfig",setConfig:"carnetReglages",testClaude:"carnetTest"};
  async function run(fn,...args){
    let j;
    for(let essai=0;;essai++){
      const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:NOMS[fn]||fn,args,cle:cle()})});
      const brut=await r.text();
      try{j=JSON.parse(brut)}catch(e){throw new Error("Réponse inattendue de Google ("+r.status+")")}
      if(!j.ok&&/^OCCUPE/.test(j.message||"")&&essai<3){await new Promise(ok=>setTimeout(ok,1500*(essai+1)));continue}
      break;
    }
    if(!j.ok) throw new Error(j.message||"Erreur");
    if(fn==="saveState"&&j.data&&j.data.valides&&j.data.valides.length) toParent({t:"compagnie-etat",etat:j.data.etat,valides:j.data.valides});
    return j.data;
  }
  function toErr(e){const m=String((e&&e.message)||e);
    const code=/NO_KEY/.test(m)?"no_key":/KEY_REFUSED|API 401/.test(m)?"bad_key":/API (429|529)|overloaded|rate/i.test(m)?"rate_limited":/Timeout|timed out|délai/i.test(m)?"timeout":"upstream_error";
    return {code,message:m}}
  async function sample(input,opts={}){
    if(opts.signal&&opts.signal.aborted) throw {code:"cancelled"};
    const messages=typeof input==="string"?[{role:"user",content:input}]:input;
    const tier=opts.modelTier||"default";
    let text;
    try{text=await run("askClaude",JSON.stringify({messages,tier,maxTokens:tier==="quick"?700:4000}))}catch(e){throw toErr(e)}
    if(opts.signal&&opts.signal.aborted) throw {code:"cancelled"};
    if(opts.onText) opts.onText({text,delta:text});
    return {text,truncated:false};
  }
  sample.json=async(input,opts={})=>{const {text}=await sample(input,opts);const a=text.indexOf("{"),b=text.lastIndexOf("}");
    if(a<0||b<a) throw {code:"invalid_json",message:"Réponse illisible"};
    try{return JSON.parse(text.slice(a,b+1))}catch(e){throw {code:"invalid_json",message:"Réponse illisible"}}};
  const db={doc:()=>({
    get:async()=>{let j=await run("loadState");
      if(j&&typeof j==="object"){try{window.majVacances&&window.majVacances(j.vacances||[])}catch(e){}j=j.json}
      return {exists:!!j,data:()=>j?{json:j}:undefined}},
    set:async(d)=>{await run("saveState",d.json)}})};
  const user={id:async()=>"moi",isOwner:()=>true,canEdit:()=>true};
  window.srv=run;
  window.claude={use:async n=>n==="sample"?sample:n==="db"?db:n==="user"?user:null};
})();
</script>

const todayISO = () => isoDate(new Date());
function isoDate(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return isoDate(d)}
function daysBetween(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000)}
function nextMonday(){const d=new Date();const k=(8-d.getDay())%7||7;d.setDate(d.getDate()+k);return isoDate(d)}
function mondayOf(iso){const d=new Date(iso+"T12:00:00");const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return isoDate(d)}
const frDate = iso => new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});

    run:{goal:"42:00", ref:"43:55", start:nextMonday(), weeks:12, logs:{}, days:{q:2,s:0,l:5}},
    str:{logs:{}}};
}
function migrate(s){
  const d=defaultState(); if(!s||typeof s!=="object") return d;
  const en=s.en||{};
  if(!en.mods){en.mods={travail:{unit:en.unit||0,lesson:en.lesson||null}};delete en.unit;delete en.lesson;(en.sessions||[]).forEach(x=>x.mod=x.mod||"travail")}
  for(const k in d.en.mods) en.mods[k]=Object.assign({},d.en.mods[k],en.mods[k]||{});
  s.en=Object.assign({},d.en,en);
  s.en.deck.forEach(cardInit); s.en.oubli=s.en.oubli||d.en.oubli; s.en.newLog=s.en.newLog||d.en.newLog;
  s.en.deck.forEach(c=>{if(!c.lvl&&/^s\d+$/.test(c.id))c.lvl=NIVEAUX_DEPART[c.en]||"A2"});
  if(!s.en.avances){AVANCES.forEach(([en,fr,ex,lvl],i)=>{if(!s.en.deck.some(c=>norm(c.en)===norm(en)))s.en.deck.push(cardInit({id:"a"+i,en,fr,ex,lvl,due:todayISO()}))});s.en.avances=1}
  s.en.game=Object.assign({},d.en.game,en.game||{}); s.en.game.stats=Object.assign({},d.en.game.stats,(en.game||{}).stats||{});
  s.run=Object.assign({},d.run,s.run||{}); s.run.days=Object.assign({},d.run.days,s.run.days||{});
  s.str=Object.assign({},d.str,s.str||{});
  if(s.ttsRate==null) s.ttsRate=0.85; s.v=2; return s;
}

}

/* ---------- Voix (synthèse vocale du téléphone / navigateur) ---------- */
const hasTTS=()=>"speechSynthesis" in window;
function enVoices(){try{const v=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));return [...v.filter(x=>/GB/i.test(x.lang)),...v.filter(x=>/US/i.test(x.lang)),...v.filter(x=>!/GB|US/i.test(x.lang))]}catch(e){return[]}}
function utter(text,o={}){const u=new SpeechSynthesisUtterance(text);if(o.voice){u.voice=o.voice;u.lang=o.voice.lang}else u.lang=o.lang||"en-GB";u.rate=o.rate??Number(state.ttsRate);u.pitch=o.pitch??1;return u}
function speak(text,rate){if(!hasTTS())return false;try{speechSynthesis.cancel();speechSynthesis.speak(utter(text,{rate,voice:enVoices()[0]}));return true}catch(e){return false}}
function voiceMap(lines){const vs=enVoices();const spk=[...new Set(lines.map(l=>l.speaker))];const m={};spk.forEach((s,i)=>{m[s]=vs.length>1?{voice:vs[i%vs.length],pitch:1}:{voice:vs[0],pitch:i%2?1.2:0.85}});return m}
function speakDialogue(lines,rate,only){if(!hasTTS())return false;try{speechSynthesis.cancel();const m=voiceMap(lines);(only==null?lines:[lines[only]]).forEach(l=>speechSynthesis.speak(utter(l.line,{rate,...m[l.speaker]})));return true}catch(e){return false}}
function speakFr(text){if(!hasTTS())return;try{speechSynthesis.cancel();const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));speechSynthesis.speak(utter(text,{voice:v,lang:"fr-FR",rate:1}))}catch(e){}}
const stopTTS=()=>{try{speechSynthesis.cancel()}catch(e){}};

/* ---------- Mémoire des mots : répétition espacée (principe de FSRS, simplifié) ----------
   Chaque mot a une « stabilité » en jours : le délai au bout duquel tu as environ 90 % de chances de t'en souvenir.
   Bien ou Facile : la stabilité grandit (d'autant plus que le mot était presque oublié). Raté : elle chute, le mot revient demain.
   Les cartes alternent trois façons de le retrouver : à l'oreille, en le disant en anglais, en le reconnaissant. */
const NEW_PER_DAY=8;                 // nouveaux mots par jour, au maximum
const INIT_STAB=[0.4,1.5,3,7];        // première révision selon ta note : Raté, Difficile, Bien, Facile (jours)
const GRADES=[["Raté","bad"],["Difficile","warn"],["Bien","ok"],["Facile","gold"]];
function cardInit(c){
  if(c.reps==null){const map=[0,1,3,7,14,30,60];const b=c.box||0;c.reps=b;c.stab=b?map[b]:null;c.diff=5;c.lapses=0;c.due=c.due||todayISO();c.last=b?addDays(c.due,-map[b]):null;delete c.box}
  return c;
}
const isNew=c=>!c.reps;
function retention(c){if(isNew(c)||!c.last)return 0;const t=Math.max(0,daysBetween(c.last,todayISO()));return Math.pow(1+t/(9*c.stab),-1)}
function nextState(c,g){const n={...c};
  if(isNew(n)){n.stab=INIT_STAB[g];n.diff=Math.min(10,Math.max(1,5+(1.5-g)*1.3))}
  else if(g===0){n.lapses=(n.lapses||0)+1;n.stab=Math.max(.4,n.stab*.3);n.diff=Math.min(10,n.diff+1.5)}
  else{const R=retention(n);n.diff=Math.min(10,Math.max(1,n.diff+[0,.6,-.1,-.8][g]));n.stab=Math.max(n.stab+.5,n.stab*(1+(11-n.diff)*.22*[0,.55,1,1.45][g]*(1.6-.6*R)))}
  n.ivl=g===0?1:Math.max(1,Math.round(n.stab));return n}
/* Mot coriace : raté 4 fois, il devient un mini-boss. Retrouvé 3 révisions de suite = vaincu (+30 XP). */
function coriacesHTML(){const L=state.en.deck.filter(c=>(c.lapses||0)>=4&&!c.vaincu);if(!L.length)return"";
  return `<div class="foe"><div class="row" style="justify-content:space-between"><b class="foe-name">Mots coriaces</b><span class="small mono">${L.length}</span></div>
  <div class="small">${L.slice(0,6).map(c=>`<span class="pill bad" style="margin:2px">${esc(c.en)} · ${c.suite||0}/3</span>`).join("")}</div>
  <span class="small muted">Retrouve un mot coriace 3 révisions de suite pour l'abattre (+30 XP).</span></div>`}
function schedule(c,g){
  if((c.lapses||0)>=4&&!c.vaincu){c.suite=g>=2?(c.suite||0)+1:0;
    if(c.suite>=3){c.vaincu=true;setTimeout(()=>{addXP(30,"ear");sfx("level");toast(`Mot coriace abattu : « ${c.en} » (+30 XP)`)},200)}}
  const n=nextState(c,g);
  Object.assign(c,{stab:n.stab,diff:n.diff,lapses:n.lapses||0,reps:(c.reps||0)+1,last:todayISO(),due:addDays(todayISO(),g===0?1:Math.max(1,Math.round(n.stab*(.95+Math.random()*.1))))})}
const ivlLabel=d=>d<30?`${d} j`:d<365?`${Math.round(d/30)} mois`:`${(d/365).toFixed(1).replace(".",",")} an`;
function newToday(){const L=state.en.newLog;return L.date===todayISO()?L.n:0}
function srsQueue(){const t=todayISO();
  const due=state.en.deck.filter(c=>!isNew(c)&&c.due<=t).sort((a,b)=>retention(a)-retention(b));
  const fresh=state.en.deck.filter(isNew).sort((a,b)=>(NIV_RANG[b.lvl]||0)-(NIV_RANG[a.lvl]||0)).slice(0,Math.max(0,NEW_PER_DAY-newToday()));
  return [...due.slice(0,30),...fresh]}
const maitriseAvance=c=>motAvance(c)&&!isNew(c)&&c.stab>=21;
const PALIERS_LEXIQUE=[25,50,100];
function prochainPalier(n){for(const p of PALIERS_LEXIQUE)if(n<p)return p;return Math.floor(n/100)*100+100}
function deckStats(){const d=state.en.deck;return {avances:d.filter(maitriseAvance).length,mast:d.filter(c=>!isNew(c)&&c.stab>=21).length,learn:d.filter(c=>!isNew(c)&&c.stab<21).length,fresh:d.filter(isNew).length,leech:d.filter(c=>(c.lapses||0)>=4).length}}
function hitOubli(g){const O=state.en.oubli;O.hp=Math.min(O.max,O.hp-[-2,1,2,3][g]);
  if(O.hp<=0){O.kills++;O.rank++;O.max=150+100*(O.rank-1);O.hp=O.max;addXP(50,"ear");setTimeout(()=>{sfx("level");toast(`L'Oubli recule ! Trophée : Plume de mémoire (${O.kills})`);confetti()},300)}}

function startReview(){const q=srsQueue();if(!q.length)return;ses={kind:"vocab",queue:q.map(c=>c.id),idx:0,step:"ask",ok:0,n:0,failed:{},startedAt:Date.now()};renderEn()}
function cardMode(c){return isNew(c)?"new":["ecoute","prod","reco"][(c.reps||0)%3]}

  else face=`<span class="w">${esc(c.en)}</span>${shown?`<span class="fr">${esc(c.fr)}</span>${exl}`:'<span class="small muted">Que veut dire ce mot ?</span>'}`;
  const grades=GRADES.map(([g,cls],k)=>`<button class="grade ${cls}" data-g="${k}"><b>${g}</b><span class="small muted">${ivlLabel(nextState(c,k).ivl)}</span></button>`).join("");
  p.innerHTML=`<div class="card game">
    <div class="row" style="justify-content:space-between"><span class="kicker">Mémoire · ${ses.idx+1}/${ses.queue.length} · ${lab}</span>${(c.lapses||0)>=4&&!c.vaincu?`<span class="pill bad">mot coriace · ${c.suite||0}/3</span>`:""}${c.lvl&&motAvance(c)?`<span class="pill neutral">${c.lvl}</span>`:""}</div>
    ${oubliHTML()}
    <div class="flash">${face}</div>
    ${shown?`<div class="row"><button class="btn sm" id="say">▶ Écouter</button>${c.ex?'<button class="btn sm" id="sayex">▶ L\'exemple</button>':""}</div>
      <p class="small muted">${mode==="new"?"Répète-le à voix haute, puis dis s'il te paraît facile à retenir.":"Sois honnête : ta note règle la prochaine révision (délai sous chaque bouton)."}</p><div class="grades">${grades}</div>`
      :`<div class="row">${mode==="prod"?'<button class="btn primary" id="chk">Vérifier</button>':`<button class="btn primary" id="rv">${mode==="new"?"Voir la traduction":"Révéler"}</button>`}${mode==="new"?'<button class="btn sm" id="say">▶ Écouter</button>':""}</div>`}
    <div class="row"><button class="btn sm" id="quitR">Quitter</button></div>

  const chk=()=>{const v=$("#prodIn").value.trim();const r=diffHTML(c.en,v);ses.check={ok:norm(v)===norm(c.en)||r.score>=85,said:v||"(rien)"};reveal()};
  $("#chk")?.addEventListener("click",chk);

  $("#sayex")?.addEventListener("click",()=>speak(c.ex,earRate()));
  p.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const g=+b.dataset.g;
    if(isNew(c)){const L=state.en.newLog;if(L.date!==todayISO()){L.date=todayISO();L.n=0}L.n++}
    schedule(c,g);hitOubli(g);ses.n++;
    if(g===0){sfx("bad");if(!ses.failed[c.id]){ses.failed[c.id]=1;ses.queue.push(c.id)}}
    else{ses.ok++;addXP(g===1?2:3,"ear");sfx(g===3?"perfect":"ok")}
    ses.idx++;ses.step="ask";ses.mode=null;ses.check=null;save();renderEn()});
}

function packPrompt(mod){
  const M=state.en.mods[mod], u=modUnit(mod);
  const errs=state.en.errors.slice(-8).map(e=>`"${e.faux}" → "${e.correct}"`).join("; ")||"aucune pour l'instant";
  const words=state.en.deck.filter(c=>(c.stab||0)<3).slice(0,10).map(c=>c.en).join(", ")||"aucun";
  return `Tu crées une mission de jeu pour faire aimer l'anglais ORAL à un ingénieur de recherche français, niveau A2 qui vise B1. Ses priorités : parler (faire des phrases) et comprendre à l'oral.
Monde : ${WORLD[mod]}.
Chapitre ${M.unit+1} : « ${u[0]} ». Structure à placer à l'oral : « ${u[1]} ».
Difficulté écoute ${diffOf(earLvl())}/10 et difficulté expression ${diffOf(spkLvl())}/10 (1 = A2 simple et lent ; 10 = B1+ rapide, idiomatique). Vise un niveau un peu au-dessus de son confort : il doit réussir environ 70 % des défis.
Ses erreurs récentes, à faire retravailler discrètement : ${errs}.
Mots qu'il apprend, à réutiliser si possible : ${words}.
Ton : vivant, situations concrètes, un peu d'humour. Il joue Theron Corvane, mage de la Compagnie de l'Aube (univers fantasy) : le titre et le briefing en français peuvent y faire un clin d'œil, mais les situations, le boss et l'anglais restent modernes, réalistes et utiles.
Réponds UNIQUEMENT avec un objet JSON valide :
{"title":"nom de mission accrocheur en anglais",
 "brief":"briefing de mission en français, 1 ou 2 phrases, ton de jeu",
 "tip":{"point":"la structure","explication":"3 lignes max en français, très concrètes","exemple":"1 phrase anglaise"},
 "listen":[
   {"type":"qcm","audio":[{"speaker":"prénom","line":"réplique anglaise"}] (1 à 3 répliques),"question":"question en français sur le sens ou un détail précis","choices":["4 propositions en français, toutes plausibles"],"answer":index de la bonne réponse 0-3},
   … 3 éléments "qcm" de difficulté croissante, puis
   {"type":"dictee","audio":"phrase anglaise de 6 à 14 mots selon la difficulté"} … 3 éléments "dictee"
 ],
 "speak":[
   {"type":"dis","fr":"phrase française naturelle à dire en anglais, qui utilise la structure","ref":"traduction anglaise de référence"} … 3 éléments,
   {"type":"repond","audio":"question en anglais posée à l'oral, liée au thème, appelant une réponse personnelle"} … 2 éléments,
   {"type":"repete","audio":"phrase anglaise naturelle avec des sons difficiles pour un francophone (th, h aspiré, voyelles longues)"} … 1 élément
 ],
 "boss":{"role":"personnage en anglais","situation":"situation en français, dramatisée et fun","objectif":"ce qu'il doit obtenir, précis et vérifiable","opening":"première réplique du personnage, en anglais"},
 "vocab":[{"en":"mot ou expression utile du thème, de niveau B2 ou C1 (jamais de mot transparent ou de base : pas de sample, data, to increase)","fr":"traduction","ex":"courte phrase anglaise d'exemple","lvl":"B2 ou C1"}] (5 éléments)}`;
}
let packJobs={};
function getPack(mod){
  const M=state.en.mods[mod];
  if(M.pack&&M.pack.unit===M.unit) return Promise.resolve(M.pack);
  if(!sample) return Promise.reject({code:"absent"});
  if(packJobs[mod]) return packJobs[mod];
  const unit=M.unit;
  packJobs[mod]=sample.json(packPrompt(mod),{modelTier:"default",cache:false}).then(out=>{
    if(!out||!Array.isArray(out.listen)||!Array.isArray(out.speak)||!out.boss) throw {code:"upstream_error"};
    out.unit=unit; state.en.mods[mod].pack=out; save(); return out;
  }).finally(()=>{delete packJobs[mod]});
  return packJobs[mod];
}
function interleave(list,pattern){const pool=[...(list||[])],out=[];pattern.forEach(t=>{const k=pool.findIndex(x=>x.type===t);if(k>=0)out.push(pool.splice(k,1)[0])});return out.concat(pool)}
const audioText=x=>Array.isArray(x.audio)?x.audio.map(l=>l.line).join(" "):String(x.audio||"");

/* ---------- Déroulé de la mission ---------- */
function startMission(){
  ses={kind:"mission",mod:state.en.active,startedAt:Date.now(),round:0,i:0,it:{},m:{xp:0,combo:0,ok:0,total:0,jokers:0,errors:[],newBadges:[]}};
  sfx("ok"); clearInterval(tick); tick=setInterval(updTimer,1000); renderEn(); loadPack();
}
function loadPack(){
  const b=$("#stepBody"); const mod=ses.mod;
  b.innerHTML=`<div class="card game"><span class="kicker">Préparation</span><h3>Claude prépare ta mission…</h3><p class="muted">Souvent 20 à 60 secondes. Pendant ce temps, vérifie que le son est monté et que ton clavier a bien le micro en anglais.</p><div class="bar"><i class="indet"></i></div></div>`;
  getPack(mod).then(P=>{if(!ses||ses.kind!=="mission"||ses.mod!==mod)return;
    ses.pack=P; ses.L=interleave(P.listen,["qcm","dictee","qcm","dictee","qcm","dictee"]); ses.S=interleave(P.speak,["dis","repond","dis","repete","dis","repond"]); renderEn();
  }).catch(e=>{if(!ses)return;b.innerHTML=`<div class="card"><p class="err">${esc(sampleErr(e.code))}</p><button class="btn" id="rt">Réessayer</button></div>`;$("#rt").onclick=loadPack});

function playAudio(x,slow){
  const it=ses.it; it.plays=(it.plays||0)+1;
  if(slow) spend(5,"ralentir"); else if(it.plays>2) spend(2,"réécoute");
  const rate=slow?Math.max(.6,earRate()-.25):earRate();
  const ok=Array.isArray(x.audio)?speakDialogue(x.audio,rate):speak(String(x.audio),rate);
  if(!ok) toast("Audio indisponible dans ce navigateur");
}
function autoPlay(){
  if(ses.round===1) playAudio(ses.L[ses.i]);
  else if(ses.round===2&&ses.S[ses.i].type!=="dis") playAudio(ses.S[ses.i]);
  else if(ses.round===3&&!ses.boss.started){ses.boss.started=true;speak(ses.boss.turns[0].content,earRate())}
}
function advance(){
  stopTTS(); ses.it={}; ses.i++;
  const list=ses.round===1?ses.L:ses.S;
  if(ses.round===0||ses.round===3||ses.i>=list.length){ses.round++;ses.i=0}
  if(ses.round===2&&!ses.S.length) ses.round=3;
  if(ses.round===3&&!ses.boss) ses.boss={hearts:3,turns:[{role:"assistant",content:ses.pack.boss.opening}],notes:{},show:false,over:null,started:false};
  if(ses.round<=3) autoPlay();
  renderEn(); window.scrollTo({top:0,behavior:"smooth"});
}

      ${ses.d20?`<span class="pill neutral">d20 : ${ses.d20} · ×${String(ses.d20m).replace(".",",")}</span>`:""}

  </div>

  updTimer();

async function judge(x,ans){
  const base=`Jeu d'expression orale en anglais pour un francophone (niveau A2 qui vise B1). Sa réponse vient de la dictée vocale du téléphone : ignore ponctuation et majuscules ; si la dictée a écrit un autre mot que celui attendu, considère qu'il l'a mal prononcé et signale-le.`;

function diffHTML(expected,typed){
  const ex=String(expected).split(/\s+/), ty=norm(typed).split(" "); let j=0, ok=0;
  const html=ex.map(w=>{const n=norm(w);if(!n)return esc(w);const k=ty.indexOf(n,j);if(k>=0&&k-j<=3){j=k+1;ok++;return esc(w)}return `<span class="miss">${esc(w)}</span>`}).join(" ");
  return {html,score:Math.round(ok/Math.max(1,ex.filter(w=>norm(w)).length)*100)};
}

function mapSVG(W){
  const nodes=[];W.forEach((w,wi)=>w.s.forEach(s=>nodes.push({...s,wi})));
  const cols=6,dx=52,x0=40,dy=66,y0=40;
  const pos=nodes.map((n,i)=>{const r=Math.floor(i/cols),c=i%cols;return [x0+(r%2?cols-1-c:c)*dx,y0+r*dy]});
  const H=y0+(Math.ceil(nodes.length/cols)-1)*dy+28, t=todayISO();
  const done=nodes.map(n=>!!state.run.logs[n.key]); const next=done.indexOf(false);
  const d=a=>a.map((p,i)=>(i?"L":"M")+p.join(" ")).join(" ");
  const walkedTo=next<0?nodes.length:next;
  const labels=W.map((w,i)=>{const k=i*3+1;if(!pos[k])return"";const [x,y]=pos[k];return `<text x="${x}" y="${y-17}" text-anchor="middle">${esc(regionOf(w)[0])}</text>`}).join("");
  const dots=nodes.map((n,i)=>{const [x,y]=pos[i];const fin=n.tag==="Course";
    const cls=`${fin?"final":"n"}${n.tag==="Qualité"?" q":""}${done[i]?" done":""}${n.date===t&&!done[i]?" today":""}`;
    return fin?`<polygon class="${cls}" points="${x},${y-10} ${x+9},${y} ${x},${y+10} ${x-9},${y}"><title>${esc(sessLabel(n,W[n.wi]))}</title></polygon>`
      :`<circle class="${cls}" cx="${x}" cy="${y}" r="${n.tag==="Sortie longue"?7:5.5}"><title>${esc(sessLabel(n,W[n.wi]))} · ${frDate(n.date)}</title></circle>`}).join("");
  const me=next>=0&&pos[next]?`<circle class="me" cx="${pos[next][0]}" cy="${pos[next][1]+14}" r="3.5"/>`:"";
  return `<svg class="map" viewBox="0 0 340 ${H}" role="img" aria-label="Carte du voyage : ${done.filter(Boolean).length} étapes sur ${nodes.length}">
    <path class="route" d="${d(pos)}"/>${walkedTo>0?`<path class="walked" d="${d(pos.slice(0,walkedTo))}"/>`:""}${labels}${dots}${me}</svg>`;
}

    const X=EX[svg.dataset.ex]; if(!X) return;
    const T=X.period*1000*(svg.classList.contains("paused")?1e9:1), ph=(now%T)/T, s=0.5-0.5*Math.cos(2*Math.PI*ph), q={};
    for(const k in X.FA) q[k]=[X.FA[k][0]+(X.FB[k][0]-X.FA[k][0])*s, X.FA[k][1]+(X.FB[k][1]-X.FA[k][1])*s];
    drawFig(svg,q);
  });
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* ---------- Programme du jeudi (aligné sur le plan de course) ---------- */
/* Renfo du coureur : deux séances (A et B) inspirées de Campus Coach, en alternance un jeudi sur deux.
   Valeurs de base = phase « Force ». r = répétitions, s = secondes, e = effort (intense / maximal). */
const SEANCES={
  A:[{tours:4,exos:[{id:"stepup",r:5,e:"maximal"},{id:"legcurl",r:12,e:"intense"},{id:"tibial",r:12,e:"intense"},{id:"mollet_ext",r:12,e:"intense"}]},
     {tours:3,exos:[{id:"chaise",s:30,e:"intense"},{id:"mollet_stat",s:30,e:"intense"},{id:"sissy",r:6,e:"maximal"},{id:"mollet_exc",r:6,e:"maximal"}]}],
  B:[{tours:3,exos:[{id:"squat",r:4,e:"maximal"},{id:"gainage_lat",s:30,e:"intense"},{id:"chaise",s:30,e:"intense"},{id:"mollet_stat",s:30,e:"intense"}]},
     {tours:3,exos:[{id:"stepup",r:4,e:"maximal"},{id:"legcurl",r:12,e:"intense"},{id:"tibial",r:12,e:"intense"},{id:"mollet_ext",r:12,e:"intense"},{id:"gainage",s:30,e:"intense"}]}]
};
const REC_TOUR=90;
function strProgram(abs,i){
  const lettre=(i||0)%2===0?"A":"B";
  let phase,adj;
  if(abs<=3){phase="Fondations";adj={tours:-1,r:0,s:0,light:abs===3}}
  else if(abs<=7){phase="Force";adj={tours:abs===7?-1:0,r:0,s:0,light:abs===7}}
  else if(abs<=10){phase="Dynamique";adj={tours:0,r:1,s:10,pont:true}}
  else {phase="Affûtage";adj={tours:-1,r:0,s:0,light:true}}
  const blocs=SEANCES[lettre].map((b,k)=>{
    const exos=b.exos.map(x=>({...x,r:x.r?x.r+(x.r>=10?adj.r*2:adj.r):undefined,s:x.s?x.s+adj.s:undefined}));
    if(adj.pont&&k===0) exos.push({id:"pont1j",r:10,e:"intense"});
    return {tours:Math.max(2,b.tours+(adj.light?-1:0)+(adj.tours||0)),exos};
  });
  return {phase,seance:lettre,blocs,light:!!adj.light,list:blocs.flatMap(b=>b.exos.map(x=>x.id)).filter((v,j,a)=>a.indexOf(v)===j)};
}
const doseTxt=x=>x.s?`${x.s} s`:`${x.r} rép.${EX[x.id]&&EX[x.id].sides?" par jambe":""}`;

/* ---------- La Forge du vaisseau : chaque jeudi forge une pièce et fissure la Gargouille ---------- */
const FORGE=["Bandelettes de lin","Bottes de marche","Ceinture de cuir","Gantelets de bronze","Brassards de fer","Jambières renforcées","Plastron du Veilleur","Épaulières runiques","Bouclier de l'Aube","Heaume d'ambre","Cape de l'aurore","Bâton forgé à l'Aube"];
function forgeCard(S){
  const n=S.filter(w=>state.str.logs[w.key]).length, tot=S.length, hp=tot-n, pieces=FORGE.slice(FORGE.length-tot);
  return `<div class="card"><span class="kicker" style="color:var(--str)">Progression du renfo</span>
    <h2>${n} séance${n>1?"s":""} sur ${tot}</h2>
    <p class="story">Figée sur les toits, elle change en pierre les muscles qu'on oublie. Chaque jeudi de forge fissure sa carapace et t'apporte une pièce d'armure.</p>
    <div class="foe"><div class="row" style="justify-content:space-between"><b class="foe-name">Gargouille de la Raideur</b><span class="small mono">${hp} / ${tot} PV</span></div><div class="hp"><i style="width:${hp/tot*100}%"></i></div></div>
    <div class="slots">${pieces.map((f,i)=>`<div class="slot ${i<n?"on":""}">${i<n?"✦ ":""}${esc(f)}</div>`).join("")}</div>
  </div>`;
}
function strWeeks(){return weeksPlan().map((w,i)=>({...strProgram(w.abs,i),n:w.n,key:String(i),date:addDays(w.monday,STR_DAY)}))}
/* Déroulé : échauffement, puis chaque bloc en circuit. Exercice en secondes = minuteur ; en répétitions = bouton « Fait ».
   Pas de pause entre les exercices d'un tour (10 s pour se placer), 1 min 30 entre les tours et entre les blocs. */
function buildTimeline(P){
  const tl=[{kind:"warm",ex:"warm",dur:120}];
  P.blocs.forEach((b,bi)=>{
    for(let r=1;r<=b.tours;r++) b.exos.forEach((x,j)=>{
      tl.push({kind:"work",ex:x.id,dur:x.s||null,reps:x.r||null,effort:x.e,round:r,tours:b.tours,bloc:bi+1,nbBlocs:P.blocs.length});
      const lastEx=j===b.exos.length-1, lastTour=r===b.tours, lastBloc=bi===P.blocs.length-1;
      if(lastEx&&lastTour&&lastBloc) return;
      const next=lastEx?(lastTour?P.blocs[bi+1].exos[0]:b.exos[0]):b.exos[j+1];
      tl.push({kind:"rest",ex:next.id,dur:lastEx?REC_TOUR:10,roundBreak:lastEx,blocBreak:lastEx&&lastTour});
    });
  });
  return tl;
}
const tlMinutes=P=>Math.round(buildTimeline(P).reduce((a,x)=>a+(x.dur||x.reps*3.5*(EX[x.ex]&&EX[x.ex].sides?2:1)),0)/60);
function strCurrent(){const S=strWeeks();const wi=curWeekIdx();return {S,wi,cur:S[Math.max(0,Math.min(S.length-1,wi))]}}
function renderQuestStr(){
  const {S,wi,cur}=strCurrent(); const log=state.str.logs[cur.key]; const t=todayISO();
  let pill;
  if(wi>=S.length) pill='<span class="pill neutral">Programme terminé</span>';
  else if(log) pill='<span class="pill ok">Faite cette semaine</span>';
  else if(cur.date===t) pill='<span class="pill warn">Aujourd\'hui</span>';
  else if(cur.date<t) pill='<span class="pill bad">À rattraper</span>';
  else pill=`<span class="pill neutral">${frDate(cur.date)}</span>`;
  $("#qStr").innerHTML=`<span class="k">Renfo · le jeudi</span><span class="big">${esc(cur.phase)} · ~${tlMinutes(cur)} min</span><span class="row">${pill}<span class="pill neutral">${Object.keys(state.str.logs).length} séance${Object.keys(state.str.logs).length>1?"s":""}</span></span>`;
}

let pl=null, plTick=null, actx=null, wake=null;
function beep(f=880,d=0.15){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.start();o.stop(actx.currentTime+d)}catch(e){}}
async function startPlayer(W){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume?.()}catch(e){}
  try{wake=await navigator.wakeLock?.request("screen")}catch(e){wake=null}
  pl={W,tl:buildTimeline(W),i:0,paused:false,startedAt:Date.now()};
  enterInterval(0); clearInterval(plTick); plTick=setInterval(plStep,200); setTab("str");
}
function enterInterval(i){
  pl.i=i; const it=pl.tl[i]; pl.endAt=Date.now()+it.dur*1000; pl.lastSec=null; pl.half=false;
  beep(it.kind==="work"?988:660,0.3);
  if(!it.dur){pl.endAt=Infinity}
  if(it.kind==="warm") speakFr("Échauffement, deux minutes");
  else if(it.kind==="work") speakFr(it.dur?`${EX[it.ex].name}, ${it.dur} secondes`:`${EX[it.ex].name}, ${it.reps} répétitions${EX[it.ex].sides?" par jambe":""}, effort ${it.effort||"intense"}`);
  else speakFr(it.blocBreak?`Récupération. Bloc suivant : ${EX[it.ex].name}`:it.roundBreak?`Récupération. Prochain tour : ${EX[it.ex].name}`:`Ensuite : ${EX[it.ex].name}`);
  renderStr();
}
function plLeft(){const it=pl.tl[pl.i];if(!it.dur)return Infinity;return pl.paused?pl.remaining:Math.max(0,pl.endAt-Date.now())}
function plStep(){
  if(!pl||pl.done||pl.paused) return;
  const it=pl.tl[pl.i]; if(!it.dur) return;
  const left=plLeft(), sec=Math.ceil(left/1000);
  const c=$("#plCount"), b=$("#plBar"); if(c) c.textContent=mmss(sec); if(b) b.style.width=(100-left/(it.dur*10))+"%";
  if(sec!==pl.lastSec){pl.lastSec=sec; if(sec<=3&&sec>=1) beep(520,0.12)}
  if(it.kind==="work"&&EX[it.ex].sides&&!pl.half&&left<=it.dur*500){pl.half=true;beep(740,0.25);speakFr("Change de côté")}
  if(left<=0){ if(pl.i+1<pl.tl.length) enterInterval(pl.i+1); else {pl.done=true;beep(988,0.6);speakFr("Séance terminée, bravo");releasePlayer();renderStr()} }
}
function releasePlayer(){clearInterval(plTick);try{wake?.release()}catch(e){}wake=null}

  p.innerHTML=`<div class="player">

    ${it.kind==="rest"?`<span class="small muted">Ensuite :</span>`:""}
    <h2>${esc(X.name)}${X.sides&&it.kind==="work"&&it.dur?' <span class="pill neutral">change de côté à mi-temps</span>':""}</h2>
    <div class="figbox bigfig">${figSVG(it.ex,pl.paused?"paused":"")}</div>
    ${it.dur?`<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="count" id="plCount">${mmss(Math.ceil(plLeft()/1000))}</span><div class="bar str" style="max-width:60%"><i id="plBar"></i></div></div>`
      :`<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="count">${it.reps} rép.</span><span class="small muted">${X.sides?"par jambe · ":""}à ton rythme</span></div><button class="btn primary str" id="plDone" style="width:100%;padding:16px">✓ Fait</button>`}
    <ul class="small">${X.cues.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
    <div class="row"><button class="btn primary str" id="plPause">${pl.paused?"Reprendre":"Pause"}</button><button class="btn" id="plSkip">Passer</button><button class="btn" id="plStop">Arrêter</button></div>

  </div>`;
  $("#plDone")?.addEventListener("click",()=>{beep(880,0.15);if(pl.i+1<pl.tl.length)enterInterval(pl.i+1);else{pl.done=true;releasePlayer();renderStr()}});
  $("#plPause").onclick=()=>{if(pl.paused){pl.paused=false;pl.endAt=Date.now()+pl.remaining}else{pl.remaining=plLeft();pl.paused=true;stopTTS()}renderStr()};
  $("#plSkip").onclick=()=>{if(pl.i+1<pl.tl.length){pl.paused=false;enterInterval(pl.i+1)}else{pl.done=true;releasePlayer();renderStr()}};
  $("#plStop").onclick=()=>{pl.confirmStop=true;renderStr()};
  if(pl.confirmStop){$("#plStopYes").onclick=()=>{releasePlayer();stopTTS();pl=null;renderAll()};$("#plStopNo").onclick=()=>{pl.confirmStop=false;renderStr()}}

/* ======================================================================
   MONTRE GARMIN via intervals.icu
   - envoie les séances de la semaine (et de la suivante) sur la montre, étape par étape
   - récupère les sorties faites : la séance se coche toute seule (et valide la Compagnie)
   - adapte le plan chaque semaine, avec des règles prudentes ; Claude explique en 3 phrases
   ====================================================================== */
let montre=null; // {ok, athlete} une fois configurée
const allureTxt=(sec,marge=0.02)=>`${mmss(sec*(1-marge))}-${mmss(sec*(1+marge))}/km Pace`;
function dureeTxt(min){return min>=1?`${Math.round(min)}m`:`${Math.round(min*60)}s`}
function recSec(t){const m=String(t).match(/récup\s*(\d+)'(\d+)?/);return m?(+m[1]*60+(+m[2]||0)):90}
function seanceTexte(s){
  const P=paces(), EF=allureTxt(P.EF,0.03), z=P[s.zone]||P.EF;
  const ech=`Échauffement\n- 15m ${EF}\n`, rac=`\nRetour au calme\n- 10m ${EF}`;
  const t=s.title;
  let m;
  if(s.tag==="Course") return `${ech}\nCourse\n- 10km ${allureTxt(P.AS10,0.01)}${rac}`;
  if(s.tag==="Sortie longue"){const min=+(t.match(/^(\d+)/)||[0,60])[1];return `Sortie longue\n- ${min}m ${allureTxt(P.SL,0.04)}`}
  if(m=t.match(/^(\d+)\s*×\s*\((\d+)'\s*vite\s*\/\s*(\d+)'\s*lent\)/)) return `${ech}\n${m[1]}x\n- ${m[2]}m ${allureTxt(P.AS10)}\n- ${m[3]}m ${EF}\n${rac}`;
  if(m=t.match(/^(\d+)\s*×\s*(\d+)\s*m/)) return `${ech}\n${m[1]}x\n- ${m[2]}m ${allureTxt(z)}\n- ${recSec(t)}s ${allureTxt(P.EF*1.1,0.05)}\n${rac}`;
  if(m=t.match(/^(\d+)\s*×\s*(\d+)'/)) return `${ech}\n${m[1]}x\n- ${m[2]}m ${allureTxt(z)}\n- ${recSec(t)}s ${allureTxt(P.EF*1.1,0.05)}\n${rac}`;
  if(m=t.match(/^(\d+)'\s*continu/)) return `${ech}\n- ${m[1]}m ${allureTxt(z)}${rac}`;
  if(m=t.match(/^(\d+)'\s*EF/)) return `Endurance\n- ${m[1]}m ${EF}${/lignes droites|× 1'/.test(t)?`\n\nAccélérations 4x\n- 20s ${allureTxt(P.VMA)}\n- 60s ${EF}`:""}`;
  return `- 45m ${EF}`;
}
async function envoyerSeances(force){
  if(!montre?.ok) return;
  const t=todayISO(); try{if(!force&&localStorage.getItem("montre-envoi")===t)return}catch(e){}
  const W=weeksPlan(), wi=Math.max(0,curWeekIdx());
  const ev=[];
  [W[wi],W[wi+1]].filter(Boolean).forEach(w=>w.s.forEach(s=>{
    if(s.date<t||state.run.logs[s.key]) return;
    ev.push({category:"WORKOUT",type:"Run",start_date_local:s.date+"T00:00:00",name:`S${w.n} · ${s.tag} : ${s.title}`.slice(0,90),
      description:seanceTexte(s),external_id:`carnet-${s.date}-${s.dow}-${s.tag}`.replace(/\s/g,"")});
  }));
  if(!ev.length) return;
  try{await srv("intervals","envoyer",ev);try{localStorage.setItem("montre-envoi",t)}catch(e){};setSync(`${ev.length} séances envoyées sur ta montre`)}
  catch(e){setSync("Envoi sur la montre impossible : "+errTxt(e))}
}
/* Les sorties faites remontent et cochent la séance prévue la plus proche de la même semaine */
async function synchroMontre(){
  if(!montre?.ok) return;
  const t=todayISO(), W=weeksPlan();
  if(!W.length) return;
  const debut=W[0].monday>addDays(t,-21)?W[0].monday:addDays(t,-21);
  let acts=[]; try{acts=await srv("intervals","activites",{oldest:debut,newest:t,connus:Object.keys(state.run.garmin||{})})}catch(e){setSync("Montre : "+errTxt(e));return}
  state.run.garmin=state.run.garmin||{}; let n=0;
  acts.filter(a=>/run/i.test(a.type||"")&&!state.run.garmin[a.id]).sort((a,b)=>a.date<b.date?-1:1).forEach(a=>{
    const w=W.find(w=>a.date>=w.monday&&a.date<=addDays(w.monday,6)); if(!w) return;
    const libres=w.s.filter(s=>!state.run.logs[s.key]);
    const s=libres.find(s=>s.date===a.date)||libres.sort((x,y)=>Math.abs(daysBetween(x.date,a.date))-Math.abs(daysBetween(y.date,a.date)))[0];
    if(!s) return;
    state.run.logs[s.key]={date:a.date,rpe:a.rpe||null,note:"",auto:true,km:a.km,min:a.min,allure:a.allure,fc:a.fc,id:a.id,travail:a.travail||null};
    state.run.garmin[a.id]=s.key; n++;
  });
  if(n){save();renderAll();toast(`${n} sortie${n>1?"s":""} récupérée${n>1?"s":""} de ta montre`)}
  await adapterPlan();
}
/* Adaptation : une fois par semaine terminée. Règles prudentes, ±1 % d'allure au plus par semaine, ±5 % au total. */
async function adapterPlan(){
  const W=weeksPlan(), wi=curWeekIdx(); state.run.bilans=state.run.bilans||{}; state.run.allege=state.run.allege||{};
  for(let i=0;i<Math.min(wi,W.length);i++){
    if(state.run.bilans[i]) continue;
    const w=W[i], logs=w.s.map(s=>state.run.logs[s.key]).filter(Boolean);
    if(semaineVacances(w.monday)) continue;
    const rpes=logs.map(l=>l.rpe).filter(Boolean), rpe=rpes.length?rpes.reduce((a,b)=>a+b,0)/rpes.length:null;
    const qual=w.s.find(s=>s.tag==="Qualité"), lq=qual&&state.run.logs[qual.key];
    const P=paces(), cible=qual?P[qual.zone]:null;
    const ratio=lq&&lq.travail&&cible?lq.travail/cible:null; // < 1 : plus vite que prévu
    let delta=0, allege=false, raison;
    if(logs.length<2){allege=true;raison=`${logs.length} sortie sur 3 : on consolide la semaine suivante (allégée)`}
    else if(rpe&&rpe>=8.5){allege=true;delta=0.01;raison=`effort moyen ${rpe.toFixed(1)}/10 : semaine suivante allégée et allures un peu plus douces`}
    else if(ratio&&ratio>1.03){delta=0.01;raison="fractions plus lentes que la cible : allures assouplies de 1 %"}
    else if(ratio&&ratio<0.98&&(!rpe||rpe<=7)){delta=-0.01;raison="fractions plus rapides que la cible avec un effort maîtrisé : allures accélérées de 1 %"}
    else raison="semaine conforme : on garde la progression prévue";
    const f0=Number(state.run.facteur)||1; state.run.facteur=Math.min(1.05,Math.max(0.95,f0*(1+delta)));
    if(allege&&i+1<W.length) state.run.allege[i+1]=1;
    const bilan={n:w.n,faites:logs.length,rpe,ratio,raison,facteur:state.run.facteur,texte:""};
    state.run.bilans[i]=bilan; save();
    if(sample){try{const {text}=await sample(`Tu es le coach de course de Theron (prépa 10 km, objectif ${state.run.goal}). En 3 phrases courtes, en français, tutoiement, ton encourageant mais honnête : résume sa semaine ${w.n} (${logs.length}/3 sorties${rpe?", effort moyen "+rpe.toFixed(1)+"/10":""}${ratio?", fractions à "+Math.round((1-ratio)*100)+" % de la cible":""}), puis explique la décision : ${raison}. Pas de markdown.`,{modelTier:"quick"});bilan.texte=text.trim();save()}catch(e){}}
    envoyerSeances(true);
  }
  renderAll();
}
async function initMontre(){try{montre=await srv("intervals","etat",{});if(montre?.ok){await synchroMontre();await envoyerSeances()}}catch(e){montre=null}}
function bilanCourseHTML(){const B=state.run.bilans||{};const k=Object.keys(B).map(Number).sort((a,b)=>b-a)[0];if(k==null)return"";const b=B[k];
  return `<div class="card"><span class="kicker" style="color:var(--run)">Bilan de la semaine ${b.n}</span><p>${esc(b.texte||b.raison)}</p><p class="small muted">Décision : ${esc(b.raison)}${Math.abs((b.facteur||1)-1)>0.001?` · allures ×${(b.facteur||1).toFixed(2).replace(".",",")}`:""}</p></div>`}
function montreHTML(){
  return `<h2>Montre Garmin (intervals.icu)</h2>
  <p class="small muted">${montre?.ok?`Connectée à intervals.icu (${esc(montre.athlete||"")}). Les séances partent sur ta montre et tes sorties reviennent toutes seules.`:"Relie ton compte intervals.icu pour envoyer les séances sur ta montre et récupérer tes sorties."}</p>
  <div class="grid2"><label>Identifiant d'athlète<input id="miId" placeholder="i123456" autocomplete="off"></label><label>Clé API<input id="miKey" type="password" placeholder="${montre?.ok?"déjà enregistrée":"colle ta clé"}" autocomplete="off"></label></div>
  <div class="row"><button class="btn sm" id="miSave">Enregistrer et tester</button>${montre?.ok?'<button class="btn sm" id="miPush">Renvoyer les séances</button><button class="btn sm" id="miSync">Récupérer mes sorties</button>':""}</div><p class="small" id="miMsg"></p>`}
function bindMontre(){
  $("#miSave")&&($("#miSave").onclick=async e=>{const id=$("#miId").value.trim(),key=$("#miKey").value.trim();if(!id||!key){$("#miMsg").textContent="Les deux champs sont nécessaires.";return}
    e.target.disabled=true;$("#miMsg").textContent="Connexion…";
    try{montre=await srv("intervals","config",{id,key});$("#miMsg").innerHTML='<span class="okc2">Connecté : '+esc(montre.athlete||"")+'</span>';await envoyerSeances(true);renderSet()}catch(er){$("#miMsg").innerHTML='<span class="badc2">'+esc(errTxt(er))+'</span>';e.target.disabled=false}});
  $("#miPush")&&($("#miPush").onclick=async()=>{await envoyerSeances(true);$("#miMsg").textContent="Séances envoyées. Synchronise ta montre dans Garmin Connect si elles n'apparaissent pas."});
  $("#miSync")&&($("#miSync").onclick=async()=>{$("#miMsg").textContent="Récupération…";await synchroMontre();$("#miMsg").textContent="À jour."});
}

/* ======================================================================
   RÉGLAGES
   ====================================================================== */
function renderSet(){
  const D=state.run.days, opt=v=>DAYS.map((d,i)=>`<option value="${i}" ${i===v?"selected":""}>${d}${i===STR_DAY?" (renfo)":""}</option>`).join("");
  $("#p-set").innerHTML=`
  <div class="row" style="justify-content:space-between"><button class="btn sm" id="setBack">← Retour</button><h2>Réglages</h2></div>
  <p class="small muted" style="text-align:right;margin:0">Version du Carnet : 28/10 (renfo A/B, montre, lexique avancé)</p>
  <div class="card" id="acct">${acctHTML()}</div>
  <div class="card" id="montre">${montreHTML()}</div>
  <div class="card"><h2>Course</h2>
    <div class="grid2">
      <label>Objectif 10 km (min:s)<input id="sg" value="${esc(state.run.goal)}"></label>
      <label>Dernier 10 km couru<input id="sr" value="${esc(state.run.ref)}"></label>
      <label>Début du plan (un lundi)<input type="date" id="ss" value="${esc(state.run.start)}"></label>
      <label>Durée du plan<select id="sw">${[8,10,12].map(n=>`<option ${+state.run.weeks===n?"selected":""}>${n}</option>`).join("")}</select></label>
      <label>Jour de la séance de qualité<select id="dq">${opt(D.q)}</select></label>
      <label>Jour du seuil / endurance<select id="ds">${opt(D.s)}</select></label>
      <label>Jour de la sortie longue<select id="dl">${opt(D.l)}</select></label>
    </div>
    <p class="small muted">Conseillé : lundi seuil, mercredi qualité, jeudi renfo, samedi sortie longue. Évite deux séances dures d'affilée, et la qualité le lendemain du renfo.</p>
  </div>
  <div class="card"><h2>Anglais</h2>
    <div class="grid2">
      ${Object.entries(MODULES).map(([k,m])=>`<label>Unité ${m.name}<select id="su-${k}">${m.units.map((u,i)=>`<option value="${i}" ${i===state.en.mods[k].unit?"selected":""}>${i+1}. ${esc(u[0])}</option>`).join("")}</select></label>`).join("")}
      <label>Vitesse de lecture audio<select id="st">${[0.75,0.85,1].map(r=>`<option ${Number(state.ttsRate)===r?"selected":""}>${r}</option>`).join("")}</select></label>
    </div>
    <div class="row"><button class="btn sm" id="newl">Recréer la mission du monde actif</button></div>
  </div>
  <div class="row"><button class="btn primary" id="sv">Enregistrer</button><span id="svm" class="small muted"></span></div>`;
  $("#sv").onclick=()=>{
    state.run.goal=$("#sg").value.trim();state.run.ref=$("#sr").value.trim();state.run.start=mondayOf($("#ss").value||state.run.start);state.run.weeks=+$("#sw").value;
    state.run.days={q:+$("#dq").value,s:+$("#ds").value,l:+$("#dl").value};
    for(const k in MODULES){const u=+$("#su-"+k).value;if(u!==state.en.mods[k].unit){state.en.mods[k].unit=u;state.en.mods[k].pack=null}}
    state.ttsRate=+$("#st").value;save();renderAll();$("#svm").textContent="Enregistré";
  };
  $("#newl").onclick=()=>{state.en.mods[state.en.active].pack=null;save();$("#svm").textContent="Une nouvelle mission sera créée au prochain lancement."};
  $("#setBack").onclick=()=>setTab(lastTab);
  bindAcct(); bindMontre();
}

/* ---------- Compte : clé API, vitesse des missions, code d'accès (stockés côté Google) ---------- */
let acct=null, acctMsg="";
const ERRS={KEY_REFUSED:"Clé refusée par Claude : vérifie-la (elle commence par sk-ant-).",BAD_CODE:"Le code doit faire au moins 8 caractères (lettres et chiffres).",NO_KEY:"Aucune clé API enregistrée.",BAD_TOKEN:"Code d'accès refusé.",LOCKED:"Trop d'essais : réessaie dans 15 minutes."};
const errTxt=e=>{const m=String((e&&e.message)||e);const k=Object.keys(ERRS).find(x=>m.includes(x));return k?ERRS[k]:"Erreur : "+m.replace(/^Error:\s*/,"").slice(0,160)};
function acctHTML(){
  if(!acct) return '<h2>Compte et IA</h2><p class="muted">Chargement…</p>';
  return `<h2>Compte et IA</h2>
  <div class="gap"><b>Clé API Claude</b>
    <span class="small ${acct.hasKey?"okc2":"badc2"}">${acct.hasKey?"Enregistrée (se termine par …"+esc(acct.keyEnd)+")":"Aucune clé : les missions ne peuvent pas être créées."}</span>
    <input id="akey" type="password" autocomplete="off" placeholder="${acct.hasKey?"Remplacer par une nouvelle clé":"Colle ta clé (sk-ant-…)"}">
    <div class="row"><button class="btn sm" id="akeySave">Enregistrer la clé</button><button class="btn sm" id="atest" ${acct.hasKey?"":"disabled"}>Tester Claude</button></div></div>
  <label>Création des missions<select id="amode">
    <option value="fast" ${acct.mission==="fast"?"selected":""}>Rapide (Haiku, environ 15 s, conseillé)</option>
    <option value="quality" ${acct.mission==="quality"?"selected":""}>Soignée (Sonnet, 30 à 60 s)</option></select></label>
  <p class="small muted">En mode Soignée, si Claude met trop de temps, l'app repasse toute seule en Rapide pour cette mission. Les corrections et le boss sont toujours en Rapide.</p>
  ${acctMsg?`<p class="small" id="amsg">${acctMsg}</p>`:""}`;
}
function paintAcct(msg){if(msg!=null)acctMsg=msg;const c=$("#acct");if(c){c.innerHTML=acctHTML();bindAcct()}}
async function loadAcct(){try{acct=await srv("getConfig");paintAcct()}catch(e){acct={hasKey:false,keyEnd:"",mission:"fast"};paintAcct(esc(errTxt(e)))}}
function bindAcct(){
  if(!acct) return;
  const busy=(b,t)=>{b.disabled=true;b.textContent=t};
  $("#akeySave").onclick=async e=>{const v=$("#akey").value.trim();if(!v)return;busy(e.target,"Vérification…");
    try{acct=await srv("setConfig",{apiKey:v});paintAcct('<span class="okc2">Clé enregistrée et acceptée par Claude.</span>')}catch(er){paintAcct('<span class="badc2">'+esc(errTxt(er))+'</span>')}};
  $("#atest").onclick=async e=>{busy(e.target,"Test en cours…");
    try{const r=await srv("testClaude");paintAcct(`<span class="okc2">Claude répond : ${(r.ms/1000).toFixed(1).replace(".",",")} s pour une mission type (${esc(r.model)}).</span>`)}catch(er){paintAcct('<span class="badc2">'+esc(errTxt(er))+'</span>')}};
  $("#amode").onchange=async e=>{try{acct=await srv("setConfig",{mission:e.target.value});for(const k in MODULES)state.en.mods[k].pack=null;save();paintAcct("Réglage enregistré.")}catch(er){paintAcct('<span class="badc2">'+esc(errTxt(er))+'</span>')}};
  if($("#acodeSave")) $("#acodeSave").onclick=async e=>{const v=$("#acode").value.trim().toUpperCase();if(!v)return;busy(e.target,"…");
    try{await srv("changeCode",v);paintAcct(`<span class="okc2">Nouveau code : ${esc(v)}. Note-le : il faudra le taper sur tes autres appareils.</span>`);setTimeout(()=>toParent({t:"quetes-code",code:v}),2500)}catch(er){paintAcct('<span class="badc2">'+esc(errTxt(er))+'</span>')}};

}

   NAVIGATION

let tab="en", lastTab="en";
function setTab(t){if(t!=="set")lastTab=t;else if(!acct)loadAcct();$("#gear").setAttribute("aria-pressed",t==="set");tab=t;document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));["en","run","str","set"].forEach(k=>$("#p-"+k).hidden=k!==t);try{localStorage.setItem("quetes-tab",t)}catch(e){}if(t==="run")setTimeout(()=>document.getElementById("curweek")?.scrollIntoView({block:"start",behavior:"smooth"}),50)}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setTab(b.dataset.go));
